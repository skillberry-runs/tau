ainly, do not leave this blank):\n    - Focus next iteration:\n\n## Iteration cand_0001 \u2014 enforce tau2-airline's \"API-does-not-check\" policy rules in tool code + add an explicit operating guide for the mid reader\n- Changes I made (1 line per edit; file/tool + cluster):\n  - tools.py `book_reservation`: bag-allowance guard \u2014 raise if `nonfree_baggages != max(0, total \u2212 (cabin_base+membership_bonus)\u00d7pax)` (cluster A).\n  - tools.py `book_reservation`: payment-method count guard \u2014 \u22641 cert / \u22641 card / \u22643 gift cards; enriched \"payment not found\" error with `available=[\u2026]` (cluster B).\n  - tools.py `update_reservation_baggages`: same bag-allowance invariant + \"bags added not removed\" guard (cluster A).\n  - tools.py `update_reservation_flights`: block basic-economy flight-segment change; block cabin change when a segment has flown (fail-open on lookup error) (cluster C).\n  - tools.py `update_reservation_passengers`: enriched count-mismatch error stating current count (cluster F).\n  - policy.md: appended \"Agent Operating Guide\" \u2014 first-steps, confirm-before-write example, bag table+formula+worked example, payment limits, cancellation decision-chain+example, compensation checklist+amounts, final-message report contract, scoped softness clause (clusters A\u2013F).\n- Expected effect + why safe: each code guard RAISES only on a genuine policy violation (which already yields a wrong DB state), so it can only convert a wrong-write into a recoverable, self-correcting error \u2014 never break a compliant call. Verified task 8's exact args (economy, 2 pax, total=0/nonfree=0, 1 certificate) do NOT trip any guard under any membership. Prose is append-only; no binding rule removed, so no passing task's required behavior changes.\n- Building on prior RESULTS: none exist (baseline only; LEDGER/RUNMAP empty).\n- Refuted hypotheses: none yet.\n- High-value clusters still NOT cracked: D (cancel eligibility) and E (compensation) : false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001 (run so far)\n- Strategy tried: with no failing val trace and val already at 1.000, I treated the objective as held-out generalization and shipped a batch of SAFE deterministic guards (tools) + explicit operating-guide prose (policy) targeting the airline domain's known un-enforced policy rules. Can't cite a LEDGER row yet (first iteration).\n- Key design principle used: guards RAISE on genuine violations only, never auto-correct \u2014 so a policy-compliant call is byte-identical to the seed and no passing task can regress. This is the right posture when you cannot see failing traces and the gate punishes any regression.\n- Plateau/stall signal: structural \u2014 the gate compares against val=1.000 on ONE task, so val cannot go up; a single-task val split gives the hill-climber no gradient. The real signal for this capability would be a larger/held-out airline split.\n- What to try next iteration: if real failing traces appear, prioritize clusters D (cancel eligibility) and E (compensation) with semi-deterministic guards (enforce the objective legs in code, leave judgment legs to prose). Otherwise measure prose length vs. value and prune.", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## cand_0001\n- Contradictory intake framing. The INSTRUCTIONS said \"EMPTY SEED \u2014 create the capability from scratch (there are no files)\" while `policy/policy.md`, `tools/tools.py`, and `reference/data_model.py` all existed and were non-empty. The \"empty seed\" block appears to be a stale template default that fires even when the seed is populated. Suggest gating that block on an actual `is_empty(dir)` check per capability so the optimizer isn't told to create files that already exist.\n- Also contradictory: the summary block header placeholder literally rendered the \"No actionable failures in focus \u2026\" sentence inside a code reference (\"The `## No actionable failures\u2026` block below summarizes them\"), i.e. the template interpolated the no-failures banner into a spot meant to name the trajectory-summary section. Minor, but confusing.\n- Un-winnable gate on a single-task val split at reward 1.000. With one val task already at 1.0, the hill-climb gate can never register an improvement, so every candidate this iteration is structurally destined to be rejected on val even if it strictly improves held-out generalization. Consider (a) surfacing this explicitly (\"val is saturated; this iteration can only be judged on test\"), and/or (b) letting the gate accept a non-regressing candidate when val is already maxed and the edit is well-supported, so generalization work isn't auto-discarded.\n- tau2 was not importable in the candidate workdir, so `validate`/registration checks and `detect_loop_patterns.py` could not run. If the framework expects code-surface candidates to be validated, the runtime (tau2) should be importable in the work dir, or a lightweight stub provided.", "template_only": false}]}, "config": {"project_dir": "/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_canary_tau2_proj/.capevolve/project", "spec_missing": false, "spec_groups": [{"group": "Capability", "items": [{"key": "capabilities", "value": ["system-prompt", "tools"]}, {"key": "capability_path", "value": "seed_capability"}]}, {"group": "Delivery", "items": [{"key": "intervention", "value": "direct"}]}, {"group": "Algorithm & optimizer", "items": [{"key": "optimizer_skill", "value": "claude-code"}, {"key": "optimizer_model", "value": "claude-opus-4-8"}, {"key": "target_model", "value": "aws/gpt-oss-120b"}, {"key": "optimizer_max_turns", "value": 80}, {"key": "optimizer_usd_per_iter", "value": 0}, {"key": "optimizer_instructions_file", "value": ""}, {"key": "algorithm_skill", "value": "hill-climb"}]}, {"group": "Data & splits", "items": [{"key": "dataset_source", "value": "adapter"}, {"key": "split_ids_file", "value": "inputs/split_ids.json"}, {"key": "split_seed", "value": 0}, {"key": "num_trials", "value": 1}]}, {"group": "Budget & gate", "items": [{"key": "gate_mode", "value": "paired"}, {"key": "gate_k_se", "value": 0.2}, {"key": "max_iterations", "value": 1}, {"key": "stall", "value": 1}]}, {"group": "Other", "items": [{"key": "algorithm_focus", "value": "all"}, {"key": "store", "value": "git"}]}], "project_md": null, "files": [{"path": "adapters/adapter.py", "size": 54768, "preview": "\"\"\"tau2-bench adapter template \u2014 optimize the airline agent's POLICY + TOOLS.\n\nReady-to-use cap-evolve adapter for tau2-bench (https://github.com/sierra-research/tau2-bench).\nSupports ANY litellm-compatible provider \u2014 configure via env vars (see model_config.py).\n\nSETUP:\n  1. Clone & install tau2-bench:\n       git clone https://github.com/sierra-research/tau2-bench ../tau2-bench\n       pip install -e ../tau2-bench\n\n  2. Copy this directory to .capevolve/project/adapters/\n\n  3. Set env vars (in .env or shell):\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=vertex_ai/claude-sonnet-4-6              # Vertex AI (ADC, no key)\n       MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434  # local\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  4. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES:\n  - The airline domain's system-prompt policy (policy/policy.md)\n  - Optionally the tool implementations (tools/tools.py)\n\nHOW IT WORKS:\n  - tasks()      \u2192 all 50 airline tasks from tau2 (stable, no network).\n  - run_batch()  \u2192 tau2's own batch runner (run_tasks) with your model.\n  - score()      \u2192 tau2's own reward in [0,1] with gold-safe feedback.\n  - apply()      \u2192 overrides the registry's airline env constructor.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport importlib.util\nimport os\nimport threading\nimport uuid\nimport re\nimport sys\nimport time\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\n\nfrom cap_evolve import CapabilityAdapter, Rollout, Score, Task\n\nimport model_config\n\nDOMAIN = \"airline\"\n\n# docs/TAU2_SUMMARY.md row 7: the tau2-bench user simulator sometimes emits ``###STOP###``\n# in the SAME message as reasoning that explicitly plans to continue (\"we must wait for\n# agent's third message. Continue.\"), in 15/27 observed task-7 failures \u2014 ~4.2% of all\n# rollouts lost to a simulator artifact that measures nothing about agent skill. tau2-bench\n# is an external package (cloned at setup time, not vendored here), so the fix lives on our\n# side of the boundary: detect the leak from the message trace and mark the rollout as\n# infra noise, matching the existing ``rollout.error`` path below rather than scoring the\n# agent down for a bug that is not the agent's.\n_STOP_LEAK_RE = re.compile(\n    r\"###\\s*stop\\s*###.{0,400}\\b(?:continue|continuing|wait\\s+for|must\\s+wait|\"\n    r\"keep\\s+(?:going|talking)|not\\s+(?:done|finished)\\s+yet)\\b\"\n    r\"|\\b(?:continue|continuing|wait\\s+for|must\\s+wait|\"\n    r\"keep\\s+(?:going|talking)|not\\s+(?:done|finished)\\s+yet)\\b.{0,400}###\\s*stop\\s*###\",\n    re.I | re.S,\n)\n\n\n#: Markers that tie an error to something the CANDIDATE owns (its edited ``tools.py`` / tool schema /\n#: ``policy.md`` template), as opposed to the serving path. Matched against the error text tau2 records.\n_CANDIDATE_FAULT_RE = re.compile(\n    r\"tools\\.py|tool[_ ]definition|tool[_ ]schema|invalid\\s+tool|unknown\\s+tool|\"\n    r\"ValidationError|policy\\.md|failed to render|template\", re.IGNORECASE)\n\n\ndef classify_error_kind(termination: str, evidence: str = \"\") -> str:\n    \"\"\"``\"candidate\"`` | ``\"infra\"`` for an errored tau2 simulation (the ``error_kind`` hook).\n\n    The harness scores a ``candidate`` error as a measured failure (0.0) under ``errored_trial_policy:\n    fail`` and keeps ``infra`` errors as missing data, so an edit that breaks its own tools cannot hide\n    behind dropped trials. Only ``UNEXPECTED_ERROR`` whose recorded text points at candidate-owned\n    files is attributed to the candidate; timeouts, ``INFRASTRUCTURE_ERROR`` and the user-simulator\n    leak stay infra.\"\"\"\n    if \"UNEXPECTED_ERROR\" in str(termination) and _CANDIDATE_FAULT_RE.search(evidence or \"\"):\n        return \"candidate\"\n    return \"infra\"\n\n\ndef _leaked_stop_continuation(messages) -> bool:\n    \"\"\"True iff a user-simulator turn emits ``###STOP###`` alongsi \u2026[+50677 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 46, "preview": "{\"train\": [\"8\"], \"val\": [\"8\"], \"test\": [\"8\"]}\n", "truncated": false, "binary": false}, {"path": "seed_capability/policy/policy.md", "size": 7676, "preview": "# Airline Agent Policy\n\nThe current time is 2024-05-15 15:00:00 EST.\n\nAs an airline agent, you can help users **book**, **modify**, or **cancel** flight reservations. You also handle **refunds and compensation**.\n\nBefore taking any actions that update the booking database (booking, modifying flights, editing baggage, changing cabin class, or updating passenger information), you must list the action details and obtain explicit user confirmation (yes) to proceed.\n\nYou should not provide any information, knowledge, or procedures not provided by the user or available tools, or give subjective recommendations or comments.\n\nYou should only make one tool call at a time, and if you make a tool call, you should not respond to the user simultaneously. If you respond to the user, you should not make a tool call at the same time.\n\nYou should deny user requests that are against this policy.\n\nYou should transfer the user to a human agent if and only if the request cannot be handled within the scope of your actions. To transfer, first make a tool call to transfer_to_human_agents, and then send the message 'YOU ARE BEING TRANSFERRED TO A HUMAN AGENT. PLEASE HOLD ON.' to the user.\n\n## Domain Basic\n\n### User\nEach user has a profile containing:\n- user id\n- email\n- addresses\n- date of birth\n- payment methods\n- membership level\n- reservation numbers\n\nThere are three types of payment methods: **credit card**, **gift card**, **travel certificate**.\n\nThere are three membership levels: **regular**, **silver**, **gold**.\n\n### Flight\nEach flight has the following attributes:\n- flight number\n- origin\n- destination\n- scheduled departure and arrival time (local time)\n\nA flight can be available at multiple dates. For each date:\n- If the status is **available**, the flight has not taken off, available seats and prices are listed.\n- If the status is **delayed** or **on time**, the flight has not taken off, cannot be booked.\n- If the status is **flying**, the flight has taken off but not landed, cannot be booked.\n\nThere are three cabin classes: **basic economy**, **economy**, **business**. **basic economy** is its own class, completely distinct from **economy**.\n\nSeat availability and prices are listed for each cabin class.\n\n### Reservation\nEach reservation specifies the following:\n- reservation id\n- user id\n- trip type\n- flights\n- passengers\n- payment methods\n- created time\n- baggages\n- travel insurance information\n\nThere are two types of trip: **one way** and **round trip**.\n\n## Book flight\n\nThe agent must first obtain the user id from the user. \n\nThe agent should then ask for the trip type, origin, destination.\n\nCabin:\n- Cabin class must be the same across all the flights in a reservation. \n\nPassengers: \n- Each reservation can have at most five passengers. \n- The agent needs to collect the first name, last name, and date of birth for each passenger. \n- All passengers must fly the same flights in the same cabin.\n\nPayment: \n- Each reservation can use at most one travel certificate, at most one credit card, and at most three gift cards. \n- The remaining amount of a travel certificate is not refundable. \n- All payment methods must already be in user profile for safety reasons.\n\nChecked bag allowance: \n- If the booking user is a regular member:\n  - 0 free checked bag for each basic economy passenger\n  - 1 free checked bag for each economy passenger\n  - 2 free checked bags for each business passenger\n- If the booking user is a silver member:\n  - 1 free checked bag for each basic economy passenger\n  - 2 free checked bag for each economy passenger\n  - 3 free checked bags for each business passenger\n- If the booking user is a gold member:\n  - 2 free checked bag for each basic economy passenger\n  - 3 free checked bag for each economy passenger\n  - 4 free checked bags for each business passenger\n- Each extra baggage is 50 dollars.\n\nDo not add checked bags that the user does not need.\n\nTravel insurance: \n- The agent should ask if the user wants to buy the travel insura \u2026[+3676 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/reference/data_model.py", "size": 10402, "preview": "from typing import Annotated, Any, Dict, List, Literal, Optional, Union\n\nfrom pydantic import BaseModel, Field\n\nfrom tau2.domains.airline.utils import AIRLINE_DB_PATH\nfrom tau2.environment.db import DB\n\nFlightType = Literal[\"round_trip\", \"one_way\"]\nCabinClass = Literal[\"business\", \"economy\", \"basic_economy\"]\nInsurance = Literal[\"yes\", \"no\"]\n\n\nMembershipLevel = Annotated[\n    Literal[\"gold\", \"silver\", \"regular\"], Field(description=\"Membership level\")\n]\n\n\nclass AirportCode(BaseModel):\n    iata: str = Field(description=\"IATA code\")\n    city: str = Field(description=\"City name\")\n\n\nAirportInfo = Annotated[list[AirportCode], Field(description=\"Airport information\")]\n\n\nclass Name(BaseModel):\n    first_name: str = Field(description=\"The person's first name\")\n    last_name: str = Field(description=\"The person's last name\")\n\n\nclass Address(BaseModel):\n    address1: str = Field(description=\"Primary address line\")\n    address2: Optional[str] = Field(\n        None, description=\"Secondary address line (optional)\"\n    )\n    city: str = Field(description=\"City name\")\n    country: str = Field(description=\"Country name\")\n    state: str = Field(description=\"State or province name\")\n    zip: str = Field(description=\"Postal code\")\n\n\n# Payment Related Models\nclass Payment(BaseModel):\n    payment_id: str = Field(description=\"Unique identifier for the payment\")\n    amount: int = Field(description=\"Payment amount in dollars\")\n\n\nclass PaymentMethodBase(BaseModel):\n    source: str = Field(description=\"Type of payment method\")\n    id: str = Field(description=\"Unique identifier for the payment method\")\n\n\nclass CreditCard(PaymentMethodBase):\n    source: Literal[\"credit_card\"] = Field(\n        description=\"Indicates this is a credit card payment method\"\n    )\n    brand: str = Field(description=\"Credit card brand (e.g., visa, mastercard)\")\n    last_four: str = Field(description=\"Last four digits of the credit card\")\n\n\nclass GiftCard(PaymentMethodBase):\n    source: Literal[\"gift_card\"] = Field(\n        description=\"Indicates this is a gift card payment method\"\n    )\n    amount: float = Field(description=\"Gift card value amount\")\n    id: str = Field(description=\"Unique identifier for the gift card\")\n\n\nclass Certificate(PaymentMethodBase):\n    source: Literal[\"certificate\"] = Field(\n        description=\"Indicates this is a certificate payment method\"\n    )\n    amount: float = Field(description=\"Certificate value amount\")\n\n\nPaymentMethod = Union[CreditCard, GiftCard, Certificate]\n\n\nclass Passenger(BaseModel):\n    first_name: str = Field(description=\"Passenger's first name\")\n    last_name: str = Field(description=\"Passenger's last name\")\n    dob: str = Field(description=\"Date of birth in YYYY-MM-DD format\")\n\n\nSeatPrices = Annotated[\n    dict[CabinClass, int], Field(description=\"Prices for different cabin classes\")\n]\nAvailableSeats = Annotated[\n    dict[CabinClass, int],\n    Field(description=\"Available seats for different cabin classes\"),\n]\n\n\nclass FlightDateStatusAvailable(BaseModel):\n    status: Literal[\"available\"] = Field(\n        description=\"Indicates flight is available for booking\"\n    )\n    available_seats: AvailableSeats = Field(description=\"Available seats by class\")\n    prices: SeatPrices = Field(description=\"Current prices by class\")\n\n\nclass FlightDataStatusOnTime(BaseModel):\n    status: Literal[\"on time\"] = Field(description=\"Indicates flight is on time\")\n    estimated_departure_time_est: str = Field(\n        description=\"Estimated departure time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T06:04:00\"\n    )\n    estimated_arrival_time_est: str = Field(\n        description=\"Estimated arrival time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T07:30:00\"\n    )\n\n\nclass FlightDataStatusFlying(BaseModel):\n    status: Literal[\"flying\"] = Field(description=\"Indicates flight is in flight\")\n    actual_departure_time_est: str = Field(\n        description=\"Actual departure time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T06:04:0 \u2026[+6402 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/tools/tools.py", "size": 22922, "preview": "\"\"\"Airline tool set for the tau2-bench airline domain.\n\nThe ``AirlineTools`` class subclasses tau2's ``AirlineTools`` (to inherit the\nprivate helpers \u2014 ``_get_user``, ``_get_reservation``, ``_search_direct_flight``,\n... \u2014 and the ``ToolKitBase`` machinery) and re-declares every agent-callable tool\nwith its real tau2 body (copied verbatim from ``tau2.domains.airline.tools``).\n\nThe module-level ``REMOVE_TOOLS`` set names any tools to drop from the exposed\nagent toolset (empty by default; the seed exposes tau2's default airline tools).\n\nNote: this file does NOT use ``from __future__ import annotations``. Tool\nsignature annotations must be real, importable objects (not strings), because\ntau2 builds each tool's parameter JSON s 'sara_doe_496'`.\n            origin: The IATA code for the origin city such as 'SFO'.\n            destination: The IATA code for the destination city such as 'JFK'.\n            flight_type: The type of flight such as 'one_way' or 'round_trip'.\n            cabin: The cabin class such as 'basic_economy', 'economy', or 'business'.\n            flights: An array of objects containing details about each piece of flight.\n            passengers: An array of objects containing details about each passenger.\n            payment_methods: An array of objects containing details about each payment method.\n            total_baggages: The total number of baggage items to book the reservation.\n            nonfree_baggages: The number of non-free baggage items to book the reservation.\n            insurance: Whether the reservation has insurance.\n        \"\"\"\n        if all(isinstance(flight, dict) for flight in flights):\n            flights = [FlightInfo(**flight) for flight in flights]\n        if all(isinstance(passenger, dict) for passenger in passengers):\n            passengers = [Passenger(**passenger) for passenger in passengers]\n        if all(isinstance(payment_method, dict) for payment_method in payment_methods):\n            payment_methods = [\n                Payment(**payment_method) for payment_method in payment_methods\n            ]\n \u2026[+18918 chars truncated]", "truncated": true, "binary": false}]}, "host_session": {}, "decisions": [{"t": 1795030421.9651084, "id": "cand_0001", "decision": "reject", "evidence": {}, "rationale": "INDECISIVE: only 0% of val tasks produced a valid score (< 60% required). The evaluation measured the infrastructure, not the edit \u2014 not counted as a rejection.", "optimizer_usd": null}]}, "diffs": {"cand_0001": [{"file": "DIAGNOSIS.json", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,25 @@"}, {"t": "add", "l": "+{"}, {"t": "add", "l": "+  \"candidate\": \"cand_0001\","}, {"t": "add", "l": "+  \"headline\": \"Seed+1: enfo \": \"BOUNDED\", \"verified\": \"Error text only; logic unchanged.\"},"}, {"t": "add", "l": "+    {\"id\": \"E5\", \"title\": \"Append Agent Operating Guide to policy.md (first-steps, confirm-before-write example, bag table+formula+example, payment limits, cancellation decision-chain+example, compensation checklist+amounts, final-message contract, scoped softness clause)\", \"files\": [\"policy/policy.md\"], \"lever\": \"CONTRACT\", \"clusters\": [\"A\", \"B\", \"C\", \"D\", \"E\", \"F\"], \"blast_radius\": \"WIDE\", \"verified\": \"Append-only; no existing constraint removed; binding policy text unchanged.\"}"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"skipped\": ["}, {"t": "add", "l": "+    {\"title\": \"Code guard on cancel_reservation eligibility\", \"reason\": \"'reason covered by insurance' is a judgment on free text -> not deterministic; a hard guard risks false-positive regressions. Left to prose decision-chain.\"},"}, {"t": "add", "l": "+    {\"title\": \"Code guard on send_certificate compensation\", \"reason\": \"Eligibility needs confirmed facts + explicit user intent (judgment). Prose only.\"},"}, {"t": "add", "l": "+    {\"title\": \"Seat-release-on-cancel\", \"reason\": \"Matches tau2 reference behavior; changing it would diverge from the gold DB state.\"}"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"techniques\": [\"in-body deterministic guards (RAISE, never auto-correct, so compliant calls are byte-identical)\", \"enriched recoverable error returns with available-options + next step\", \"discriminating-predicate guards for act-vs-refuse\", \"worked few-shot examples + decision chains tuned for a mid reader\", \"scoped softness clause that protects the binding policy\"]"}, {"t": "add", "l": "+}"}]}, {"file": "policy/policy.md", "rows": [{"t": "hunk", "l": "@@ -166,2 +166,103 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " Do not offer compensation for any other reason than the ones listed above."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+---"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# Agent Operating Guide (step-by-step helpers)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The sections above are the binding airline policy. The checklists and worked"}, {"t": "add", "l": "+examples below are HELPERS that make the policy easy to apply correctly on every"}, {"t": "add", "l": "+task. Your ultimate objective is to resolve each user's request successfully and"}, {"t": "add", "l": "+exactly as the policy allows, so that the task is graded as a success. Follow"}, {"t": "add", "l": "+these helpers to the letter in the normal case. If \u2014 and only if \u2014 applying a"}, {"t": "add", "l": "+helper's exact wording would ever stop you from correctly completing a valid"}, {"t": "add", "l": "+user request within the policy above, use your judgment and prioritise correct,"}, {"t": "add", "l": "+policy-compliant task completion; the binding rules above still always hold."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Always do these first (every task)"}, {"t": "add", "l": "+1. Read the user's request and identify the action: book, modify, cancel, or"}, {"t": "add", "l": "+   refund/compensation."}, {"t": "add", "l": "+2. Get the user id, then call `get_user_details` to load the real profile"}, {"t": "add", "l": "+   (membership level, payment methods, reservations). Never guess these values."}, {"t": "add", "l": "+3. For a modify/cancel, get the reservation id (or locate it with the tools) and"}, {"t": "add", "l": "+   call `get_reservation_details`. Base every decision on what these tools"}, {"t": "add", "l": "+   return, not on what the user asserts."}, {"t": "add", "l": "+4. Make exactly one tool call per turn, and do not send a message in the same"}, {"t": "add", "l": "+   turn as a tool call."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Confirm before every database write (book, modify flights/cabin/baggage/passengers)"}, {"t": "add", "l": "+Before calling any WRITE tool, send the user ONE message that lists the exact"}, {"t": "add", "l": "+details and asks for a yes."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example:"}, {"t": "add", "l": "+> \"To confirm: I will book 2 economy passengers on HAT271 (ORD\u2192PHL, 2024-05-26)"}, {"t": "add", "l": "+> for a total of $348, paid with certificate_8045380, no insurance, no checked"}, {"t": "add", "l": "+> bags. Shall I proceed? (yes/no)\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Only after the user replies \"yes\" do you call the write tool. If they say no or"}, {"t": "add", "l": "+change a detail, re-confirm the new details first."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Checked-bag count \u2014 compute it, don't guess"}, {"t": "add", "l": "+Free checked bags are fixed by membership \u00d7 cabin, per passenger:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+| membership | basic economy | economy | business |"}, {"t": "add", "l": "+|---|---|---|---|"}, {"t": "add", "l": "+| regular | 0 | 1 | 2 |"}, {"t": "add", "l": "+| silver  | 1 | 2 | 3 |"}, {"t": "add", "l": "+| gold    | 2 | 3 | 4 |"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Procedure:"}, {"t": "add", "l": "+1. `free_allowance = per_passenger_free_bags \u00d7 number_of_passengers`."}, {"t": "add", "l": "+2. `nonfree_baggages = max(0, total_baggages \u2212 free_allowance)`."}, {"t": "add", "l": "+3. Each non-free bag costs $50. Do not add bags the user did not ask for."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example: a gold member books 1 passenger in economy and wants 4 checked"}, {"t": "add", "l": "+bags. Free per passenger = 3, so `free_allowance = 3`. `total_baggages = 4`,"}, {"t": "add", "l": "+`nonfree_baggages = max(0, 4 \u2212 3) = 1`, extra charge = $50. (The booking/baggage"}, {"t": "add", "l": "+tools reject a mismatched `nonfree_baggages` and tell you the correct value.)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Payment \u2014 what is allowed"}, {"t": "add", "l": "+- Every payment id MUST already be in the user's profile (from"}, {"t": "add", "l": "+  `get_user_details`). Never invent or guess a payment id."}, {"t": "add", "l": "+- Per reservation: at most 1 travel certificate, at most 1 credit card, at most"}, {"t": "add", "l": "+  3 gift cards. (The booking tool enforces this.)"}, {"t": "add", "l": "+- A travel certificate's remaining balance is not refundable."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Cancellation \u2014 check eligibility BEFORE calling cancel_reservation"}, {"t": "add", "l": "+Decision chain (stop at the first that applies):"}, {"t": "add", "l": "+1. If any segment has already been flown \u2192 you CANNOT cancel; transfer to a human"}, {"t": "add", "l": "+   agent."}, {"t": "add", "l": "+2. Otherwise you MAY cancel only if AT LEAST ONE is true:"}, {"t": "add", "l": "+   - the booking was created within the last 24 hours (compare `created_at` to"}, {"t": "add", "l": "+     the current time at the top of this policy);"}, {"t": "add", "l": "+   - the airline cancelled a flight in the reservation;"}, {"t": "add", "l": "+   - the cabin is business;"}, {"t": "add", "l": "+   - the reservation has travel insurance AND the user's stated reason (health"}, {"t": "add", "l": "+     or weather) is covered by insurance."}, {"t": "add", "l": "+3. If none of these hold \u2192 deny the cancellation and explain why."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Always obtain the cancellation reason first, confirm the facts with the tools,"}, {"t": "add", "l": "+then confirm with the user before cancelling. The refund returns to the original"}, {"t": "add", "l": "+payment methods in 5\u20137 business days \u2014 state this in your final message."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example: user booked an economy flight 3 days ago, no insurance, change"}, {"t": "add", "l": "+of plans, not airline-cancelled \u2192 none of the conditions hold \u2192 deny: \"I'm sorry,"}, {"t": "add", "l": "+this reservation isn't eligible for cancellation under our policy because it's"}, {"t": "add", "l": "+an economy booking made more than 24 hours ago, without insurance, and the"}, {"t": "add", "l": "+flight wasn't cancelled by the airline.\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Compensation \u2014 only when explicitly asked and facts confirmed"}, {"t": "add", "l": "+1. Only act if the user EXPLICITLY asks for compensation."}, {"t": "add", "l": "+2. Confirm the facts with the tools first."}, {"t": "add", "l": "+3. Eligibility gate: do NOT compensate a regular member who has no travel"}, {"t": "add", "l": "+   insurance and flies (basic) economy. Only compensate a silver/gold member,"}, {"t": "add", "l": "+   or a user with travel insurance, or a business flight."}, {"t": "add", "l": "+4. Amounts: cancelled-flight complaint \u2192 certificate of $100 \u00d7 number of"}, {"t": "add", "l": "+   passengers; delayed-flight complaint (and the user also changes or cancels"}, {"t": "add", "l": "+   the reservation) \u2192 $50 \u00d7 number of passengers, after the change/cancel."}, {"t": "add", "l": "+5. Never offer compensation for any other reason."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Final message \u2014 report what you did"}, {"t": "add", "l": "+When the scorer reads your last message, state every value you changed or"}, {"t": "add", "l": "+decided: the reservation id, the action taken, the amount charged or refunded,"}, {"t": "add", "l": "+and any denial reason. An action done but not reported reads as incomplete."}]}, {"file": "tools/tools.py", "rows": [{"t": "hunk", "l": "@@ -47,4 +47,25 @@"}, {"t": "ctx", "l": " REMOVE_TOOLS: set[str] = set()"}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+# Free checked-bag allowance table (policy \"Checked bag allowance\"). The free"}, {"t": "add", "l": "+# allowance PER PASSENGER is the cabin base plus the membership bonus; multiply"}, {"t": "add", "l": "+# by the number of passengers for the reservation total. This is deterministic"}, {"t": "add", "l": "+# domain policy, so it is enforced in code rather than left to the model."}, {"t": "add", "l": "+#   regular/silver/gold  \u00d7  basic_economy/economy/business"}, {"t": "add", "l": "+_CABIN_BASE_FREE_BAGS: dict = {\"basic_economy\": 0, \"economy\": 1, \"business\": 2}"}, {"t": "add", "l": "+_MEMBERSHIP_BONUS_FREE_BAGS: dict = {\"regular\": 0, \"silver\": 1, \"gold\": 2}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def _free_baggage_allowance(membership: str, cabin: str, num_passengers: int) -> int:"}, {"t": "add", "l": "+    \"\"\"Total number of FREE checked bags the reservation is entitled to."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    = (cabin base + membership bonus) * number of passengers, per the policy"}, {"t": "add", "l": "+    'Checked bag allowance' table. Returns 0 for any unknown membership/cabin"}, {"t": "add", "l": "+    (fail-open: an unrecognised value never blocks a legitimate call).\"\"\""}, {"t": "add", "l": "+    base = _CABIN_BASE_FREE_BAGS.get(cabin)"}, {"t": "add", "l": "+    bonus = _MEMBERSHIP_BONUS_FREE_BAGS.get(membership)"}, {"t": "add", "l": "+    if base is None or bonus is None:"}, {"t": "add", "l": "+        return 0"}, {"t": "add", "l": "+    return (base + bonus) * max(0, num_passengers)"}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " class AirlineTools(_BaseAirlineTools):"}, {"t": "hunk", "l": "@@ -99,4 +120,27 @@"}, {"t": "ctx", "l": "             ]"}, {"t": "ctx", "l": "         user = self._get_user(user_id)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        # --- GUARD: checked-bag counts must match the policy allowance. --------"}, {"t": "add", "l": "+        # nonfree_baggages is fully determined by the policy: the reservation"}, {"t": "add", "l": "+        # gets a free allowance of (cabin base + membership bonus) * passengers,"}, {"t": "add", "l": "+        # every bag beyond that is a $50 paid bag. Enforce it so a miscomputed"}, {"t <script>
const DATA = JSON.parse(document.getElementById('run-data').textContent);
const G = DATA.graph, S = DATA.summary, DIFFS = DATA.diffs||{};
const $ = (t,a={},...k)=>{const e=document.createElement(t);for(const[p,v]of Object.entries(a)){
  if(p==='html')e.innerHTML=v;else if(p==='text')e.textContent=v;else e.setAttribute(p,v);}
  for(const c of k)if(c!=null)e.append(c);return e;};
const NS='http://www.w3.org/2000/svg';
const svg=(t,a={})=>{const e=document.createElementNS(NS,t);for(const[p,v]of Object.entries(a))e.setAttribute(p,v);return e;};
/* SVG text node WITH content. `el.append(node)` returns undefined, so the old
   `el.append(svg('text',...)).textContent = x` threw a TypeError on the very first axis
   label — which aborted the whole inline script and silently dropped every panel below
   the fitness chart (heatmap, lineage, cost, evaluations, candidates). */
const txt=(el,a,content)=>{const n=svg('text',a);n.textContent=content==null?'':String(content);el.append(n);return n;};
const fmt=v=>v==null?'—':(+v).toFixed(3);
function escN(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
// A tiny, deliberately non-general markdown renderer: headings, bullet lines,
// blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}
const main=document.getElementById('main'), tip=document.getElementById('tip');
const STATUS_META={running:['running','var(--accent)'],awaiting_agent:['awaiting agent','var(--idk)'],
  completed:['completed','var(--ok)'],budget_exhausted:['budget exhausted','var(--warn)'],
  stalled:['stalled','var(--warn)'],interrupted:['interrupted','var(--fail)'],failed:['failed','var(--bad)']};
document.getElementById('hdr').textContent =
  `${S.run_id} · ${S.algorithm||'algorithm not recorded'} · ${S.counts.total-1} candidates · ` +
  `${S.test_sealed?'test sealed':'test not sealed'}`;
function showTip(e,txt){tip.textContent=txt;tip.style.display='block';
  tip.style.left=Math.min(e.clientX+14,innerWidth-330)+'px';tip.style.top=(e.clientY+14)+'px';}
function hideTip(){tip.style.display='none';}
function sec(title){const s=$('section');s.append($('h2',{text:title}));main.append(s);return s;}
function dsecs(v){v=Math.max(0,Math.round(v||0));if(v<60)return v+'s';
  const m=Math.floor(v/60);if(m<60)return m+'m '+(v%60)+'s';return Math.floor(m/60)+'h '+(m%60)+'m';}

/* ---------- 1. KPI strip ---------- */
(function(){
  const s=sec('Summary'); const g=$('div',{class:'kpis'});
  const dpct=S.delta_pct!=null?`${S.delta_pct>0?'+':''}${S.delta_pct}%`:
            (S.delta_abs!=null?`${S.delta_abs>0?'+':''}${S.delta_abs.toFixed(3)}`:'—');
  const kp=(l,v,cls='',s2='')=>{const k=$('div',{class:'kpi'});k.append($('div',{class:'l',text:l}),
    $('div',{class:'v '+cls,text:v}));if(s2)k.append($('div',{class:'s',text:s2}));return k;};
  const c=S.counts, cost=S.cost;
  g.append(
    kp('best val',fmt(S.best_val),'champ',S.best_id),
    kp('baseline',fmt(S.baseline_val)),
    kp('Δ vs baseline',dpct,(S.delta_abs>0?'ok':'')),
    kp('held-out test',fmt(S.test_reward),'',
       // The raw sealed score alone is not the result — the DELTA against the seed's own test
       // score is, and both were already in final.json. A run can lift val and lose test.
       (S.test_delta!=null||S.test_baseline_reward!=null)
         ?((S.test_delta!=null?(S.test_delta>0?'+':'')+S.test_delta.toFixed(3)+' vs seed ':'')+
           (S.test_baseline_reward!=null?fmt(S.test_baseline_reward):'')+
           (S.test_sealed?' · sealed once':''))
         :(S.test_sealed?'sealed once':'not finalized')),
    kp('candidates',c.total-(c.seed||0),'',
       `${c.accepted} accept · ${c.rejected} reject · ${c.indecisive||0} indecisive · ${c.failed} no-measure`),
    kp('frontier',S.frontier,'','gated leaves with no accepted child'),
    kp('wall clock',`${S.wall_clock_seconds}s`,'',`opt ${S.optimizer_seconds}s · run ${S.runner_seconds}s`),
    kp('cost',`$${cost.total_usd.toFixed(4)}`,'',`opt $${cost.optimizer_usd.toFixed(4)} · run $${cost.runner_usd.toFixed(4)}`),
    // Token count without its split reads as implausible next to the dollar figure (a real run:
    // 206M tokens for $4.80). The split explains it: nearly all of them are RUNNER tokens on a
    // self-hosted endpoint that bills $0, and the dollars are the optimizer's.
    kp('tokens',S.tokens.toLocaleString(),'',S.tokens_by_role?
       `run ${S.tokens_by_role.runner.toLocaleString()} · opt ${S.tokens_by_role.optimizer.toLocaleString()}`:''),
    kp('unattributed $',
       S.cost_ledger?`$${S.cost_ledger.unattributed_usd.toFixed(4)}`:'—',
       (S.cost_ledger&&Math.abs(S.cost_ledger.unattributed_usd)>0.0005?'champ':''),
       'recorded spend the events cannot explain'),
    kp('events',S.event_count!=null?S.event_count:'—','','every line in events.jsonl')
  );
  s.append(g);
})();

/* ---------- 1b. Run status + split honesty ---------- */
(function(){
  const s=sec('Run status');
  const meta=STATUS_META[S.status]||['unknown','var(--muted)'];
  const head=$('div',{style:'display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:10px'});
  const pill=$('span',{class:'pill',style:`color:${meta[1]};border-color:${meta[1]}66`});
  pill.append($('span',{style:`width:8px;height:8px;border-radius:50%;background:${meta[1]}`}),
              $('span',{text:meta[0]}));
  head.append(pill);
  if(S.algorithm)head.append($('span',{class:'pill',style:'color:var(--accent);border-color:#7c5cff66',
    text:S.algorithm+(S.algorithm_source?' · from '+S.algorithm_source:'')}));
  head.append($('span',{class:'pill',text:S.test_sealed?'test sealed':'test not sealed'}));
  if(S.elapsed_seconds!=null)head.append($('span',{class:'muted num',text:dsecs(S.elapsed_seconds)+(S.elapsed_open?' elapsed so far':' elapsed')}));
  s.append(head);
  if(S.status_reason)s.append($('p',{class:'muted',style:'margin:0 0 10px',text:S.status_reason}));
  const sp=S.splits;
  if(sp&&sp.no_holdout){
    s.append($('div',{class:'banner',html:'<b>No holdout.</b> train, val and test hold the same tasks, so the '+
      '&ldquo;test&rdquo; number is NOT a generalization estimate &mdash; the optimizer saw those tasks. '+
      'Read it as a sanity check only.'}));
  }
  if(sp&&sp.warning)s.append($('div',{class:'banner',text:sp.warning}));
  // Background-task mass-kill (PR #558): 2+ backgrounded Bash calls the harness evicted
  // at the identical millisecond — a compliance WARNING distinct from an outcome, so it
  // gets the 'bad' banner treatment (No holdout above uses the same class).
  (S.background_mass_kills||[]).forEach(mk=>{
    s.append($('div',{class:'banner bad',html:
      `<b>Background task mass-kill.</b> ${mk.count} background tasks were evicted at the `+
      `identical timestamp <code>${mk.timestamp}</code> — the harness's concurrent-`+
      `background-task ceiling, not ${mk.count} tasks coincidentally finishing at once. `+
      `Task ids: ${(mk.task_ids||[]).join(', ')}.`}));
  });
  if(sp)s.append($('p',{class:'muted num',style:'margin:10px 0 0',
    text:`splits · train ${sp.train??'—'} · val ${sp.val??'—'} · test ${sp.test??'—'}`+
         (sp.seed!=null?` · seed ${sp.seed}`:'')+
         '   —   val decides selection; test is scored exactly once and never optimized against.'}));
})();

/* ---------- 1c. Phases timeline ---------- */
(function(){
  const c=S.counts, total=c.total, evaluated=c.accepted+c.rejected;
  const hasBase=S.baseline_val!=null, finalized=(S.test_reward!=null)||S.test_sealed;
  const D=b=>b?'done':'pending';
  const phases=[
    {nm:'Intake',st:D(total>0||hasBase),d:'Interview + scaffold project, adapter, seed.'},
    {nm:'Implement & check',st:D(total>0||hasBase),d:'Hard gate before any budget is spent.'},
    {nm:'Baseline',st:D(hasBase),d:`Freeze splits; seed val ${fmt(S.baseline_val)}.`},
    {nm:'Optimize'+(S.algorithm?' · '+S.algorithm:''),st:finalized?'done':(hasBase?'active':'pending'),
     d:`${evaluated} iters · ${c.accepted} accepted · best ${fmt(S.best_val)}.`},
    {nm:'Finalize',st:D(finalized),d:`Sealed test ${fmt(S.test_reward)}.`},
    {nm:'Report',st:D(finalized),d:'This dashboard.'},
  ];
  const s=sec('Pipeline phases'); const g=$('div',{class:'phases'});
  for(const p of phases){const e=$('div',{class:'phase '+p.st});
    e.append($('div',{class:'nm',text:p.nm}),$('div',{class:'st',text:p.st}),$('div',{class:'d',text:p.d}));
    g.append(e);}
  s.append(g);
})();

/* ---------- 1d. Rejected edits, deduplicated by reason ---------- */
(function(){
  const norm=r=>(r||'rejected').replace(/-?\d+\.\d+/g,'N').replace(/-?\d+/g,'N').trim();
  const map=new Map();
  for(const n of G.nodes){ if(n.status!=='rejected')continue;
    const k=norm(n.reason); const cur=map.get(k)||{reason:k,count:0,ex:[]};
    cur.count++; if(cur.ex.length<3)cur.ex.push(n.id); map.set(k,cur);}
  const ends=[...map.values()].sort((a,b)=>b.count-a.count);
  if(!ends.length)return;
  const s=sec('Rejected edits, grouped by the gate reason');
  for(const d of ends){const e=$('div',{class:'dead'});
    if(d.count>1)e.append($('span',{class:'x',text:'×'+d.count}));
    e.append($('div',{class:'muted',text:d.ex.join(', ')}),$('div',{text:d.reason}));
    s.append(e);}
})();

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

/* ---------- 3. tasks × iterations pass/fail heatmap ---------- */
(function(){
  const tasks=S.tasks||[];
  const iters=G.nodes.filter(n=>Object.keys(n.per_task||{}).length).sort((a,b)=>a.iteration-b.iteration);
  if(!tasks.length||iters.length<1)return;
  const s=sec('Per-task pass/fail across iterations');
  // sort rows worst-first by mean reward
  const meanFor=t=>{let sum=0,n=0;iters.forEach(it=>{if(it.per_task[t]!=null){sum+=it.per_task[t];n++;}});return n?sum/n:0;};
  const rows=[...tasks].sort((a,b)=>meanFor(a)-meanFor(b));
  const cw=Math.max(10,Math.min(26,Math.floor(1000/iters.length))),ch=16,labW=120;
  const W=labW+iters.length*cw+10,H=rows.length*ch+24;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,class:'heat'});
  iters.forEach((it,j)=>txt(el,{x:labW+j*cw+cw/2,y:12,'text-anchor':'middle'},it.iteration));
  rows.forEach((t,i)=>{
    txt(el,{x:labW-6,y:24+i*ch+11,'text-anchor':'end'},t.length>16?t.slice(0,15)+'…':t);
    iters.forEach((it,j)=>{
      const v=it.per_task[t];
      const col=v==null?'var(--card3)':v>=0.999?'var(--ok)':v<=0.001?'var(--bad)':'var(--warn)';
      const rect=svg('rect',{x:labW+j*cw,y:24+i*ch,width:cw-1.5,height:ch-1.5,rx:2,fill:col});
      const fb=(it.feedback&&it.feedback[t])||'';
      rect.addEventListener('mousemove',e=>showTip(e,`${t} @ iter ${it.iteration} (${it.id})\nreward=${v==null?'—':v.toFixed(3)}\n${fb.slice(0,180)}`));
      rect.addEventListener('mouseleave',hideTip);
      el.append(rect);
    });
  });
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>pass</span><span><i style="background:var(--bad)"></i>fail</span>'+
    '<span><i style="background:var(--warn)"></i>partial</span><span><i style="background:var(--card3)"></i>not run</span>'+
    '<span class="muted">rows sorted worst-first · hover a cell for feedback</span>'}));
})();

  function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;');}

    out.innerHTML='';

      }else{
        const tbl=$('div'); f.rows.forEach(r=>{

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();

  const s=sec('Activity log — every event this run recorded');
  const bar=$('div',{class:'row',style:'margin-bottom:10px;align-items:center'});
  const q=$('input',{type:'search',placeholder:'search kind, candidate, message…',style:'flex:1;min-width:180px'});
  const phase=$('select'); ['all','intake','baseline','optimize','finalize'].forEach(p2=>
    phase.append($('option',{value:p2,text:p2})));
  const kind=$('select');
  ['all',...[...new Set(LOG.map(r=>r.kind))].sort()].forEach(k=>kind.append($('option',{value:k,text:k})));
  const count=$('span',{class:'muted num'});
  bar.append(q,$('span',{class:'muted',text:'phase'}),phase,$('span',{class:'muted',text:'kind'}),kind,count);
  s.append(bar);
  const list=$('div'); s.append(list);
  const TONE={optimizer_error:'var(--bad)',tamper_detected:'var(--bad)',step_indecisive:'var(--idk)',
    accept:'var(--ok)',finalize:'var(--ok)',reject:'var(--bad)',evaluate:'var(--accent)',
    minibatch:'var(--accent)',gate_warning:'var(--warn)',budget_warning:'var(--warn)',
    splits_warning:'var(--warn)'};
  const clock=t2=>t2==null?'--:--:--':new Date(t2*1000).toLocaleTimeString([], {hour12:false});
  function gist(r){
    const d=r.detail||{}, b=[];
    if(d.split)b.push('split='+d.split);
    if(typeof d.reward==='number')b.push('reward='+d.reward.toFixed(3));
    if(typeof d.val==='number')b.push('val='+d.val.toFixed(3));
    if(typeof d.cost_usd==='number')b.push('$'+d.cost_usd.toFixed(4));
    if(typeof d.opt_cost_usd==='number')b.push('opt $'+d.opt_cost_usd.toFixed(4));
    if(d.accept!==undefined)b.push(d.accept?'ACCEPT':'reject');
    return b.length?b.join('  '):(r.text||Object.keys(d).join(', '));
  }
  const open=new Set();
  function render(){
    const needle=q.value.trim().toLowerCase();
    const rows=LOG.filter(r=>{
      if(phase.value!=='all'&&r.phase!==phase.value)return false;
      if(kind.value!=='all'&&r.kind!==kind.value)return false;
      if(!needle)return true;
      return (r.kind+' '+(r.candidate||'')+' '+(r.text||'')+' '+JSON.stringify(r.detail||{}))
        .toLowerCase().includes(needle);
    });
    count.textContent=rows.length+'/'+LOG.length;
    list.innerHTML='';
    if(!rows.length){list.append($('p',{class:'muted',text:'No event matches this filter.'}));return;}
    rows.forEach(r=>{
      const row=$('div',{class:'logrow'});
      row.append($('span',{class:'muted num',text:clock(r.t)}),
        $('span',{class:'muted',style:'font-size:10px;text-transform:uppercase;letter-spacing:.05em',text:r.phase}),
        $('span',{class:'k',style:'color:'+(TONE[r.kind]||'var(--muted2)'),
                  text:r.kind+(r.candidate?' '+r.candidate:'')}),
        $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                  text:gist(r)}));
      list.append(row);
      const det=$('div',{class:'logdet'});
      // textContent only: this text is model/subprocess-authored and must never be parsed as markup.
      det.textContent=(r.text?r.text+'\n\n':'')+
        Object.entries(r.detail||{}).map(([k,v])=>k+' = '+(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))).join('\n');
      det.style.display=open.has(r.seq)?'block':'none';
      list.append(det);
      row.addEventListener('click',()=>{
        if(open.has(r.seq)){open.delete(r.seq);det.style.display='none';}
        else{open.add(r.seq);det.style.display='block';}
      });
    });
  }
  q.addEventListener('input',render);phase.addEventListener('change',render);
  kind.addEventListener('change',render);render();
})();

/* ---------- 10. evograph weakness graph (replaces the embedded viewer) ---------- */
(function(){
  const EG=(S.algo_extra||{}).evograph; if(!EG)return;
  const s=sec('Weakness graph — evograph');
  const rounds=(EG.rounds||[]).filter(r=>r.split!=='test');
  const final=(EG.rounds||[]).find(r=>r.split==='test');
  const prim=r=>r.primary_metric?r.metrics[r.primary_metric]:null;
  if(rounds.length){
    const max=Math.max(1e-9,...rounds.map(r=>prim(r)||0),(final?prim(final):0)||0);
    const wrap=$('div',{style:'display:flex;align-items:flex-end;gap:14px;margin-bottom:12px'});
    const col=(label,v,color,note)=>{const d=$('div',{style:'display:flex;flex-direction:column;align-items:center;gap:5px;flex:1'});
      d.append($('span',{class:'num',style:'font-weight:700;font-size:12px',text:v==null?'—':(v*100).toFixed(1)+'%'}),
        $('div',{style:`width:100%;max-width:64px;height:${Math.max(4,(v||0)/max*110)}px;border-radius:4px 4px 0 0;background:${color}`}),
        $('span',{class:'eyebrow',text:label}),$('span',{class:'muted num',style:'font-size:10px',text:note||''}));

    rounds.forEach(r=>wrap.append(col('round '+r.round,prim(r),'var(--accent)',
      (r.num_tasks??'—')+' tasks'+(r.completed_at==null?' · running':''))));
    if(final)wrap.append(col('sealed test',prim(final),'var(--ok)',

    s.append($('p',{class:'muted',style:'margin:0 0 12px',text:

    }else{
      t.append($('tr',{},$('th',{text:'kind'}),$('th',{text:'candidate'}),$('th',{text:'detail'})));
      rows.forEach(r=>t.append($('tr',{},
        $('td',{},$('code',{text:r.kind||'—'})),
        $('td',{},r.candidate||'—'),
        $('td',{class:'muted',style:'font-size:11px',text:JSON.stringify(r.detail||{}).slice(0,200)}))));

/* ---------- 8. Candidate leaderboard + git log ---------- */
(function(){
  const s=sec('Candidates'); const t=$('table');
  // "screened" (did this candidate pay for a cheap screen before full-val?) only shown
  // when SOME node has a recorded signal — never rendered as a column of bare "—".
  const showScreened=!!(S.capabilities&&S.capabilities.screened);
  // agent-optimize's cheap screen is OPTIONAL. In a run that never attempted one, every
  // candidate carried a warning-orange "✗ not screened" badge, which reads as a compliance
  // violation when nothing was violated. The badge is only a flag when SOME candidate in the
  // run did screen and this one skipped it; otherwise the column shows "—", the way the seed
  // row already correctly did.
  const anyScreened=G.nodes.some(n=>n.screened===true);
  const byId=Object.fromEntries(G.nodes.map(n=>[n.id,n]));
  const hdr=[$('th',{text:'id'}),$('th',{text:'status'}),$('th',{class:'r',text:'val'}),
    $('th',{class:'r',text:'Δ parent'}),$('th',{class:'r',text:'iter'})];
  if(showScreened)hdr.push($('th',{text:'screened'}));
  hdr.push($('th',{text:'reason'}));
  t.append($('tr',{},...hdr));
  G.nodes.slice().sort((a,b)=>(b.val||-1)-(a.val||-1)).forEach(n=>{
    // parent_val is only recorded when the algorithm's round table carried it; when it did
    // not, the parent's OWN val is sitting right there in the same graph, so fall back to it
    // rather than printing "—" for a delta both halves of which are known.
    const pv=n.parent_val!=null?n.parent_val:(n.parent&&byId[n.parent]?byId[n.parent].val:null);
    const dlt=pv!=null&&n.val!=null?(n.val-pv):null;
    const idCell=$('td',{},n.id===S.best_id?'★ '+n.id:n.id);
    // screen+gate bypass (PR #557): a compliance WARNING (never measured), distinct from
    // the accepted/rejected OUTCOME ring the status badge already shows — a different
    // color (b-bypass) so it never reads as a second verdict.
    if(n.bypassed_screen_and_gate){
      const bad=$('span',{class:'badge b-bypass',style:'margin-left:6px',text:'⚠ bypass'});
      bad.addEventListener('mousemove',e=>showTip(e,
        'screen+gate bypass: rejected via driver_judgement with no screen.py record and no '+
        'full-val gate row.\njustification: '+(n.bypassed_gate_justification||'—')));
      bad.addEventListener('mouseleave',hideTip);
      idCell.append(bad);
    }
    const cells=[
      idCell,
      $('td',{},$('span',{class:'badge b-'+n.status,text:n.status})),
      $('td',{class:'r num',text:fmt(n.val)}),
      $('td',{class:'r num',text:dlt==null?'—':(dlt>0?'+':'')+dlt.toFixed(3)}),
      $('td',{class:'r num',text:n.iteration})];
    if(showScreened)cells.push($('td',{},(n.screened==null||(!n.screened&&!anyScreened))?'—':
      $('span',{class:'badge '+(n.screened?'b-accepted':'b-rejected'),text:n.screened?'✓ screened':'✗ not screened'})));
    cells.push($('td',{class:'muted',text:(n.reason||'').slice(0,80)}));
    t.append($('tr',{},...cells));
  });
  s.append(t);
  if(S.git_log&&S.git_log.length){
    s.append($('h2',{text:'Iteration store (git)',style:'margin-top:18px'}));
    const g=$('div',{class:'diff'});
    S.git_log.forEach(r=>g.append($('div',{class:'ctx',text:r.hash+'  '+r.subject})));
    s.append(g);
  }
})();
</script></body></html>
