<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>cap-evolve · run dashboard</title>
<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);
background:var(--card);color:var(--muted)}
.ann .who{color:var(--muted);font-size:11px}
.heat rect{cursor:pointer} .heat text{fill:var(--muted);font-size:10px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}

d by a RESULT, cite the candidate id):\n    - What didn't (confirmed by a RESULT, cite the candidate id):\n    - Promising but not yet tried:\n\n## The confirm-then-STOP stall is no longer the dominant failure (post cand_0002)\n- What worked (confirmed by RESULT): cand_0001 ACCEPTED (val 0.467) and cand_0002\n  ACCEPTED (val 0.567) \u2014 the cumulative payment/COMMUNICATE code levers + the RULE 1\n  decision-chain rewrite + the `modify_reservation` composite moved val from 0.333 \u2192\n  0.567 across two accepts. All per-task moves stayed <2\u00b7SE so NO single task is\n  individually credited, but the aggregate climb is real and monotonic.\n- What didn't (confirmed by RESULT): nothing is refuted yet \u2014 both prior RESULTs are\n  accepts with every task `unresolved`. There is no edit a RESULT has told us to drop.\n- Confirmed by re-reading cand_0002's own val trajectories (diagnostic, not a gate\n  RESULT): the passing trials now execute the write directly \u2014 the stall that drove\n  cand_0001/cand_0002 is largely gone. The residual loss is DECISION/BEHAVIORAL:\n  (A) duplicated/compounding writes, (B) wrong write-action (cancel/split vs modify,\n  over-transfer), (C) wrong reservation targeted (grab-first-id). cand_0003 targets all\n  three with a code resolver (`find_reservation`) + a `book_reservation` dup-guard +\n  prose RULES 6/7 and the cancel-eligibility checklist.\n- Promising but not yet tried: a discriminating code guard for cluster B (e.g. a\n  `reason`-gated cancel path, or a session anti-split guard in `book_reservation`),\n  and idempotent modify via minimal verified snapshot-restore for task 12. Both\n  deferred this run as higher corruption risk than their expected gain.", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001 (empty seed)\n- Strategy tried: multi-class batch in one candidate \u2014 code enforcement for the\n  deterministic clusters (payment format/amount, payment_history re-sync, baggage\n  recompute, enriched COMMUNICATE returns, actionable errors) + explicit mid-model\n  prose for the behavioral clusters (anti-stall, speak-the-figure, act-vs-transfer).\n  Diagnosed with a single Explore subagent over all 30 trajectories, then verified\n  every code edit on the LIVE airline DB (payment splits, refund = $5244, baggage\n  no-op) before shipping. Gate result not yet known (LEDGER will stamp it).\n- Plateau/stall signal: none yet (iteration 1).\n- What to try next iteration: read the RESULT. The stall/USER_STOP cluster (A) is the\n  biggest and is only prose-mitigated \u2014 if it dominates residual loss, the next lever\n  is structural (same-turn execute, user-sim-driven) not another prose rule. For the\n  wrong-reservation cluster (D) an untried design is a route\u2192reservation resolver tool.\n  Avoid re-touching the verified-no-op code paths (auto-correct/recompute) \u2014 broadening\n  them into always-on rewrites is the regression risk.\n\n## Iteration cand_0002\n- Strategy tried: diagnosed the dominant residual loss by comparing FAILING vs PASSING\n  turn-endings on the SAME tasks (not just reading failures). Finding: the killer is a\n  `###STOP###`-terminal confirm stall \u2014 the agent ends a turn on \"Shall I proceed?\",\n  the user says \"yes###STOP###\", and the episode ends before any write. Lever mix this\n  iteration: a prose decision-chain rewrite for the behavioral stall (A), a knowledge\n  rule for a wrong refusal (B), tightened transfer/finish rules (C), and a code\n  composite `modify_reservation` for multi-write tasks (D). Four edit TYPES, not one.\n- Key process insight: for a behavioral cluster, READ the passing trials of the same\n  task \u2014 they tell you the exact winning micro-behavior to codify (here: execute the\n  write directly, no separate confirm turn). This is stronger than reasoning from the\n  failures alone.\n- Plateau/stall signal: none yet (parent was an accept; all tasks unresolved <2\u00b7SE).\n- What to try next iteration: read cand_0002's RESULT. If the stall (A) persists, the\n  only remaining lever is structural \u2014 remove the update_* primitives so\n  `modify_reservation` (one decisive call) is the only modify path; weigh against the\n  regression risk on passing 11/37/40. If A moved but booking tasks (8/23/25) remain,\n  shift to the certificate/multi-card payment-split path in book_reservation.\n\n## Iteration cand_0003 (last iteration of this run)\n- Strategy tried, and whether it moved val: the dominant stall from cand_0001/0002 is\n  fixed, so I re-diagnosed from THIS iteration's val trajectories rather than inheriting\n  the old cluster map, and found the residual loss is three decision/behavioral clusters\n  (A dup/compounding write, B wrong write-action, C grab-first-reservation). Shipped a\n  deliberate CODE+PROSE mix: new `find_reservation` resolver tool + `book_reservation`\n  dup-guard (code) and RULES 6/7 + cancel-eligibility checklist (prose), 6 edits across\n  both surfaces. Gate result not yet known (LEDGER will stamp it) \u2014 this is the final\n  planned iteration so there is no next one to read it.\n- Key process insight reconfirmed: once a dominant cluster is fixed, STOP trusting the\n  previous iteration's diagnosis \u2014 re-cluster from the current champion's own\n  trajectories. The failure mix shifts under you; cand_0002's \"stall\" map would have\n  wasted this iteration. Also: the grab-first-id finding (17/22 touch the WRONG\n  reservation, not an omitted field) was ONLY visible by diffing failing-vs-passing\n  tool-call TARGETS on the same task \u2014 the summary's \"omitted cabin upgrade\" read was\n  wrong. Always verify the actual tool arguments against the live DB before diagnosing.\n- Plateau/stall signal and lever switched to: NOT flat \u2014 two straight accepts (+0.133,\n  +0.100). To pre-empt a prose-only plateau on the mid (~100B) reader, I added code\n  levers (resolver + guard) this iteration rather than a third round of prose rules.\n  The behavioral clusters that remain (B especially, the adversarial cancel+split in 23)\n  are the ones prose alone is weakest at \u2014 code guards are the lever with headroom.\n- What to try next iteration (if a cand_0004 happens): read cand_0003's RESULT. If C\n  (17/22) moved, the resolver works \u2014 keep it and consider making route-matching the\n  default inside the write tools. If B (23/11/19) still loses, the untried code lever is\n  a discriminating guard (cancel-eligibility `reason` parameter; session anti-split in\n  `book_reservation`). If A (12) persists, revisit idempotent modify only with a minimal,\n  fully live-DB-verified snapshot-restore. If cand_0003 is REJECTED, its diff.patch isol-\n  ates the culprit \u2014 most likely E2 (dup-guard) blocking a legitimate corrective re-book;\n  the fallback is to keep E1/E3/E4/E5/E6 and drop E2.", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## From cand_0003 (tau2-airline smoke run)\n- **The all-unresolved RESULT is near-uninformative for steering.** Every RESULT so far\n  stamps `fixed={\u2014} broke={\u2014}` with ALL tasks `unresolved` (per-task move < 2\u00b7SE), even\n  across a clear +0.133 then +0.100 aggregate climb. The optimizer is told \"the whole\n  thing went up\" but never \"which edit did it,\" so each iteration must re-diagnose from\n  trajectories to know what worked. SUGGESTION: when per-task significance can't be\n  reached at the current trial count, the framework could report a cheaper aggregate\n  attribution signal \u2014 e.g. per-cluster or per-tool deltas, or a note that more trials\n  would be needed to resolve a task \u2014 rather than a flat `unresolved` set the optimizer\n  is explicitly warned not to act on. Right now the richest signal lives in the raw\n  trajectories, which the optimizer has to re-cluster by hand every iteration.\n- **A 3-iteration budget with a per-task 2\u00b7SE gate means no edit can ever be individually\n  validated within a run.** The gate protects against regressions (good) but the\n  optimizer never gets a confirmed \"this lever fixed task X\" within the budget, so\n  INSIGHTS \"what worked\" stays hypothesis-level. SUGGESTION: either raise val trial count\n  on the final iteration for a cleaner read, or expose a cheap per-edit ablation hook so\n  a shipped candidate's individual edits can be credited post-hoc.\n- **Stale cross-iteration summary risk.** The compaction summary carried a wrong\n  diagnosis (\"omitted cabin upgrade\" for 17/22) that was only caught by re-reading the\n  live tool-call targets. A short framework note in the task preamble \u2014 \"re-derive the\n  cluster map from the current champion's trajectories; do not trust a prior summary's\n  diagnosis\" \u2014 would harden every run against inherited mis-diagnosis.", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0003)", "text": "# PROCESS \u2014 cand_0003 (parent cand_0002, val 0.567)\n\nReward model: **DB \u00d7 COMMUNICATE** (product; either 0 \u21d2 task 0). Tool RETURN values are\nNOT hashed \u2014 only `self.db`. Diagnosed THIS iteration's `./trajectories/` (30 val trials\nof cand_0002) by reading the actual traces, not the stale summary. The confirm-then-STOP\nstall that dominated cand_0002's diagnosis is now largely gone (passing trials execute\nthe write directly). The residual loss is three DECISION/BEHAVIORAL patterns the mid\nreader still gets wrong on some trials. I verified each code edit on the LIVE airline DB\nwith the edited `AirlineTools` (run venv).\n\n## Ranked cluster list (leverage = # failing trials \u00d7 score recoverable)\n\n| rank | cluster | tasks (trials) | root cause | tag | lever |\n|---|---|---|---|---|---|\n| A | **Duplicated / compounding WRITE** | 23 t0/t1/t2 (ALWAYS-fail), 12 t0/t2, 8 t0/t1 | Agent writes, then re-writes to \"correct\" it. The first write is not undone: `book_reservation` makes a NEW reservation and each write appends a charge, so a corrective repeat STACKS \u2192 doubled DB \u2192 0. 23 cancels then books 3\u00d7; 12 modifies business then economy; 8 books twice (different flight). | BEHAVIORAL | code: duplicate-booking guard in `book_reservation`; prose RULE 6 \"one decision, one write\" |\n| B | **Cancel/split vs modify; over-transfer** | 23 t0/t1/t2, 11 t1, 19 t0/t1 | Wrong write-action choice. 23: user pressures agent to cancel + split one party into 3 reservations to use 3 certificates (policy forbids >1 cert/reservation). 11: \"downgrade + refund difference\" done as a full CANCEL instead of a cabin modification. 19: agent TRANSFERS instead of cancelling, having checked only the insurance condition and not the other three cancel-eligibility conditions. | DECISION | prose RULE 7 (cabin change = modify, never cancel-and-rebook / split to game payments) + RULE 5 cancel-eligibility check |\n| C | **Wrong reservation targeted (grab-first-id)** | 17 t1, 22 t0/t1 | User names the trip by route (\"New York to Chicago\"), gives no id. Agent fetches the FIRST reservation id and acts on it (SEA\u2192DFW `UM3OG5`) without confirming the route, instead of the matching `FQ8APE` (EWR\u2192ORD, basic economy). Passing trials fetch several candidates and match. | CAPABILITY-GAP | code: new `find_reservation(user_id)` resolver returning a compact summary of ALL reservations in one call; RULE 5 points at it |\n\nA+B overlap on the always-failing task 23 (3 trials, full recoverable) \u2014 the biggest\nsingle leverage \u2014 and together cover every failing trial except the flight-selection\nnoise in 8 (wrong cheapest flight, a reasoning error no capability edit fixes cleanly).\n\n## Edits made this iteration\n\n| id | edit | file / surface | class (SKILL lever) | targets | protects passing? |\n|---|---|---|---|---|---|\n| E1 | New READ tool `find_reservation(user_id, origin?, destination?)` \u2014 loops the user's reservations, returns compact {id, origin, destination, flight_type, cabin, dates, num_passengers, status, matches_filter} so all candidates are visible in ONE call | tools.py | code: loop/resolver tool (lever 5) + literal per-param docs for the mid reader | C (17, 22) | yes \u2014 additive READ; passing tasks already resolve correctly |\n| E2 | Duplicate-booking guard in `book_reservation`: before creating, scan the user's ACTIVE reservations; if one matches same origin/destination/flight_type/passenger-set/travel-dates, raise an actionable error naming the existing id and telling the agent to MODIFY it | tools.py | code: in-body guard (lever 1) | A (8; defends 23-style re-book) | yes \u2014 verified task 25 (same route/dates, DIFFERENT passenger count) does NOT fire |\n| E3 | RULE 6 (new): \"one decision, ONE write per reservation; never issue a corrected second write\" with WRONG/CORRECT worked examples | policy.md | prose (add rule + reason + example) | A (12, 8, 23) | yes \u2014 passing trials already write once |\n| E4 | RULE 7 (new): a cabin/flight/baggage change is a MODIFICATION \u2014 never cancel-and-rebook; never split one trip into several reservations to apply more certificates / lower a card charge; downgrade+refund = cabin modification, not cancel | policy.md | prose (add sourced decision rule + example) | B (23, 11) | yes \u2014 tightens, never loosens a passing decision |\n| E5 | RULE 5: cancel-eligibility check \u2014 verify ALL four conditions (24h / airline-cancelled / business / insurance+covered) before transferring or refusing a cancellation; transfer only when no write tool can satisfy the request | policy.md | prose (tighten decision rule, traced to Cancel-flight policy) | B (19) | yes \u2014 states policy exactly, adds no new permission |\n| E6 | RULE 5 disambiguation bullet rewritten to call `find_reservation` first and match by route/dates; \"do not act on the first id you see\" | policy.md | prose (rewrite + point at new tool) | C (17, 22) | yes |\n\n## Verify-the-fix (ran against the LIVE airline DB with the edited AirlineTools, run venv)\n\n- **Registration**: edited toolset imports and tau2 `get_tools()` returns **16** tools\n  incl. `find_reservation` (< ~20 limit). No registration break.\n- **E1 fires on C**: `find_reservation('omar_rossi_1241', origin='EWR', destination='ORD')`\n  returns all 4 reservations and flags **FQ8APE** (EWR\u2192ORD, basic_economy, 1 pax)\n  `matches_filter=True`, the exact reservation the failing trials missed; `UM3OG5`\n  (SEA\u2192DFW, the one they wrongly grabbed) is `False`.\n- **E2 fires on A, not on passing**: 1st book of a trip succeeds; an identical-trip 2nd\n  book (same pax/route/dates, even a different flight number \u2014 the task-8 pattern) is\n  BLOCKED with the actionable error. Task 25 (ivan_muller_7015 books DTW\u2192SEA 1 pax while\n  existing evolve run\n\nWHAT THIS OPTIMIZES:\n  - The airline domain's system-prompt policy (policy/policy.md)\n  - Optionally the tool implementations (tools/tools.py)\n  - Optionally the agent harness (harness.json + memory/lessons.jsonl), when the candidate\n    has a harness.json \u2014 see \"agent-harness capability\" below. Without that file the run is\n    byte-for-byte the plain tau2 ``llm_agent``.\n\nHOW IT WORKS:\n  - tasks()      \u2192 all 50 airline tasks from tau2 (stable, no network).\n  - run_batch()  \u2192 tau2's own batch runner (run_tasks) with your model.\n  - score()      \u2192 tau2's own reward in [0,1] with gold-safe feedback.\n  - apply()      \u2192 overrides the registry's airline env constructor.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport functools\nimport importlib.util\nimport json\nimport os\nimport threading\nimport uuid\nimport re\nimport sys\nimport time\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\n\nfrom cap_evolve import CapabilityAdapter, Rollout, Score, Task\n\nimport model_config\n\nDOMAIN = \"airline\"\n\n# docs/TAU2_SUMMARY.md row 7: the tau2-bench user simulator sometimes emits ``###STOP###``\n# in the SAME message as reasoning that explicitly plans to continue (\"we must wait for\n# agent's third message. Continue.\"), in 15/27 observed task-7 failures \u2014 ~4.2% of all\n# rollouts lost to a simulator artifact that measures nothing about agent skill. tau2-bench\n# is an external package (cloned at setup time, not vendored here), so the fix lives on our\n# side of the boundary: detect the leak from the message trace and mark the rollout as\n# infra noise, matching the existing ``rollout.error`` path below rather than scoring the\n# agent down for a bug that is not the agent's.\n_STOP_LEAK_RE = re.compile(\n    r\"###\\s*stop\\s*###.{0,400}\\b(?:continue|continuing|wait\\s+for|must\\s+wait|\"\n    r\"keep\\s+(?:going|talking)|not\\s+(?:done|finished)\\s+yet)\\b\"\n    r\"|\\b(?:continue|continuing|wait\\s+for|must\\s+wait|\"\n    r\"keep\\s+(?:going|talking)|not\\s+(?:done|finished)\\s+yet)\\b.{0,400}###\\s*stop\\s*###\",\n    re.I | re.S,\n)\n\n\n#: Markers that tie an error to something the CANDIDATE owns (its edited ``tools.py`` / tool schema /\n#: ``policy.md`` template), as opposed to the serving path. Matched against the error text tau2 records.\n_CANDIDATE_FAULT_RE = re.compile(\n    r\"tools\\.py|tool[_ ]definition|tool[_ ]schema|invalid\\s+tool|unknown\\s+tool|\"\n    r\"ValidationError|policy\\.md|failed to render|template\", re.IGNORECASE)\n\n\ndef classify_error_kind(termination: str, evidence: str = \"\") -> str:\n    \"\"\"``\"candidate\"`` | ``\"infra\"`` for an errored tau2 simulation (the ``error_kind`` hook).\n\n    The harness scores a ``candidate`` error as a measured failure (0.0) under ``errored_trial_policy:\n    fail`` and keeps ``infra`` errors as missing data, so an edit that breaks its own tools cannot hide\n    behind dropped trials. Only ``UNEXPECTED_ERROR`` whose recorded text points at candidate-owned\n    files is attributed to the candidate; timeouts, ``INFRASTRUCTURE_ERROR`` and the user-simulator\n    leak stay infra.\" \u2026[+63638 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 208, "preview": "{\"train\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"], \"val\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"], \"test\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"]}\n", "truncated": false, "binary": false}, {"path": "seed_capability/policy/policy.md", "size": 7676, "preview": "# Airline Agent Policy\n\nThe current time is 2024-05-15 15:00:00 EST.\n\nAs an airline agent, you can help users **book**, **modify**, or **cancel** flight reservations. You also handle **refunds and compensation**.\n\nBefore taking any actions that update the booking database (booking, modifying flights, editing baggage, changing cabin class, or updating passenger information), you must list the action details and obtain explicit user confirmation (yes) to proceed.\n\nYou should not provide any information, knowledge, or procedures not provided by the user or available tools, or give subjective recommendations or comments.\n\nYou should only make one tool call at a time, and if you make a tool call, you should not respond to the user simultaneously. If you respond to the user, you should not make a tool call at the same time.\n\nYou should deny user requests that are against this policy.\n\nYou should transfer the user to a human agent if and only if the request cannot be handled within the scope of your actions. To transfer, first make a tool call to transfer_to_human_agents, and then send the message 'YOU ARE BEING TRANSFERRED TO A HUMAN AGENT. PLEASE HOLD ON.' to the user.\n\n## Domain Basic\n\n### User\nEach user has a profile containing:\n- user id\n- email\n- addresses\n- date of birth\n- payment methods\n- membership level\n- reservation numbers\n\nThere are three types of payment methods: **credit card**, **gift card**, **travel certificate**.\n\nThere are three membership levels: **regular**, **silver**, **gold**.\n\n### Flight\nEach flight has the following attributes:\n- flight number\n- origin\n- destination\n- scheduled departure and arrival time (local time)\n\nA flight can be available at multiple dates. For each date:\n- If the status is **available**, the flight has not taken off, available seats and prices are listed.\n- If the status is **delayed** or **on time**, the flight has not taken off, cannot be booked.\n- If the status is **flying**, the flight has taken off but not landed, cannot be booked.\n\nThere are three cabin classes: **basic economy**, **economy**, **business**. **basic economy** is its own class, completely distinct from **economy**.\n\nSeat availability and prices are listed for each cabin class.\n\n### Reservation\nEach reservation specifies the following:\n- reservation id\n- user id\n- trip type\n- flights\n- passengers\n- payment methods\n- created time\n- baggages\n- travel insurance information\n\nThere are two types of trip: **one way** and **round trip**.\n\n## Book flight\n\nThe agent must first obtain the user id from the user. \n\nThe agent should then ask for the trip type, origin, destination.\n\nCabin:\n- Cabin class must be the same across all the flights in a reservation. \n\nPassengers: \n- Each reservation can have at most five passengers. \n- The agent needs to collect the first name, last name, and date of birth for each passenger. \n- All passengers must fly the same flights in the same cabin.\n\nPayment: \n- Each reservation can use at most one travel certificate, at most one credit card, and at most three gift cards. \n- The remaining amount of a travel certificate is not refundable. \n- All payment methods must already be in user profile for safety reasons.\n\nChecked bag allowance: \n- If the booking user is a regular member:\n  - 0 free checked bag for each basic economy passenger\n  - 1 free checked bag for each economy passenger\n  - 2 free checked bags for each business passenger\n- If the booking user is a silver member:\n  - 1 free checked bag for each basic economy passenger\n  - 2 free checked bag for each economy passenger\n  - 3 free checked bags for each business passenger\n- If the booking user is a gold member:\n  - 2 free checked bag for each basic economy passenger\n  - 3 free checked bag for each economy passenger\n  - 4 free checked bags for each business passenger\n- Each extra baggage is 50 dollars.\n\nDo not add checked bags that the user does not need.\n\nTravel insurance: \n- The agent should ask if the user wants to buy the travel insura \u2026[+3676 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/reference/data_model.py", "size": 10402, "preview": "from typing import Annotated, Any, Dict, List, Literal, Optional, Union\n\nfrom pydantic import BaseModel, Field\n\nfrom tau2.domains.airline.utils import AIRLINE_DB_PATH\nfrom tau2.environment.db import DB\n\nFlightType = Literal[\"round_trip\", \"one_way\"]\nCabinClass = Literal[\"business\", \"economy\", \"basic_economy\"]\nInsurance = Literal[\"yes\", \"no\"]\n\n\nMembershipLevel = Annotated[\n    Literal[\"gold\", \"silver\", \"regular\"], Field(description=\"Membership level\")\n]\n\n\nclass AirportCode(BaseModel):\n    iata: str = Field(description=\"IATA code\")\n    city: str = Field(description=\"City name\")\n\n\nAirportInfo = Annotated[list[AirportCode], Field(description=\"Airport information\")]\n\n\nclass Name(BaseModel):\n    first_name: str = Field(description=\"The person's first name\")\n    last_name: str = Field(description=\"The person's last name\")\n\n\nclass Address(BaseModel):\n    address1: str = Field(description=\"Primary address line\")\n    address2: Optional[str] = Field(\n        None, description=\"Secondary address line (optional)\"\n    )\n    city: str = Field(description=\"City name\")\n    country: str = Field(description=\"Country name\")\n    state: str = Field(description=\"State or province name\")\n    zip: str = Field(description=\"Postal code\")\n\n\n# Payment Related Models\nclass Payment(BaseModel):\n    payment_id: str = Field(description=\"Unique identifier for the payment\")\n    amount: int = Field(description=\"Payment amount in dollars\")\n\n\nclass PaymentMethodBase(BaseModel):\n    source: str = Field(description=\"Type of payment method\")\n    id: str = Field(description=\"Unique identifier for the payment method\")\n\n\nclass CreditCard(PaymentMethodBase):\n    source: Literal[\"credit_card\"] = Field(\n        description=\"Indicates this is a credit card payment method\"\n    )\n    brand: str = Field(description=\"Credit card brand (e.g., visa, mastercard)\")\n    last_four: str = Field(description=\"Last four digits of the credit card\")\n\n\nclass GiftCard(PaymentMethodBase):\n    source: Literal[\"gift_card\"] = Field(\n        description=\"Indicates this is a gift card payment method\"\n    )\n    amount: float = Field(description=\"Gift card value amount\")\n    id: str = Field(description=\"Unique identifier for the gift card\")\n\n\nclass Certificate(PaymentMethodBase):\n    source: Literal[\"certificate\"] = Field(\n        description=\"Indicates this is a certificate payment method\"\n    )\n    amount: float = Field(description=\"Certificate value amount\")\n\n\nPaymentMethod = Union[CreditCard, GiftCard, Certificate]\n\n\nclass Passenger(BaseModel):\n    first_name: str = Field(description=\"Passenger's first name\")\n    last_name: str = Field(description=\"Passenger's last name\")\n    dob: str = Field(description=\"Date of birth in YYYY-MM-DD format\")\n\n\nSeatPrices = Annotated[\n    dict[CabinClass, int], Field(description=\"Prices for different cabin classes\")\n]\nAvailableSeats = Annotated[\n    dict[CabinClass, int],\n    Field(description=\"Available seats for different cabin classes\"),\n]\n\n\nclass FlightDateStatusAvailable(BaseModel):\n    status: Literal[\"available\"] = Field(\n        description=\"Indicates flight is available for booking\"\n    )\n    available_seats: AvailableSeats = Field(description=\"Available seats by class\")\n    prices: SeatPrices = Field(description=\"Current prices by class\")\n\n\nclass FlightDataStatusOnTime(BaseModel):\n    status: Literal[\"on time\"] = Field(description=\"Indicates flight is on time\")\n    estimated_departure_time_est: str = Field(\n        description=\"Estimated departure time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T06:04:00\"\n    )\n    estimated_arrival_time_est: str = Field(\n        description=\"Estimated arrival time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T07:30:00\"\n    )\n\n\nclass FlightDataStatusFlying(BaseModel):\n    status: Literal[\"flying\"] = Field(description=\"Indicates flight is in flight\")\n    actual_departure_time_est: str = Field(\n        description=\"Actual departure time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T06:04:0 \u2026[+6402 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/tools/tools.py", "size": 22922, "preview": "\"\"\"Airline tool set for the tau2-bench airline domain.\n\nThe ``AirlineTools`` class subclasses tau2's ``AirlineTools`` (to inherit the\nprivate helpers \u2014 ``_get_user``, ``_get_reservation``, ``_search_direct_flight``,\n... \u2014 and the ``ToolKitBase`` machinery) and re-declares every agent-callable tool\nwith its real tau2 body (copied verbatim from ``tau2.domains.airline.tools``).\n\nThe module-level ``REMOVE_TOOLS`` set names any tools to drop from the exposed\nagent toolset (empty by default; the seed exposes tau2's default airline tools).\n\nNote: this file does NOT use ``from __future__ import annotations``. Tool\nsignature annotations must be real, importable objects (not strings), because\ntau2 builds each tool's parameter JSON-schema from the live signature via\n``create_model(...).model_json_schema()`` and stringified forward refs would not\nresolve. Every type used in a signature below is imported here.\n\"\"\"\n\nfrom copy import deepcopy\nfrom typing import List, Literal, Optional  # noqa: F401  (available for tool signatures)\n\nfrom loguru import logger\n\nfrom tau2.domains.airline.data_model import (\n    AirportCode,\n    AirportInfo,\n    CabinClass,\n    Certificate,\n    DirectFlight,\n    Flight,\n    FlightDa nger.\n            payment_methods: An array of objects containing details about each payment method.\n            total_baggages: The total number of baggage items to book the reservation.\n            nonfree_baggages: The number of non-free baggage items to book the reservation.\n            insurance: Whether the reservation has insurance.\n        \"\"\"\n        if all(isinstance(flight, dict) for flight in flights):\n            flights = [FlightInfo(**flight) for flight in flights]\n        if all(isinstance(passenger, dict) for passenger in passengers):\n            passengers = [Passenger(**passenger) for passenger in passengers]\n        if all(isinstance(payment_method, dict) for payment_method in payment_methods):\n            payment_methods = [\n                Payment(**payment_method) for payment_method in payment_methods\n            ]\n \u2026[+18918 chars truncated]", "truncated": true, "binary": false}]}, "host_session": {}, "decisions": [{"t": 1795542227.9791467, "id": "cand_0001", "decision": "accept", "evidence": {}, "rationale": "paired \u0394\u0304=+0.1333 > 0.2\u00b7SE=0.0247 (SE=0.1237, n=10, resolvable effect size 2\u00b7SE=0.2475)", "optimizer_usd": null}, {"t": 1795543133.9678886, "id": "cand_0002", "decision": "accept", "evidence": {}, "rationale": "paired \u0394\u0304=+0.1000 > 0.2\u00b7SE=0.0264 (SE=0.1319, n=10, resolvable effect size 2\u00b7SE=0.2639)", "optimizer_usd": null}, {"t": 1795544261.8591874, "id": "cand_0003", "decision": "accept", "evidence": {}, "rationale": "paired \u0394\u0304=+0.1333 > 0.2\u00b7SE=0.0267 (SE=0.1333, n=10, resolvable effect size 2\u00b7SE=0.2667)", "optimizer_usd": null}]}, "diffs": {"cand_0001": [{"file": "DIAGNOSIS.json", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,53 @@"}, {"t": "add", "l": "+{"}, {"t": "add", "l": "+  \"candidate\": \"cand_0001\","}, {"t": "add", "l": "+  \"headline\": \"Empty-seed init: code-enforce payment normalize/auto-correct + payment_history re-sync + enriched communicate ret inistic nonfree-baggage recompute + total_price>0 payment guard\","}, {"t": "add", "l": "+     \"files\": [\"tools/tools.py\"], \"lever\": \"CAPABILITY-GAP\", \"clusters\": [\"F\"], \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+     \"verified\": \"silver/business/3pax/total5 + nonfree=99 + empty payment_id -> recomputed 0, no payment error; no-op when correct.\"},"}, {"t": "add", "l": "+    {\"id\": \"E5\", \"title\": \"Actionable update_reservation_passengers count-mismatch error\","}, {"t": "add", "l": "+     \"files\": [\"tools/tools.py\"], \"lever\": \"KNOWLEDGE\", \"clusters\": [\"D\"], \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+     \"verified\": \"count mismatch raises error naming current count + 'modify in place' guidance.\"},"}, {"t": "add", "l": "+    {\"id\": \"E6\", \"title\": \"RULE 1 confirm-once-then-execute (anti-stall) with worked right/wrong examples\","}, {"t": "add", "l": "+     \"files\": [\"policy/policy.md\"], \"lever\": \"BEHAVIORAL\", \"clusters\": [\"A\"], \"blast_radius\": \"WIDE\","}, {"t": "add", "l": "+     \"verified\": \"prose; targets the 7 zero-write stall trials; softness clause permits judgement.\"},"}, {"t": "add", "l": "+    {\"id\": \"E7\", \"title\": \"RULE 2 state exact $ charged/refunded; RULE 3 baggage table; RULE 4 payment sums; RULE 5 disambiguate + act-vs-transfer + modify-in-place; RULE 6 softness\","}, {"t": "add", "l": "+     \"files\": [\"policy/policy.md\"], \"lever\": \"CONTRACT\", \"clusters\": [\"C\", \"D\", \"E\", \"F\"], \"blast_radius\": \"WIDE\","}, {"t": "add", "l": "+     \"verified\": \"prose; general rules traced to policy + observed failures.\"}"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"skipped\": ["}, {"t": "add", "l": "+    {\"title\": \"Hardcoded reservation-id disambiguation (17/22)\", \"reason\": \"Would overfit; handled via prose + actionable error.\"},"}, {"t": "add", "l": "+    {\"title\": \"Multi-certificate split auto-correct (23)\", \"reason\": \"No safe general 'which cert absorbs' rule; only single-method/single-cc handled.\"},"}, {"t": "add", "l": "+    {\"title\": \"Task 19 trial 1\", \"reason\": \"Flagged infra noise (###STOP### + leaked reasoning); not optimizable.\"}"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"techniques\": [\"in-body validation/normalization guard\", \"in-body auto-correction fired only on mismatch\", \"latent-bug fix (payment_history re-sync)\", \"enriched DB-safe return values for COMMUNICATE\", \"actionable error messages\", \"deterministic policy recompute as no-op\", \"explicit mid-model prose rules with worked examples\", \"softness/judgement clause\", \"subagent fan-out for diagnosis\", \"live-DB verification of every code edit\"]"}, {"t": "add", "l": "+}"}]}, {"file": "policy/policy.md", "rows": [{"t": "hunk", "l": "@@ -166,2 +166,113 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " Do not offer compensation for any other reason than the ones listed above."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+---"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# HOW TO EXECUTE \u2014 explicit operating procedure (read this carefully)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your single most important goal is to complete the user's request so that the booking"}, {"t": "add", "l": "+database ends in exactly the state the task expects, AND to say out loud every number"}, {"t": "add", "l": "+and fact the task needs confirmed. A task is only counted as solved when BOTH are true:"}, {"t": "add", "l": "+(1) the database write (book / update / cancel) actually happened and is correct, and"}, {"t": "add", "l": "+(2) you told the user the key figures (the exact total charged or refunded, the new"}, {"t": "add", "l": "+flights). Doing one without the other scores zero. Follow the rules below literally."}, {"t": "add", "l": "+These rules exist to help you reach the highest-reward execution; if in a specific"}, {"t": "add", "l": "+situation you judge that following one of them would PREVENT you from completing the"}, {"t": "add", "l": "+user's request correctly, use your judgement and do what gets the task done."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## RULE 1 \u2014 Confirm ONCE, then EXECUTE on your very next turn (never stall)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+A very common and costly mistake is to describe the change, get the user's \"yes\", and"}, {"t": "add", "l": "+then STOP or send another sentence \u2014 without ever calling the write tool. The write"}, {"t": "add", "l": "+never happens and the task scores zero."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Do exactly this, in order:"}, {"t": "add", "l": "+1. Gather every detail you need (user id, reservation id, flights, passengers, payment)."}, {"t": "add", "l": "+2. Send ONE message that lists the action details and asks for confirmation."}, {"t": "add", "l": "+3. The moment the user confirms (says \"yes\", \"confirm\", \"go ahead\", \"do it\", \"sounds"}, {"t": "add", "l": "+   good\", or similar) \u2014 your VERY NEXT action MUST be the write tool call"}, {"t": "add", "l": "+   (`book_reservation`, `update_reservation_flights`, `update_reservation_baggages`,"}, {"t": "add", "l": "+   `update_reservation_passengers`, or `cancel_reservation`). Do NOT send another"}, {"t": "add", "l": "+   message before the tool call. Do NOT ask for confirmation a second time."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example (correct):"}, {"t": "add", "l": "+- Assistant: \"To confirm: book HAT271 ORD\u2192PHL on 2024-05-26, economy, 2 passengers,"}, {"t": "add", "l": "+  pay $348 on gift_card_5094406. Shall I proceed?\""}, {"t": "add", "l": "+- User: \"yes\""}, {"t": "add", "l": "+- Assistant: [immediately calls book_reservation(...)]  \u2190 the write happens HERE"}, {"t": "add", "l": "+- Assistant: \"Done \u2014 I've charged $348 to your gift card. Your reservation id is HATHAT.\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example (WRONG \u2014 do not do this):"}, {"t": "add", "l": "+- User: \"yes\""}, {"t": "add", "l": "+- Assistant: \"Great, I'll book that for you now.\" \u2190 NO. You stalled. The write never ran."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## RULE 2 \u2014 Always STATE the exact dollar amount and key details after a write"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+After any book / update / cancel you MUST, in a plain-text message to the user, state"}, {"t": "add", "l": "+the exact numbers involved as literal digits:"}, {"t": "add", "l": "+- The exact total amount charged (e.g. \"I've charged $348 to your credit card\"), OR"}, {"t": "add", "l": "+- The exact total amount refunded (e.g. \"You will be refunded $1,230 to your gift"}, {"t": "add", "l": "+  card within 5\u20137 business days\"), OR"}, {"t": "add", "l": "+- \"There is no additional charge.\" when the change costs $0."}, {"t": "add", "l": "+When you change flights, also state the new flight numbers and dates. When you cancel,"}, {"t": "add", "l": "+state that the reservation is cancelled and the refund amount."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The write tools return a `payment_summary` field with the exact amount and a"}, {"t": "add", "l": "+`communicate_to_user` field telling you precisely what to say \u2014 copy that number into"}, {"t": "add", "l": "+your message verbatim. The reward checker looks for these exact figures in your text."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## RULE 3 \u2014 Baggage count: compute non-free bags with this formula (do not guess)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Free checked-bag allowance PER PASSENGER:"}, {"t": "add", "l": "+| membership | basic_economy | economy | business |"}, {"t": "add", "l": "+|---|---|---|---|"}, {"t": "add", "l": "+| regular | 0 | 1 | 2 |"}, {"t": "add", "l": "+| silver | 1 | 2 | 3 |"}, {"t": "add", "l": "+| gold | 2 | 3 | 4 |"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+free_bags = (allowance for this membership & cabin) \u00d7 (number of passengers)"}, {"t": "add", "l": "+nonfree_baggages = max(0, total_baggages \u2212 free_bags)"}, {"t": "add", "l": "+Each non-free bag costs $50."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example: gold member, 2 passengers, economy, wants 3 bags total."}, {"t": "add", "l": "+free_bags = 3 \u00d7 2 = 6 \u2192 nonfree_baggages = max(0, 3 \u2212 6) = 0 \u2192 $0 charge."}, {"t": "add", "l": "+Worked example: regular member, 1 passenger, economy, wants 3 bags total."}, {"t": "add", "l": "+free_bags = 1 \u00d7 1 = 1 \u2192 nonfree_baggages = max(0, 3 \u2212 1) = 2 \u2192 $100 charge."}, {"t": "add", "l": "+(The baggage tool also recomputes this for you and corrects the value if you pass a"}, {"t": "add", "l": "+wrong `nonfree_baggages`, but always do the arithmetic yourself so you can tell the"}, {"t": "add", "l": "+user the correct charge.)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## RULE 4 \u2014 Payment amounts must add up to the computed total"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The sum of the `amount` fields across all `payment_methods` must equal the total price"}, {"t": "add", "l": "+you computed (flights \u00d7 passengers + insurance 30\u00d7passengers + 50\u00d7nonfree_baggages)."}, {"t": "add", "l": "+Only payment methods already on the user's profile may be used. (The booking tool will"}, {"t": "add", "l": "+also auto-correct the split when there is a single payment method, or a single credit"}, {"t": "add", "l": "+card covering the remainder, but you must still compute and state the correct total.)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## RULE 5 \u2014 Find the RIGHT reservation; act on what IS allowed; modify in place"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **Identify the reservation before acting.** When the user names a trip by its route"}, {"t": "add", "l": "+  or dates (e.g. \"my New York to Chicago trip\") rather than by reservation id, call"}, {"t": "add", "l": "+  `get_user_details` to list their reservation ids, then `get_reservation_details` on"}, {"t": "add", "l": "+  the candidates and act on the ONE whose origin, destination and dates match. Never"}, {"t": "add", "l": "+  guess a reservation id."}, {"t": "add", "l": "+- **Do the eligible part; transfer only the truly impossible.** Call"}, {"t": "add", "l": "+  `transfer_to_human_agents` ONLY when no policy-allowed tool action can resolve the"}, {"t": "add", "l": "+  request. If the user asks for several things and some are allowed (e.g. a cabin"}, {"t": "add", "l": "+  upgrade) and some are not (e.g. a cancellation the rules forbid), DO the allowed"}, {"t": "add", "l": "+  writes and simply decline the rest \u2014 do not transfer or abandon the whole task. If a"}, {"t": "add", "l": "+  basic-economy flight cannot be modified but the user needs a change, and cancellation"}, {"t": "add", "l": "+  IS permitted under the Cancel-flight rules, offer and perform the cancellation."}, {"t": "add", "l": "+- **Only touch what the user asked for.** Do not cancel, rebook, or change a reservation"}, {"t": "add", "l": "+  the user did not ask you to change."}, {"t": "add", "l": "+- **Change passengers in place.** To rename or correct a passenger, submit the SAME"}, {"t": "add", "l": "+  number of passenger objects with the corrected details. Never add or drop a passenger"}, {"t": "add", "l": "+  \u2014 the passenger COUNT can never change (`update_reservation_passengers` rejects a"}, {"t": "add", "l": "+  different count)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## RULE 6 \u2014 You are maximizing task success"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Everything above is in service of completing the user's request at the highest reward."}, {"t": "add", "l": "+If a rule here ever conflicts with correctly fulfilling an explicit, policy-allowed user"}, {"t": "add", "l": "+request, exercise judgement and prioritize getting the task done correctly."}]}, {"file": "tools/tools.py", "rows": [{"t": "hunk", "l": "@@ -48,4 +48      \"clusters\": [\"A\"], \"blast_radius\": \"WIDE\","}, {"t": "add", "l": "+     \"verified\": \"Read through against failing trials 8/12/19/40 t0 (turns resolve to a direct write) and passing 11/37/40 t1/t2 (already execute directly, so unchanged).\"},"}, {"t": "add", "l": "+    {\"id\": \"E2\", \"title\": \"Reconcile base confirmation line to defer to RULE 1 (remove stacked contradiction)\","}, {"t": "add", "l": "+     \"files\": [\"policy/policy.md\"], \"lever\": \"CONTRACT\","}, {"t": "add", "l": "+     \"clusters\": [\"A\"], \"blast_radius\": \"MODERATE\","}, {"t": "add", "l": "+     \"verified\": \"Read: no longer hard-requires a separate confirmation turn; cross-references RULE 1.\"},"}, {"t": "add", "l": "+    {\"id\": \"E3\", \"title\": \"Add rule: a cabin change IS allowed on basic economy (flights-vs-cabin distinction)\","}, {"t": "add", "l": "+     \"files\": [\"policy/policy.md\"], \"lever\": \"KNOWLEDGE\","}, {"t": "add", "l": "+     \"clusters\": [\"B\"], \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+     \"verified\": \"Policy source confirms: 'all reservations, including basic economy, can change cabin without changing the flights.' Reverses task 22 refusal.\"},"}, {"t": "add", "l": "+    {\"id\": \"E4\", \"title\": \"Tighten transfer/finish rules: never transfer over an unsure number; finish every write of a multi-part request\","}, {"t": "add", "l": "+     \"files\": [\"policy/policy.md\"], \"lever\": \"BEHAVIORAL\","}, {"t": "add", "l": "+     \"clusters\": [\"C\"], \"blast_radius\": \"MODERATE\","}, {"t": "add", "l": "+     \"verified\": \"Read against 17 t2 / 8 t1 / 19 t1 / 23 t1 over-transfer turns.\"},"}, {"t": "add", "l": "+    {\"id\": \"E5\", \"title\": \"New composite atomic-write tool modify_reservation(reservation_id, payment_id, cabin?, flights?, passengers?, total_baggages?)\","}, {"t": "add", "l": "+     \"files\": [\"tools/tools.py\", \"policy/policy.md\"], \"lever\": \"CAPABILITY\","}, {"t": "add", "l": "+     \"clusters\": [\"D\", \"A\"], \"blast_radius\": \"MODERATE\","}, {"t": "add", "l": "+     \"verified\": \"Live DB: FQ8APE -> economy+Omar Rossi+3 bags = $209 atomic; GV1N64 cabin-only downgrade = $5244 refund (== task 11 gold); count-mismatch error propagates; $0 baggage path clean; 15 tools register; py_compile clean.\"}"}, {"t": "ctx", "l": "   ],"}, {"t": "ctx", "l": "   \"skipped\": ["}, {"t": "del", "l": "-    {\"title\": \"Hardcoded reservation-id disambiguation (17/22)\", \"reason\": \"Would overfit; handled via prose + actionable error.\"},"}, {"t": "del", "l": "-    {\"title\": \"Multi-certificate split auto-correct (23)\", \"reason\": \"No safe general 'which cert absorbs' rule; only single-method/single-cc handled.\"},"}, {"t": "del", "l": "-    {\"title\": \"Task 19 trial 1\", \"reason\": \"Flagged infra noise (###STOP### + leaked reasoning); not optimizable.\"}"}, {"t": "add", "l": "+    {\"title\": \"Remove update_* primitives behind modify_reservation\", \"reason\": \"Passing tasks 11/37/40 call the primitives directly; bare removal is a large regression risk. Kept additive.\"},"}, {"t": "add", "l": "+    {\"title\": \"Task 25\", \"reason\": \"max_steps search loop / user ###OUT-OF-SCOPE### on missing DOB \u2014 partly infra/no-win; not optimized against.\"}"}, {"t": "ctx", "l": "   ],"}, {"t": "del", "l": "-  \"techniques\": [\"in-body validation/normalization guard\", \"in-body auto-correction fired only on mismatch\", \"latent-bug fix (payment_history re-sync)\", \"enriched DB-safe return values for COMMUNICATE\", \"actionable error messages\", \"deterministic policy recompute as no-op\", \"explicit mid-model prose rules with worked examples\", \"softness/judgement clause\", \"subagent fan-out for diagnosis\", \"live-DB verification of every code edit\"]"}, {"t": "add", "l": "+  \"techniques\": [\"decision-chain prose rewrite with worked right/wrong examples\", \"resolve stacked rule contradiction\", \"add sourced knowledge rule\", \"composite atomic-write tool (SKILL lever 2)\", \"literal per-parameter slot-filling docs for a mid-tier reader\", \"live-DB verification of every code path\"]"}, {"t": "ctx", "l": " }"}]}, {"file": "policy/policy.md", "rows": [{"t": "hunk", "l": "@@ -5,5 +5,5 @@"}, {"t": "ctx", "l": " As an airline agent, you can help users **book**, **modify**, or **cancel** flight reservations. You also handle **refunds and compensation**."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Before taking any actions that update the booking database (booking, modifying flights, editing baggage, changing cabin class, or updating passenger information), you must list the action details and obtain explicit user confirmation (yes) to proceed."}, {"t": "add", "l": "+Before taking any actions that update the booking database (booking, modifying flights, editing baggage, changing cabin class, or updating passenger information), list the action details for the user. Once you have gathered every required detail and the user has told you what they want, proceed directly to the write tool call \u2014 do not stall on a separate \"shall I proceed?\" turn (see RULE 1 below, which governs exactly how to confirm-and-execute without losing the write)."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " You should not provide any information, knowledge, or procedures not provided by the user or available tools, or give subjective recommendations or comments."}, {"t": "hunk", "l": "@@ -181,29 +181,42 @@"}, {"t": "ctx", "l": " user's request correctly, use your judgement and do what gets the task done."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-## RULE 1 \u2014 Confirm ONCE, then EXECUTE on your very next turn (never stall)"}, {"t": "del", "l": "-"}, {"t": "del", "l": "-A very common and costly mistake is to describe the change, get the user's \"yes\", and"}, {"t": "del", "l": "-then STOP or send another sentence \u2014 without ever calling the write tool. The write"}, {"t": "del", "l": "-never happens and the task scores zero."}, {"t": "del", "l": "-"}, {"t": "del", "l": "-Do exactly this, in order:"}, {"t": "del", "l": "-1. Gather every detail you need (user id, reservation id, flights, passengers, payment)."}, {"t": "del", "l": "-2. Send ONE message that lists the action details and asks for confirmation."}, {"t": "del", "l": "-3. The moment the user confirms (says \"yes\", \"confirm\", \"go ahead\", \"do it\", \"sounds"}, {"t": "del", "l": "-   good\", or similar) \u2014 your VERY NEXT action MUST be the write tool call"}, {"t": "add", "l": "+## RULE 1 \u2014 Once you have every detail, EXECUTE the write \u2014 never end a turn on a bare \"Shall I proceed?\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+The single most costly mistake in this benchmark is this: you gather everything you"}, {"t": "add", "l": "+need, then end your turn with a standalone question like \"Shall I proceed?\" or \"Shall"}, {"t": "add", "l": "+I go ahead?\". The user replies \"yes\" and the conversation ENDS on that same turn \u2014 so"}, {"t": "add", "l": "+you never get another turn, the write tool is NEVER called, and the task scores zero."}, {"t": "add", "l": "+This has happened again and again. You cannot assume you will get a turn after the"}, {"t": "add", "l": "+user says \"yes\"."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Therefore, follow this decision chain on every write (book / update / cancel):"}, {"t": "add", "l": "+1. Do I still need a detail from the user (user id, reservation id, which flights,"}, {"t": "add", "l": "+   passenger info, which payment method)? \u2192 If YES, ask for ONLY the missing detail."}, {"t": "add", "l": "+2. Do I now have EVERY required detail, and has the user told me what they want? \u2192"}, {"t": "add", "l": "+   If YES, your NEXT action MUST be the write tool call itself"}, {"t": "ctx", "l": "    (`book_reservation`, `update_reservation_flights`, `update_reservation_baggages`,"}, {"t": "del", "l": "-   `update_reservation_passengers`, or `cancel_reservation`). Do NOT send another"}, {"t": "del", "l": "-   message before the tool call. Do NOT ask for confirmation a second time."}, {"t": "del", "l": "-"}, {"t": "del", "l": "-Worked example (correct):"}, {"t": "del", "l": "-- Assistant: \"To confirm: book HAT271 ORD\u2192PHL on 2024-05-26, economy, 2 passengers,"}, {"t": "del", "l": "-  pay $348 on gift_card_5094406. Shall I proceed?\""}, {"t": "del", "l": "-- User: \"yes\""}, {"t": "del", "l": "-- Assistant: [immediately calls book_reservation(...)]  \u2190 the write happens HERE"}, {"t": "del", "l": "-- Assistant: \"Done \u2014 I've charged $348 to your gift card. Your reservation id is HATHAT.\""}, {"t": "del", "l": "-"}, {"t": "del", "l": "-Worked example (WRONG \u2014 do not do this):"}, {"t": "del", "l": "-- User: \"yes\""}, {"t": "del", "l": "-- Assistant: \"Great, I'll book that for you now.\" \u2190 NO. You stalled. The write never ran."}, {"t": "add", "l": "+   `update_reservation_passengers`, `cancel_reservation`, or the combined"}, {"t": "add", "l": "+   `modify_reservation`). Do NOT send another message first. Do NOT ask \"Shall I"}, {"t": "add", "l": "+   proceed?\" and wait. The write IS the confirmation point \u2014 perform it, THEN tell the"}, {"t": "add", "l": "+   user what you did and the exact amount."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+A turn in which you already hold every required detail must END IN THE WRITE TOOL"}, {"t": "add", "l": "+CALL, not in a question. Asking the user for a missing fact is fine (that is step 1);"}, {"t": "add", "l": "+asking a second time for permission once you already have everything is the trap."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example (correct \u2014 the write happens, task scores):"}, {"t": "add", "l": "+- User: \"Change the passenger name on reservation 3RK2T9 to Mei Garcia.\""}, {"t": "add", "l": "+- Assistant: [looks up the reservation] then [immediately calls"}, {"t": "add", "l": "+  update_reservation_passengers(...)]  \u2190 the write happens HERE, no extra question"}, {"t": "add", "l": "+- Assistant: \"Done \u2014 the passenger is now Mei Garcia, no additional charge.\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example (WRONG \u2014 do NOT do this; it is the #1 cause of zero scores):"}, {"t": "add", "l": "+- Assistant: \"To confirm, I will change the passenger to Mei Garcia. Shall I go ahead?\""}, {"t": "add", "l": "+- User: \"Yes.\" \u2190 the conversation ends here; you never called the tool; score 0."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If you genuinely must show the user one specific number to check before charging it"}, {"t": "add", "l": "+(e.g. a large or ambiguous total), you may present it in ONE message \u2014 but the instant"}, {"t": "add", "l": "+the user responds at all, EXECUTE the write as your next action, and never present"}, {"t": "add", "l": "+such a message more than once."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## RULE 2 \u2014 Always STATE the exact dollar amount and key details after a write"}, {"t": "hunk", "l": "@@ -258,11 +271,31 @@"}, {"t": "ctx", "l": "   the candidates and act on the ONE whose origin, destination and dates match. Never"}, {"t": "ctx", "l": "   guess a reservation id."}, {"t": "add", "l": "+- **A cabin change IS allowed on a basic-economy reservation.** Do NOT confuse two"}, {"t": "add", "l": "+  different rules. \"Basic economy flights cannot be modified\" means you cannot swap a"}, {"t": "add", "l": "+  basic-economy reservation onto DIFFERENT flight numbers. It does NOT forbid changing"}, {"t": "add", "l": "+  the CABIN. Changing cabin (e.g. upgrading basic economy \u2192 economy or \u2192 business) is"}, {"t": "add", "l": "+  allowed for EVERY reservation, INCLUDING basic economy, as long as the flights stay"}, {"t": "add", "l": "+  the same; the user pays the price difference. So when a user with a basic-economy"}, {"t": "add", "l": "+  reservation asks to upgrade the cabin, say YES and do it \u2014 keep the same flight // A tiny, deliberately non-general markdown renderer: headings, bullet lines,
// blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();

/* ---------- 5. Lineage tree (DAG, best-spine highlighted) ---------- */
(function(){
  const nodes=G.nodes, byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
  if(nodes.length<2)return;
  const s=sec('Lineage');
  // depth = distance from root; assign columns by BFS order within depth
  const depth={}; const order=[];
  (function walk(id,d){const n=byId[id];if(!n||depth[id]!=null)return;depth[id]=d;order.push(id);
    (n.children||[]).forEach(c=>walk(c,d+1));})('seed',0);
  nodes.forEach(n=>{if(depth[n.id]==null){depth[n.id]=0;order.push(n.id);}});
  const cols={}; const maxd=Math.max(...Object.values(depth));
  const byDepth={}; order.forEach(id=>{const d=depth[id];(byDepth[d]=byDepth[d]||[]).push(id);});
  const pos={};
  for(let d=0;d<=maxd;d++){(byDepth[d]||[]).forEach((id,i)=>pos[id]={x:60+d*150,y:40+i*46});}
  // best-lineage spine
  const spine=new Set(); let cur=S.best_id;
  while(cur){spine.add(cur);cur=byId[cur]?byId[cur].parent:null;}
  const W=80+( maxd+1)*150, H=40+Math.max(...Object.values(byDepth).map(a=>a.length))*46+20;
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const parents=[n.parent,...(n.merge_of||[])].filter(x=>x&&pos[x]);
    parents.forEach(pp=>{const a=pos[pp];const onSpine=spine.has(n.id)&&spine.has(pp);
      el.append(svg('path',{d:`M${a.x+14},${a.y} C${(a.x+p.x)/2},${a.y} ${(a.x+p.x)/2},${p.y} ${p.x-14},${p.y}`,
        fill:'none',stroke:onSpine?'var(--champion)':'var(--line)','stroke-width':onSpine?2.5:1.2}));});
  });
  nodes.forEach(n=>{const p=pos[n.id];if(!p)return;
    const col=n.status==='accepted'?'var(--ok)':n.status==='rejected'?'var(--warn)':n.status==='failed'?'var(--bad)':'var(--accent)';
    const c=svg('circle',{cx:p.x,cy:p.y,r:n.id===S.best_id?9:6,fill:col,
      stroke:spine.has(n.id)?'var(--champion)':'var(--bg)','stroke-width':spine.has(n.id)?2:1});
    c.addEventListener('mousemove',e=>showTip(e,`${n.id}\n${n.status}  val=${fmt(n.val)}\n${n.reason||''}`));
    c.addEventListener('mouseleave',hideTip); el.append(c);
    // A node with outgoing edges (the seed, above all) has a connector leaving at exactly
    // y=p.y, so a label on the baseline right of the node is drawn UNDER that line and reads
    // as struck through. Lift those labels clear of the connector.
    const outgoing=(n.children||[]).some(c2=>pos[c2]);
    txt(el,{x:p.x+12,y:outgoing?p.y-8:p.y+4,fill:'var(--muted)','font-size':10},n.id);
  });
  s.append(el);
  s.append($('div',{class:'legend',html:'<span><i style="background:var(--champion)"></i>best lineage spine</span>'+
    '<span class="muted">merges shown as multi-parent edges</span>'}));
})();

/* ---------- 6e. Cost ledger — every dollar, attributed ---------- */
(function(){

  const head=$('div',{style:'display:flex;flex-wrap:wrap;gap:22px;margin-bottom:12px'});
  const stat=(l,v,cls='')=>{const d=$('div');d.append($('div',{class:'eyebrow',text:l}),
    $('div',{class:'num '+cls,style:'font-weight:700;margin-top:2px',text:v}));return d;};
  const off=Math.abs(L.unattributed_usd)>0.0005;
  head.append(stat('total recorded','$'+L.total_usd.toFixed(4),''),
              stat('attributed to events','$'+L.attributed_usd.toFixed(4)),
              stat('unattributed','$'+L.unattributed_usd.toFixed(4),off?'':'muted'),
              stat('rows with no cost recorded',String(L.rows_missing_cost)));
  s.append(head);
  if(off)s.append($('div',{class:'banner',text:
    '$'+Math.abs(L.unattributed_usd).toFixed(4)+' of recorded spend is not accounted for by the rows '+
    'below. That happens when a phase records into the run spend accounting without emitting a '+

  const KC={intake:'var(--muted2)',baseline_eval:'var(--accent)',candidate_eval:'var(--ok)',
            optimizer_call:'var(--champion)',test_eval:'var(--idk)'};
  const PH={intake:'Intake',baseline:'Baseline',optimize:'Optimize',finalize:'Finalize (sealed test)'};
  const maxRow=Math.max(1e-9,...L.rows.map(r=>r.usd||0));
  for(const ph of ['intake','baseline','optimize','finalize']){
    const rows=L.rows.filter(r=>r.phase===ph); if(!rows.length)continue;
    const sum=rows.reduce((a,r)=>a+(r.usd||0),0), miss=rows.filter(r=>r.usd==null).length;

/* ---------- 9. Activity log — every event, filterable ---------- */
(function(){
  const LOG=S.log||[]; if(!LOG.length)return;
  const s=sec('Activity log — every event this run recorded');
  const bar=$('div',{class:'row',style:'margin-bottom:10px;align-items:center'});
  const q=$('input',{type:'search',placeholder:'search kind, candidate, message…',style:'flex:1;min-width:180px'});
  const phase=$('select'); ['all','intake','baseline','optimize','finalize'].forEach(p2=>
    phase.append($('option',{value:p2,text:p2})));
  const kind=$('select');
  ['all',...[...new Set(LOG.map(r=>r.kind))].sort()].forEach(k=>kind.append($('option',{value:k,text:k})));
  const count=$('span',{class:'muted num'});
  bar.append(q,$('span',{class:'muted',text:'phase'}),phase,$('span',{class:'muted',text:'kind'}),kind,count);
  s.append(bar);
  const list=$('div'); s.append(list);
  const TONE={optimizer_error:'var(--bad)',tamper_detected:'var(--bad)',step_indecisive:'var(--idk)',
    accept:'var(--ok)',finalize:'var(--ok)',reject:'var(--bad)',evaluate:'var(--accent)',
    minibatch:'var(--accent)',gate_warning:'var(--warn)',budget_warning:'var(--warn)',
    splits_warning:'var(--warn)'};
  const clock=t2=>t2==null?'--:--:--':new Date(t2*1000).toLocaleTimeString([], {hour12:false});
  function gist(r){
    const d=r.detail||{}, b=[];
    if(d.split)b.push('split='+d.split);
    if(typeof d.reward==='number')b.push('reward='+d.reward.toFixed(3));
    if(typeof d.val==='number')b.push('val='+d.val.toFixed(3));
    if(typeof d.cost_usd==='number')b.push('$'+d.cost_usd.toFixed(4));
    if(typeof d.opt_cost_usd==='number')b.push('opt $'+d.opt_cost_usd.toFixed(4));
    if(d.accept!==undefined)b.push(d.accept?'ACCEPT':'reject');
    return b.length?b.join('  '):(r.text||Object.keys(d).join(', '));
  }
  const open=new Set();
  function render(){
    const needle=q.value.trim().toLowerCase();
    const rows=LOG.filter(r=>{
      if(phase.value!=='all'&&r.phase!==phase.value)return false;
      if(kind.value!=='all'&&r.kind!==kind.value)return false;
      if(!needle)return true;
      return (r.kind+' '+(r.candidate||'')+' '+(r.text||'')+' '+JSON.stringify(r.detail||{}))
        .toLowerCase().includes(needle);
    });
    count.textContent=rows.length+'/'+LOG.length;
    list.innerHTML='';
    if(!rows.length){list.append($('p',{class:'muted',text:'No event matches this filter.'}));return;}
    rows.forEach(r=>{
      const row=$('div',{class:'logrow'});
      row.append($('span',{class:'muted num',text:clock(r.t)}),
        $('span',{class:'muted',style:'font-size:10px;text-transform:uppercase;letter-spacing:.05em',text:r.phase}),
        $('span',{class:'k',style:'color:'+(TONE[r.kind]||'var(--muted2)'),
                  text:r.kind+(r.candidate?' '+r.candidate:'')}),
        $('span',{class:'muted2',style:'color:var(--muted2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
                  text:gist(r)}));
      list.append(row);
      const det=$('div',{class:'logdet'});
      // textContent only: this text is model/subprocess-authored and must never be parsed as markup.
      det.textContent=(r.text?r.text+'\n\n':'')+
        Object.entries(r.detail||{}).map(([k,v])=>k+' = '+(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))).join('\n');
      det.style.display=open.has(r.seq)?'block':'none';
      list.append(det);
      row.addEventListener('click',()=>{
        if(open.has(r.seq)){open.delete(r.seq);det.style.display='none';}
        else{open.add(r.seq);det.style.display='block';}
      });
    });
  }
  q.addEventListener('input',render);phase.addEventListener('change',render);
  kind.addEventListener('change',render);render();
})();

/* ---------- 10. evograph weakness graph (replaces the embedded viewer) ---------- */
(function(){

  const s=sec('Weakness graph — evograph');

      d.append($('span',{class:'num',style:'font-weight:700;font-size:12px',text:v==null?'—':(v*100).toFixed(1)+'%'}),
        $('div',{style:`width:100%;max-width:64px;height:${Math.max(4,(v||0)/max*110)}px;border-radius:4px 4px 0 0;background:${color}`}),
        $('span',{class:'eyebrow',text:label}),$('span',{class:'muted num',style:'font-size:10px',text:note||''}));

    rounds.forEach(r=>wrap.append(col('round '+r.round,prim(r),'var(--accent)',
