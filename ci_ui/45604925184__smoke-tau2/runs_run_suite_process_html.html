<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>cap-evolve · run dashboard</title>
<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);
background:var(--card);color:var(--muted)}
.ann .who{color:var(--muted);font-size:11px}
.heat rect{cursor:pointer} .heat text{fill:var(--muted);font-size:10px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}
</style></head><body>

e_info) and re-read every turn; (2) the prose \"execute-on-confirm same-turn\" anti-STALL rule.\n- Refuted hypotheses (do not re-test): prose anti-STALL \"act after confirming / same turn\" (cand_0001 \u00a71; tools SKILL marks it refuted for the narrated-without-action class). Also: task 37 is NOT a COMMUNICATE failure \u2014 it is an extra forbidden cancel (DB); `'HATHAT'`-style ids are tool-returned, not hallucinated.\n- High-value clusters still NOT cracked: STALL/narrated-without-action (19 t1, 22 t0, 25 t2) \u2014 prose refuted and a composite-write+remove is unsafe here because cancel/update MUST stay refusable (task 37 forbidden cancel, basic-economy flight-change refusal); design a SAFE composite only. Multi-reservation split (23) and wrong-flight selection (8,23) \u2014 model/user-sim selection, no general guard.\n- Plateau signal: one reject so far (cand_0001). Lever switch this round = from \"one big noisy batch incl. a wide dict-return\" to \"focused, strictly-no-op-on-correct code guards (incl. a NEW cancel-flown guard) + targeted policy clarifications\", raising signal-to-noise and adding a clean bounded win (task 37).\n- Cost-reduction opportunity: cost/latency not a declared objective (reward = DB\u00d7COMMUNICATE). Did not run detect_loop_patterns.py.\n- Focus next iteration: if ACCEPTED, read RESULT for which of 37/25/12/17/22 moved; then attempt a SAFE composite for the STALL cluster (e.g. only for the unambiguous single-action cancel/book path) or sharpen the route-match rule into a lookup tool if 17/22 stayed flaky. If REJECTED with broke={}, the policy \u00a71\u2013\u00a73 (widest prose) is the first suspect \u2014 drop it and keep only the four code guards (E1\u2013E3) which are strictly no-op-on-correct.\n\n> **RESULT (framework, measured):** ACCEPTED (new champion) \u00b7 val=0.617 \u0394=+0.217 \u00b7 fixed={22} \u00b7 broke={\u2014} \u00b7 unresolved={11, 12, 17, 19, 25, 37, 40, 8} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them).\n<!-- cand_0002: ACCEPTED val=0.617 \u0394=+0.217 -->\n\n## Iteration cand_0003 \u2014 keep every cand_0002 code guard; add DB-safe exact-$ return enrichment + decision rules for false-pushback / over-transfer / unsolicited-comp\n- Changes I made (1 line per edit):\n  - tools.py NEW helper `_with_payment_summary(reservation, net)` + enriched returns on `book_reservation`, `update_reservation_flights`, `update_reservation_baggages`, `cancel_reservation`: append a `payment_summary` key stating the EXACT charge (net>0) / refund (net<0) / \"$0 no cost\" with a copy-ready sentence and \"use THIS figure, not your estimate\" (cluster COMMUNICATE exact-$). `cancel_reservation` computes `refund_total=sum(payment_history.amount)` BEFORE the reversal loop and passes `-refund_total`.\n  - policy.md \u00a74 rewritten: read `payment_summary` and state THAT figure, not your pre-call arithmetic; worked example \"$5244 not $1748 (forgot \u00d73 passengers)\" (cluster COMMUNICATE).\n  - policy.md NEW \u00a77: tool prices are authoritative \u2014 do not cancel/rebook/re-price a reservation already in the correct state just because the user disputes a number (cluster false-pushback, task 25 t2).\n  - policy.md NEW \u00a78: do the in-policy action rather than transfer; `search_direct_flight` before changing flights; never offer compensation/certificates unsolicited (cluster over-transfer/unsolicited-comp, task 37 t0/t1).\n- Per change, EXPECTED effect + why safe:\n  - E1 enriched returns: task 11 (2/3 trials score 0 because the weak model echoes its stale pre-write estimate $1748 instead of the true refund 5244) now gets \"Refunded $5244\" handed to it in the return. Returns are NOT hashed \u21d2 DB byte-identical to cand_0002; verified gold-exact + copy-ready on live DB for tasks 11/12/17/19/22/25/37. Strictly additive (one new key) \u21d2 passing 12/17/22 cannot regress.\n  - E2 \u00a74: reinforces E1 at the prompt level for the amount-communication class; does not change any DB decision, so no passing task flips.\n  - E3 \u00a77/\u00a78: targets 25 t2 (cancelled a correct booking after a FALSE price complaint) and 37 t0/t1 (transferred instead of upgrading / changed flights without searching / sent an unsolicited certificate). Rules only STOP destructive/extra actions and redirect to the in-policy path \u2014 they never command a new write on a task that was already correct. Inherit the Operating-notes softness clause.\n- Building on prior RESULTS: cand_0002 ACCEPTED (+0.217, fixed={22}, broke={}). I KEPT all four of its code guards verbatim (payment auto-correct, dict normalization, baggage recompute, cancel-flown guard) and its policy \u00a71\u2013\u00a76 \u2014 re-verified intact and no-op/gold on 12/17/22/37. I added only strictly-additive surface (return key + three prose rules) on top of a known-good champion, so the gate sees the champion plus a clean COMMUNICATE lever.\n- Refuted hypotheses (did NOT re-test): the dict-return enrichment was dropped in cand_0002 for LOW coverage \u2014 but cand_0001's RESULT was broke={}/fixed={} (within noise), NOT a regression, and the live traces show task 11's refund IS already computed in the return; so this is the SAME lever made BIGGER/sharper (exact copy-ready directive + \u00a74 telling the model to prefer it over its estimate), which cand_0001's RESULT explicitly advised (\"the lever is POWER or SIZE, not a redesign\"). Prose same-turn anti-STALL stays refuted and untouched.\n- High-value clusters still NOT cracked: uncontrollable USER_STOP (19 t1, 40 t1 \u2014 user bundles \"Yes.###STOP###\" so the agent never gets an action turn; confirmed NOT narrate-without-call, no agent-side lever). Multi-reservation split (23) and flight/passenger selection (8) \u2014 model reasoning, no general guard.\n- Plateau signal: one accept (cand_0002) after one reject (cand_0001); not a plateau. Lever this round = add the one clean verified COMMUNICATE win on top of the champion rather than a new code guard, since the remaining DB-zero clusters are either uncontrollable (USER_STOP) or model-reasoning (selection/split).\n- Cost-reduction opportunity: cost/latency not a declared objective here (reward = DB\u00d7COMMUNICATE). Did not run detect_loop_patterns.py.\n- Focus next iteration: LAST iteration of this run (3/3) \u2014 none planned. If a future run reopens this: if \u00a77/\u00a78 prose regresses a passing task, drop it and keep E1+E2 (strictly additive). The only remaining systemic DB-zero lever not yet safely cracked is a narrowly-scoped confirm+write composite for the single-action path, which needs a design that keeps cancel/update refusable.\n\n> **RESULT (framework, measured):** ACCEPTED (new champion) \u00b7 val=0.717 \u0394=+0.100 \u00b7 fixed={\u2014} \u00b7 broke={\u2014} \u00b7 unresolved={11, 12, 19, 22, 25, 37, 40, 8} (moved less than 2\u00b7SE of its own measurement \u2014 NOT evidence the edit touched those tasks; do not redesign on them).\n<!-- cand_0003: ACCEPTED val=0.717 \u0394=+0.100 -->", "template_only": false}, {"name": "INSIGHTS.md", "title": "Insights \u2014 verified findings", "text": "# INSIGHTS \u2014 summarized, verified findings (accumulate across the whole run)\n\nThe JOURNAL is your per-iteration diary; THIS file is the distilled, VERIFIED takeaway a future iteration should read instead of re-reading the whole journal or old sessions/traces. Update it whenever you have a genuinely NEW, confirmed finding (an accepted/rejected RESULT counts as confirmation; a guess does not) \u2014 not every iteration needs a new entry. Structure each addition as:\n\n    ## <task or mechanism name>\n    - What worked (confirmed by a RESULT, cite the candidate id):\n    - What didn't (confirmed by a RESULT, cite the candidate id):\n    - Promising but not yet tried:\n\n## val-split scoring facts (verified against tau2 source, this run)\n- Only tasks **11** (`['5244']`, passing) and **23** (`['327','1000','1286']`) have non-empty `communicate_info`. Every other val task has `communicate_info=[]`, so COMMUNICATE is trivially 1.0 for them and their failures are pure DB. \u21d2 a broad COMMUNICATE enrichment (dict-return) has LOW coverage on this split; a narrow policy \"state the exact $\" contract is enough.\n- **Tasks 17 and 22 are the SAME scenario** (user omar_rossi_1241, NY\u2192Chicago = FQ8APE EWR\u2192ORD): change passenger to self + upgrade basic_economy\u2192economy + add 3 bags, pay by gift card. Gold = 3 writes on FQ8APE. Decoy reservation UM3OG5 is SEA\u2194DFW. The agent's dominant error is acting on UM3OG5 (first-listed) and/or refusing the upgrade as \"basic economy can't be modified\" (it CAN change cabin).\n- **Task 37 t2 fails on DB (an EXTRA forbidden cancel of NQNU5R, both flights `landed`/flown), NOT on COMMUNICATE.** Guarding `cancel_reservation` to refuse a flown-segment reservation removes the extra write; the required M20IZO upgrade is already correct.\n- `'HATHAT'`/`'HATHAU'` reservation ids are the mock `book_reservation`'s fixed returned ids, NOT hallucinations.\n\n## What didn't (confirmed by cand_0001 RESULT: rejected \u22120.100, broke={} fixed={})\n- A single large batch that included a wide dict-return enrichment + a prose \"execute-on-confirm same-turn\" anti-STALL rule landed within noise (SE=0.1, n=10). Nothing measurably broke or fixed. Lesson: favour edits that are strictly no-op on correct input (fire-only-on-error guards) to raise signal-to-noise on a noisy 10-task gate.\n\n## Promising but not yet tried\n- A SAFE composite write for the STALL cluster limited to an unambiguous single-action path (e.g. a confirm+cancel for a clearly-eligible reservation), without removing the refusable primitives.\n- Turning policy \u00a71 (route-match) into a `get_all_reservation_details(user_id)` loop/read tool if 17/22 stay flaky under the prose rule.\n\n## task 11 COMMUNICATE \u2014 the refund IS in the return; the model quotes a stale estimate (cand_0003, pending RESULT)\n- Verified live: `update_reservation_flights` on task 11's downgrade already returns `payment_history` summing to **-5244**; the 2/3 failing trials score 0 because the model states its pre-confirmation arithmetic ($1748 = per-passenger figure, forgot \u00d73 passengers) instead of reading the return. So this is a READ-THE-RETURN failure, not a compute failure.\n- Lever shipped: enrich the return with `payment_summary` = exact amount + copy-ready sentence + \"use THIS figure, not your estimate\", and policy \u00a74 tells the weak model to prefer it over its own math with the \u00d7N worked example. DB byte-identical (returns not hashed) \u21d2 zero regression risk on passing 12/17/22. (Awaiting RESULT to confirm it moves task 11.)\n\n## agent-uncontrollable USER_STOP (cand_0003)\n- Tasks 19 t1 and 40 t1 end with the user-sim's confirmation message itself carrying `###STOP###` \u2014 the episode terminates before the agent gets an action turn. These are NOT narrate-without-action and have NO agent-side prompt/tool lever. Confirmed from traces across iterations; do not spend a lever on them.\n\n## reading RESULT lines: within-noise \u2260 regressed (cand_0003)\n- cand_0001 `rejected broke={} fixed={}` meant within-noise, and its own RESULT said \"POWER or SIZE, not a redesign.\" The correct response to a within-noise lever you believe in is to make it BIGGER/sharper on a known-good base, not to drop it. cand_0003 did exactly that with the exact-$ enrichment (dropped in cand_0002 as \"low coverage\") \u2014 re-added sharper on top of the accepted champion.", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001 (first)\n- Strategy tried: diagnosed the 10-task val split directly, then shipped FIVE edit classes in one candidate (in-body auto-correct, dict normalization, arithmetic recompute, enriched returns, policy rules) rather than one timid lever. Every code lever was replayed on the exact failing-trace arguments against the LIVE airline DB and shown gold-exact before shipping \u2014 this is the decisive quality gate for a DB-hashed benchmark where you cannot run the eval yourself.\n- Key leverage insight: reward = DB \u00d7 COMMUNICATE, and the dominant zero-score cause is NOT wrong DB logic but (a) the write never executing because an error forces a 2nd confirmation that the user-sim ends with ###STOP###, and (b) a correct DB with the dollar figure never spoken. So the highest-leverage code move is to make the FIRST write succeed (auto-correct amounts/format/baggage in-body) and the highest-leverage comms move is to hand the weak model the exact $ in the return.\n- Plateau/stall signal: none yet (iteration 1).\n- What to try next: let the gate tell us which levers moved; reserve prose worked-examples for the reasoning clusters (multi-write completeness, multi-reservation split) that code cannot safely encode.\n\n## Iteration cand_0002\n- Strategy tried: on a noisy gate (SE=0.1, n=10) where cand_0001's big batch landed within noise (LEDGER row 1, rejected \u22120.100), switch from \"throw everything\" to \"maximize signal-to-noise\": ship only edits that are strictly no-op on correct input (fire-only-on-error code guards) plus a clean bounded new win (cancel-flown guard, task 37) and targeted policy clarifications for the biggest cluster (decoy reservation 17/22). Dropped cand_0001's two widest/refuted edits (dict-return enrichment, prose same-turn anti-STALL).\n- Used a read-only diagnosis subagent across all 30 trajectories FIRST \u2014 it corrected two intake hypotheses (task 37 = extra forbidden cancel not COMMUNICATE; `'HATHAT'` ids are tool-returned). Diagnosing before editing prevented two wasted levers.\n- Every code lever replayed on the exact failing-trace args against the live DB and shown gold-exact + no-op-on-correct before shipping \u2014 the decisive quality gate when you can't run the eval yourself.\n- Plateau/stall signal: STALL/narrated-without-action remains the one systemic cluster with no safe lever found yet (prose refuted, composite unsafe here). If this iteration is also flat, the next move is a narrowly-scoped safe composite, not another prose rule.\n- What to try next: gate-driven \u2014 keep the four code guards (strictly safe), and treat the policy prose block as the swing factor to trim if broke={} recurs.\n\n## Iteration cand_0003 (LAST of run, 3/3)\n- Strategy tried: build ADDITIVELY on the accepted champion cand_0002 rather than re-batching. Kept all four verified code guards + policy \u00a71\u2013\u00a76 verbatim, and added only strictly-no-op surface: a DB-safe `payment_summary` return key (returns are not hashed) plus three prose decision rules. Rationale: cand_0002 cleared the noisy gate (+0.217) by raising signal-to-noise; the way to not lose that is to not perturb any already-correct decision \u2014 a new key and STOP-only rules change no passing DB state.\n- Re-interpreted a prior \"dropped\" lever correctly: cand_0001's dict-return enrichment was dropped in cand_0002 as \"low coverage\", but its RESULT was broke={}/fixed={} = within-noise, NOT a regression. cand_0001's own RESULT said \"the lever is POWER or SIZE, not a redesign.\" So I did not abandon it \u2014 I made it SHARPER (exact copy-ready directive + \u00a74 telling the weak model to prefer the returned figure over its own estimate, with the \u00d7N-passengers worked example that is exactly task 11's failure mode). Meta-lesson: distinguish \"within-noise, make it bigger\" from \"regressed, redesign\" when reading RESULT lines \u2014 they look similar (both broke={}) but call for opposite moves.\n- Plateau/stall signal: the two remaining DB-zero clusters are now cleanly characterised as UN-leverable from the agent side on this split \u2014 (a) uncontrollable USER_STOP (simulator ends the episode in the user's confirmation turn), (b) model flight/passenger selection and multi-reservation split (reasoning, not encodable without overfitting). This is the real ceiling of prompt+tools edits on this 10-task val split; further gains need either eval-side (more trials to de-noise) or a benchmark-side fix to the USER_STOP bundling, not another capability edit.\n- What to try next run: if the objective ever adds cost/latency, run detect_loop_patterns.py (free) for a bulk-tool opportunity. For reward, the only untried safe lever is a narrowly-scoped confirm+write composite for the unambiguous single-action path \u2014 design it so cancel/update stay refusable (cancel-flown guard, basic-economy flight-change) so it cannot defeat the task-37-class guards.", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## From run suite_smoke_tau2_proj (cand_0003, last iteration)\n- **RESULT lines should distinguish \"within-noise\" from \"regressed\".** cand_0001's RESULT read `rejected \u00b7 broke={} \u00b7 unresolved={...}` and the prose correctly explained \"no task regressed; the lever is POWER or SIZE, not a redesign.\" That nuance is gold, but it lives only in free-text; the structured fields (`broke`/`fixed`/`unresolved`) look identical to a true regression's. Suggestion: add an explicit machine-readable verdict tag like `signal=within_noise | regressed | improved` to the RESULT stamp so an optimizer does not mistakenly abandon a within-noise lever (I nearly dropped the exact-$ enrichment for that reason). This is a recurring foot-gun on noisy small-split gates (SE\u22480.1, n=10).\n- **Surface which tasks have non-empty `communicate_info` up front.** A large chunk of iteration-1 diagnosis time went into discovering (via tau2 source) that only 2 of 10 val tasks score COMMUNICATE at all; the rest are pure-DB. A one-line per-task breakdown (`db_only` vs `db+communicate`, and the gold `communicate_info` literals) in the task intake would let the optimizer size COMMUNICATE-vs-DB levers immediately instead of reverse-engineering the scorer.\n- **Flag uncontrollable USER_STOP tasks.** Tasks 19 t1 / 40 t1 are unwinnable from the agent side because the user-sim appends `###STOP###` inside its confirmation turn, ending the episode before the agent can act. Three iterations each had to re-derive this from traces. If the harness can detect \"episode ended on a user turn that also carried the confirmation,\" marking those trials as agent-uncontrollable would stop optimizers from burning budget on prose anti-STALL rules the SKILL already refutes.", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0003)", "text": "# PROCESS \u2014 cand_0003 (parent cand_0002, val 0.617)\n\nHeadline: convert the one clean, verified lever left on this plateau \u2014 COMMUNICATE\nomission of the exact $ \u2014 into a deterministic, DB-safe tool-return s+tool|\"\n    r\"ValidationError|policy\\.md|failed to render|template\", re.IGNORECASE)\n\n\ndef classify_error_kind(termination: str, evidence: str = \"\") -> str:\n    \"\"\"``\"candidate\"`` | ``\"infra\"`` for an errored tau2 simulation (the ``error_kind`` hook).\n\n    The harness scores a ``candidate`` error as a measured failure (0.0) under ``errored_trial_policy:\n    fail`` and keeps ``infra`` errors as missing data, so an edit that breaks its own tools cannot hide\n    behind dropped trials. Only ``UNEXPECTED_ERROR`` whose recorded text points at candidate-owned\n    files is attributed to the candidate; timeouts, ``INFRASTRUCTURE_ERROR`` and the user-simulator\n    leak stay infra.\"\"\"\n    if \"UNEXPECTED_ERROR\" in str(termination) and _CANDIDATE_FAULT_RE.search(evidence or \"\"):\n        return \"candidate\"\n    return \"infra\"\n\n\ndef _leaked_stop_continuation(messages) -> bool:\n    \"\"\"True iff a user-simulator turn emits ``###STOP###`` alongsi \u2026[+50677 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 208, "preview": "{\"train\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"], \"val\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"], \"test\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"]}\n", "truncated": false, "binary": false}, {"path": "seed_capability/policy/policy.md", "size": 7676, "preview": "# Airline Agent Policy\n\nThe current time is 2024-05-15 15:00:00 EST.\n\nAs an airline agent, you can help users **book**, **modify**, or **cancel** flight reservations. You also handle **refunds and compensation**.\n\nBefore taking any actions that update the booking database (booking, modifying flights, editing baggage, changing cabin class, or updating passenger information), you must list the action details and obtain explicit user confirmation (yes) to proceed.\n\nYou should not provide any information, knowledge, or procedures not provided by the user or available tools, or give subjective recommendations or comments.\n\nYou should only make one tool call at a time, and if you make a tool call, you should not respond to the user simultaneously. If you respond to the user, you should not make a tool call at the same time.\n\nYou should deny user requests that are against this policy.\n\nYou should transfer the user to a human agent if and only if the request cannot be handled within the scope of your actions. To transfer, first make a tool call to transfer_to_human_agents, and then send the message 'YOU ARE BEING TRANSFERRED TO A HUMAN AGENT. PLEASE HOLD ON.' to the user.\n\n## Domain Basic\n\n### User\nEach user has a profile containing:\n- user id\n- email\n- addresses\n- date of birth\n- payment methods\n- membership level\n- reservation numbers\n\nThere are three types of payment methods: **credit card**, **gift card**, **travel certificate**.\n\nThere are three membership levels: **regular**, **silver**, **gold**.\n\n### Flight\nEach flight has the following attributes:\n- flight number\n- origin\n- destination\n- scheduled departure and arrival time (local time)\n\nA flight can be available at multiple dates. For each date:\n- If the status is **available**, the flight has not taken off, available seats and prices are listed.\n- If the status is **delayed** or **on time**, the flight has not taken off, cannot be booked.\n- If the status is **flying**, the flight has taken off but not landed, cannot be booked.\n\nThere are three cabin classes: **basic economy**, **economy**, **business**. **basic economy** is its own class, completely distinct from **economy**.\n\nSeat availability and prices are listed for each cabin class.\n\n### Reservation\nEach reservation specifies the following:\n- reservation id\n- user id\n- trip type\n- flights\n- passengers\n- payment methods\n- created time\n- baggages\n- travel insurance information\n\nThere are two types of trip: **one way** and **round trip**.\n\n## Book flight\n\nThe agent must first obtain the user id from the user. \n\nThe agent should then ask for the trip type, origin, destination.\n\nCabin:\n- Cabin class must be the same across all the flights in a reservation. \n\nPassengers: \n- Each reservation can have at most five passengers. \n- The agent needs to collect the first name, last name, and date of birth for each passenger. \n- All passengers must fly the same flights in the same cabin.\n\nPayment: \n- Each reservation can use at most one travel certificate, at most one credit card, and at most three gift cards. \n- The remaining amount of a travel certificate is not refundable. \n- All payment methods must already be in user profile for safety reasons.\n\nChecked bag allowance: \n- If the booking user is a regular member:\n  - 0 free checked bag for each basic economy passenger\n  - 1 free checked bag for each economy passenger\n  - 2 free checked bags for each business passenger\n- If the booking user is a silver member:\n  - 1 free checked bag for each basic economy passenger\n  - 2 free checked bag for each economy passenger\n  - 3 free checked bags for each business passenger\n- If the booking user is a gold member:\n  - 2 free checked bag for each basic economy passenger\n  - 3 free checked bag for each economy passenger\n  - 4 free checked bags for each business passenger\n- Each extra baggage is 50 dollars.\n\nDo not add checked bags that the user does not need.\n\nTravel insurance: \n- The agent should ask if the user wants to buy the travel insura \u2026[+3676 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/reference/data_model.py", "size": 10402, "preview": "from typing import Annotated, Any, Dict, List, Literal, Optional, Union\n\nfrom pydantic import BaseModel, Field\n\nfrom tau2.domains.airline.utils import AIRLINE_DB_PATH\nfrom tau2.environment.db import DB\n\nFlightType = Literal[\"round_trip\", \"one_way\"]\nCabinClass = Literal[\"business\", \"economy\", \"basic_economy\"]\nInsurance = Literal[\"yes\", \"no\"]\n\n\nMembershipLevel = Annotated[\n    Literal[\"gold\", \"silver\", \"regular\"], Field(description=\"Membership level\")\n]\n\n\nclass AirportCode(BaseModel):\n    iata: str = Field(description=\"IATA code\")\n    city: str = Field(description=\"City name\")\n\n\nAirportInfo = Annotated[list[AirportCode], Field(description=\"Airport information\")]\n\n\nclass Name(BaseModel):\n    first_name: str = Field(description=\"The person's first name\")\n    last_name: str = Field(description=\"The person's last name\")\n\n\nclass Address(BaseModel):\n    address1: str = Field(description=\"Primary address line\")\n    address2: Optional[str] = Field(\n        None, description=\"Secondary address line (optional)\"\n    )\n    city: str = Field(description=\"City name\")\n    country: str = Field(description=\"Country name\")\n    state: str = Field(description=\"State or province name\")\n    zip: str = Field(description=\"Postal code\")\n\n\n# Payment Related Models\nclass Payment(BaseModel):\n    payment_id: str = Field(description=\"Unique identifier for the payment\")\n    amount: int = Field(description=\"Payment amount in dollars\")\n\n\nclass PaymentMethodBase(BaseModel):\n    source: str = Field(description=\"Type of payment method\")\n    id: str = Field(description=\"Unique identifier for the payment method\")\n\n\nclass CreditCard(PaymentMethodBase):\n    source: Literal[\"credit_card\"] = Field(\n        description=\"Indicates this is a credit card payment method\"\n    )\n    brand: str = Field(description=\"Credit card brand (e.g., visa, mastercard)\")\n    last_four: str = Field(description=\"Last four digits of the credit card\")\n\n\nclass GiftCard(PaymentMethodBase):\n    source: Literal[\"gift_card\"] = Field(\n        description=\"Indicates this is a gift card payment method\"\n    )\n    amount: float = Field(description=\"Gift card value amount\")\n    id: str = Field(description=\"Unique identifier for the gift card\")\n\n\nclass Certificate(PaymentMethodBase):\n    source: Literal[\"certificate\"] = Field(\n        description=\"Indicates this is a certificate payment method\"\n    )\n    amount: float = Field(description=\"Certificate value amount\")\n\n\nPaymentMethod = Union[CreditCard, GiftCard, Certificate]\n\n\nclass Passenger(BaseModel):\n    first_name: str = Field(description=\"Passenger's first name\")\n    last_name: str = Field(description=\"Passenger's last name\")\n    dob: str = Field(description=\"Date of birth in YYYY-MM-DD format\")\n\n\nSeatPrices = Annotated[\n    dict[CabinClass, int], Field(description=\"Prices for different cabin classes\")\n]\nAvailableSeats = Annotated[\n    dict[CabinClass, int],\n    Field(description=\"Available seats for different cabin classes\"),\n]\n\n\nclass FlightDateStatusAvailable(BaseModel):\n    status: Literal[\"available\"] = Field(\n        description=\"Indicates flight is available for booking\"\n    )\n    available_seats: AvailableSeats = Field(description=\"Available seats by class\")\n    prices: SeatPrices = Field(description=\"Current prices by class\")\n\n\nclass FlightDataStatusOnTime(BaseModel):\n    status: Literal[\"on time\"] = Field(description=\"Indicates flight is on time\")\n    estimated_departure_time_est: str = Field(\n        description=\"Estimated departure time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T06:04:00\"\n    )\n    estimated_arrival_time_est: str = Field(\n        description=\"Estimated arrival time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T07:30:00\"\n    )\n\n\nclass FlightDataStatusFlying(BaseModel):\n    status: Literal[\"flying\"] = Field(description=\"Indicates flight is in flight\")\n    actual_departure_time_est: str = Field(\n        description=\"Actual departure time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T06:04:0 \u2026[+6402 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/tools/tools.py", "size": 22922, "preview": "\"\"\"Airline tool set for the tau2-bench airline domain.\n\nThe ``AirlineTools`` class subclasses tau2's ``AirlineTools`` (to inherit the\nprivate helpers \u2014 ``_get_user``, ``_get_reservation``, ``_search_direct_flight``,\n... \u2014 and the ``ToolKitBase`` machinery) and re-declares every agent-callable tool\nwith its real tau2 body (copied verbatim from ``tau2.domains.airline.tools``).\n\nThe module-level ``REMOVE_TOOLS`` set names any tools to drop from the exposed\nagent toolset (empty by default; the seed exposes tau2's default airline tools).\n\nNote: this file does NOT use ``from __future__ import annotations``. Tool\nsignature annotations must be real, importable objects (not strings), because\ntau2 builds each tool's parameter JSON-schema from the live signature via\n``create_model(...).model_json_schema()`` and stringified forward refs would not\nresolve. Every type used in a signature below is imported here.\n\"\"\"\n\nfrom copy import deepcopy\nfrom typing import List, Literal, Optional  # noqa: F401  (available for tool signatures)\n\nfrom loguru import logger\n\nfrom tau2.domains.airline.data_model import (\n    AirportCode,\n    AirportInfo,\n    CabinClass,\n    Certificate,\n    DirectFlight,\n    Flight,\n    FlightDateStatus,\n    FlightDateStatusAvailable,\n    FlightDB,\n    FlightInfo,\n    FlightType,\n    Insurance,\n    Passenger,\n    Payment,\n    Reservation,\n    ReservationFlight,\n    User,\n)\nfrom tau2.domains.ai ready correct.\"},"}, {"t": "add", "l": "+    {\"id\": \"E5\", \"title\": \"Policy execution rules: execute-on-confirm same turn, trust tool for amounts/baggage, DOB from profile, softness clause\","}, {"t": "add", "l": "+     \"files\": [\"policy/policy.md\"], \"lever\": \"BEHAVIORAL\", \"clusters\": [\"A\", \"E\"], \"blast_radius\": \"WIDE\","}, {"t": "add", "l": "+     \"verified\": \"Reinforces task 11's already-correct execute-on-confirm + exact-$ behavior; softness clause keeps the agent reward-maximizing.\"}"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"skipped\": ["}, {"t": "add", "l": "+    {\"title\": \"task 40 transfer / task 8 & 25 wrong-flight selection / task 22 incomplete multi-write / task 23 multi-reservation split\", \"reason\": \"Model reasoning/selection errors with no general code guard; a flight/subset-specific guard would overfit and risk the held-out gate.\"}"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"techniques\": [\"in-body validation guard\", \"input normalization\", \"in-body arithmetic recompute\", \"enriched DB-safe return values\", \"actionable error messages\", \"positively-framed policy rules with worked example\", \"softness/judgement clause\"]"}, {"t": "add", "l": "+}"}]}, {"file": "policy/policy.md", "rows": [{"t": "hunk", "l": "@@ -166,2 +166,28 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " Do not offer compensation for any other reason than the ones listed above."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Execution rules (follow these exactly)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your single goal is to complete the user's request so the task is graded correct: the final booking database must match what the request requires, AND you must say the exact dollar amounts out loud. The rules below help you reach that outcome. If in a specific situation following a rule below would clearly PREVENT you from completing the request correctly, use your judgement and do what completes the task correctly instead."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 1. When the user confirms, execute in the SAME turn"}, {"t": "add", "l": "+The moment the user confirms an action (they say \"yes\", \"go ahead\", \"confirm\", \"please do it\", etc.), your VERY NEXT step must be the corresponding write tool call \u2014 `book_reservation`, `update_reservation_flights`, `update_reservation_baggages`, `update_reservation_passengers`, or `cancel_reservation`. Do not reply with more text first and do not ask for confirmation a second time. The conversation can end immediately after the user confirms, so a write you postpone to \"next turn\" may never happen and the task scores zero."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- Worked example (do this):"}, {"t": "add", "l": "+  - User: \"Yes, go ahead.\""}, {"t": "add", "l": "+  - You: *(call `book_reservation(...)` now)* \u2014 then, after it returns, tell the user it is done and state the amount."}, {"t": "add", "l": "+- Counter-example (do NOT do this):"}, {"t": "add", "l": "+  - User: \"Yes, go ahead.\""}, {"t": "add", "l": "+  - You: \"Great, I will book that for you now.\" *(no tool call)* \u2014 WRONG: the booking never happened."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 2. You do not need perfect payment amounts or baggage counts \u2014 call the tool"}, {"t": "add", "l": "+The write tools fix these for you, so prefer calling the tool over going back to the user:"}, {"t": "add", "l": "+- Payment split: if your per-method amounts do not sum to the total, `book_reservation` auto-corrects them (a single method covers the whole total; with several methods the one credit card absorbs the remainder after the fixed-value gift cards and certificate). Pass the payment_ids the user chose with your best-effort amounts and let the tool settle the figures."}, {"t": "add", "l": "+- Paid-baggage count: `book_reservation` and `update_reservation_baggages` recompute the number of PAID bags from the membership/cabin free allowance and passenger count. Pass the user's requested TOTAL number of bags; you do not have to work out how many are free."}, {"t": "add", "l": "+- A payment_id for a baggage update that turns out to be within the free allowance is simply ignored (no charge), so a within-allowance baggage change never needs to go back to the user for payment."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 3. State the exact dollar amount to the user"}, {"t": "add", "l": "+Every write tool returns a `payment_summary` field containing the exact amount charged or refunded (for example `\"...Total charged: $375...\"` or `\"...Refund of $5244...\"`). In the message where you confirm the action is done, copy that exact number into your reply (e.g. \"a refund of $5244 will be returned to your gift card\"). Stating the precise figure is required for the task to be graded correct \u2014 a correct booking that never mentions the amount still fails."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 4. Getting a passenger's date of birth"}, {"t": "add", "l": "+If you need a passenger's date of birth and the user does not give it, take it from the date of birth already stored for that passenger in the user's profile (`saved_passengers`) or on the existing reservation, rather than transferring to a human. Only transfer when the request genuinely cannot be completed with the available tools."}]}, {"file": "tools/tools.py", "rows": [{"t": "hunk", "l": "@@ -14,4 +14,17 @@"}, {"t": "ctx", "l": " ``create_model(...).model_json_schema()`` and stringified forward refs would not"}, {"t": "ctx", "l": " resolve. Every type used in a signature below is imported here."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Optimizer note (cand_0001, empty-seed init):"}, {"t": "add", "l": "+  The scoring is DB x COMMUNICATE (a product). A task scores 0 if the final DB"}, {"t": "add", "l": "+  state differs from gold OR if a required dollar amount is never spoken to the"}, {"t": "add", "l": "+  user. The capability is tuned at runtime by a mid-capability model"}, {"t": "add", "l": "+  (aws/gpt-oss-120b) that reliably mis-fills payment amounts, emits malformed"}, {"t": "add", "l": "+  payment dicts, mis-counts the free-baggage allowance, and forgets to state the"}, {"t": "add", "l": "+  exact charged/refunded amount. Those behavioural misses are enforced"}, {"t": "add", "l": "+  DETERMINISTICALLY below (normalization + arithmetic in the tool bodies) because"}, {"t": "add", "l": "+  a weak reader skips a prose rule but a guard fires regardless. Tool RETURN"}, {"t": "add", "l": "+  values are NOT part of the DB hash, so the write tools also return an enriched"}, {"t": "add", "l": "+  dict carrying a ``payment_summary`` with the EXACT dollar amount for the model"}, {"t": "add", "l": "+  to copy into its reply. See ./PROCESS.md for the per-edit rationale."}, {"t": "ctx", "l": " \"\"\""}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -47,4 +60,62 @@"}, {"t": "ctx", "l": " REMOVE_TOOLS: set[str] = set()"}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+# Free checked-bag allowance PER PASSENGER, indexed by membership then cabin."}, {"t": "add", "l": "+# This is the policy table verbatim (see policy.md \"Checked bag allowance\")."}, {"t": "add", "l": "+# It is a domain constant, not a task literal."}, {"t": "add", "l": "+_FREE_BAGGAGE_ALLOWANCE: dict[str, dict[str, int]] = {"}, {"t": "add", "l": "+    \"regular\": {\"basic_economy\": 0, \"economy\": 1, \"business\": 2},"}, {"t": "add", "l": "+    \"silver\": {\"basic_economy\": 1, \"economy\": 2, \"business\": 3},"}, {"t": "add", "l": "+    \"gold\": {\"basic_economy\": 2, \"economy\": 3, \"business\": 4},"}, {"t": "add", "l": "+}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def _normalize_payment_dicts(payment_methods: list) -> list:"}, {"t": "add", "l": "+    \"\"\"Normalize raw payment-method dicts into the shape ``Payment`` expects."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    The runtime model fr }"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"techniques\": [\"input normalization\", \"in-body payment auto-correct\", \"in-body arithmetic recompute\", \"discriminating-predicate guard (cancel-flown)\", \"payment_history re-sync (latent hashed-field bug)\", \"policy decision-rule clarification with worked example\", \"output-contract rule for COMMUNICATE\", \"softness/judgement clause\"]"}, {"t": "add", "l": "+}"}]}, {"file": "policy/policy.md", "rows": [{"t": "hunk", "l": "@@ -166,2 +166,29 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " Do not offer compensation for any other reason than the ones listed above."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Operating notes (follow these precisely)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your one goal is to complete the user's request so the task is graded correct: the booking database must end in the state the request requires, and you must say out loud the exact figures the user needs. The rules below help you reach that outcome. If, in a specific situation, following one of these rules would clearly PREVENT you from completing the request correctly, use your judgement and do what completes the task at the highest reward instead."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 1. Pick the RIGHT reservation \u2014 match the route, never the first one listed"}, {"t": "add", "l": "+A user often has several reservations, and the first id you see may be the wrong one. Before you modify or cancel anything, identify the reservation whose origin, destination, and dates match what the user is talking about:"}, {"t": "add", "l": "+1. Call `get_user_details(user_id)` to get the list of the user's reservation ids."}, {"t": "add", "l": "+2. Call `get_reservation_details(...)` on the candidates and read their flights, and act only on the one whose route/dates match the user's request."}, {"t": "add", "l": "+Never call a write tool on a reservation id you have not confirmed matches the request, and never invent or guess a reservation id."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- Worked example: the user wants to change their \"New York to Chicago\" trip. `get_user_details` lists `['UM3OG5', '5RJ7UH', 'FQ8APE', 'QKRY03']`. You check them: `UM3OG5` is SEA\u2192DFW, `FQ8APE` is EWR\u2192ORD. New York\u2192Chicago is EWR (Newark)\u2192ORD (Chicago) = **FQ8APE**. Act on `FQ8APE`, NOT on the first-listed `UM3OG5`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 2. Basic economy: flights are locked, but the CABIN can still change"}, {"t": "add", "l": "+\"Basic economy flights cannot be modified\" means you cannot change WHICH flights are on the reservation. It does NOT forbid a cabin change. A basic economy reservation **can be upgraded** to economy or business: call `update_reservation_flights` with the SAME flight numbers and dates and the new `cabin`, and collect the fare difference. Do not refuse or transfer an upgrade of a basic economy reservation \u2014 it is allowed."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 3. Do not transfer or refuse an action that is within policy"}, {"t": "add", "l": "+Transfer to a human (and refuse) ONLY when the request genuinely cannot be done with your tools or is forbidden by this policy. Most modify, upgrade, add-baggage, and cancel requests ARE within policy \u2014 perform them. In particular: a cancellation is allowed when the booking is within 24h, the airline cancelled, the cabin is business, or the user has insurance with a covered reason; an upgrade out of basic economy is allowed (rule 2). Before transferring, re-check whether a tool can do what the user asked."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 4. State the exact dollar amounts"}, {"t": "add", "l": "+When you finish a booking, change, or cancellation, state the exact dollar figure that was charged or refunded, written as the plain number (for example \"$5244\"). If the user asked what something costs or what they will be refunded, give the exact amount. A reservation that ends in the correct database state but never has its charged/refunded figure spoken is still graded wrong, so always say the number."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 5. Fill passenger details from the profile"}, {"t": "add", "l": "+If you need a passenger's date of birth and the user does not restate it, take it from the user's profile (`get_user_details`) or the existing reservation rather than transferring. Only transfer when the detail truly cannot be obtained from the tools."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### 6. Trust the write tools for amounts and baggage counts"}, {"t": "add", "l": "+The write tools settle payment splits and recompute the number of paid bags from the free allowance for you. Pass the payment methods the user chose with your best-effort amounts, and pass the TOTAL number of bags the user wants; you do not need to work out the split or the free-vs-paid breakdown yourself. Prefer calling the tool over going back to the user to re-derive a number."}]}, {"file": "tools/tools.py", "rows": [{"t": "hunk", "l": "@@ -59,4 +59,65 @@"}, {"t": "ctx", "l": "         super().__init__(db)"}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+    # ----- internal helpers (not exposed as tools) -------------------------"}, {"t": "add", "l": "+    # Free checked-bag allowance PER PASSENGER, by membership level and cabin"}, {"t": "add", "l": "+    # class. These are the exact numbers in the policy (\"Checked bag allowance\")"}, {"t": "add", "l": "+    # and are domain constants, not task-specific values."}, {"t": "add", "l": "+    _FREE_BAGGAGE_ALLOWANCE = {"}, {"t": "add", "l": "+        \"regular\": {\"basic_economy\": 0, \"economy\": 1, \"business\": 2},"}, {"t": "add", "l": "+        \"silver\": {\"basic_economy\": 1, \"economy\": 2, \"business\": 3},"}, {"t": "add", "l": "+        \"gold\": {\"basic_economy\": 2, \"economy\": 3, \"business\": 4},"}, {"t": "add", "l": "+    }"}, {"t": "add", "l": "+"
