<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>cap-evolve · run dashboard</title>
<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);
background:var(--card);color:var(--muted)}
.ann .who{color:var(--muted);font-size:11px}
.heat rect{cursor:pointer} .heat text{fill:var(--muted);font-size:10px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}
</style></head><body>

andidate\n    has a harness.json \u2014 see \"agent-harness capability\" below. Without that file the run is\n    byte-for-byte the plain tau2 ``llm_agent``.\n\nHOW IT WORKS:\n  - tasks()      \u2192 all 50 airline tasks from tau2 (stable, no network).\n  - run_batch()  \u2192 tau2's own batch runner (run_tasks) with your model.\n  - score()      \u2192 tau2's own reward in [0,1] with gold-safe feedback.\n  - apply()      \u2192 overrides the registry's airline env constructor.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport functools\nimport importlib.util\nimport json\nimport os\nimport threading\nimport uuid\nimport re\nimport sys\nimport time\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\n\nfrom cap_evolve import CapabilityAdapter, Rollout, Score, Task\n\nimport model_config\n\nDOMAIN = \"airline\"\n\n# docs/TAU2_SUMMARY.md row 7: the tau2-bench user simulator sometimes emits ``###STOP###``\n# in the SAME message as reasoning that explicitly plans to continue (\"we must wait for\n# agent's third message. Continue.\"), in 15/27 observed task-7 failures \u2014 ~4.2% of all\n# rollouts lost to a simulator artifact that measures nothing about agent skill. tau2-bench\n# is an external package (cloned at setup time, not vendored here), so the fix lives on our\n# side of the boundary: detect the leak from the message trace and mark the rollout as\n# infra noise, matching the existing ``rollout.error`` path below rather than scoring the\n# agent down for a bug that is not the agent's.\n_STOP_LEAK_RE = re.compile(\n    r\"###\\s*stop\\s*###.{0,400}\\b(?:continue|continuing|wait\\s+for|must\\s+wait|\"\n    r\"keep\\s+(?:going|talking)|not\\s+(?:done|finished)\\s+yet)\\b\"\n    r\"|\\b(?:continue|continuing|wait\\s+for|must\\s+wait|\"\n    r\"keep\\s+(?:going|talking)|not\\s+(?:done|finished)\\s+yet)\\b.{0,400}###\\s*stop\\s*###\",\n    re.I | re.S,\n)\n\n\n#: Markers that tie an error to something the CANDIDATE owns (its edited ``tools.py`` / tool schema /\n#: ``policy.md`` template), as opposed to the serving path. Matched against the error text tau2 records.\n_CANDIDATE_FAULT_RE = re.compile(\n    r\"tools\\.py|tool[_ ]definition|tool[_ ]schema|invalid\\s+tool|unknown\\s+tool|\"\n    r\"ValidationError|policy\\.md|failed to render|template\", re.IGNORECASE)\n\n\ndef classify_error_kind(termination: str, evidence: str = \"\") -> str:\n    \"\"\"``\"candidate\"`` | ``\"infra\"`` for an errored tau2 simulation (the ``error_kind`` hook).\n\n    The harness scores a ``candidate`` error as a measured failure (0.0) under ``errored_trial_policy:\n    fail`` and keeps ``infra`` errors as missing data, so an edit that breaks its own tools cannot hide\n    behind dropped trials. Only ``UNEXPECTED_ERROR`` whose recorded text points at candidate-owned\n    files is attributed to the candidate; timeouts, ``INFRASTRUCTURE_ERROR`` and the user-simulator\n    leak stay infra.\" \u2026[+63638 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 208, "preview": "{\"train\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"], \"val\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"], \"test\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"]}\n", "truncated": false, "binary": false}, {"path": "seed_capability/policy/policy.md", "size": 7676, "preview": "# Airline Agent Policy\n\nThe current time is 2024-05-15 15:00:00 EST.\n\nAs an airline agent, you can help users **book**, **modify**, or **cancel** flight reservations. You also handle **refunds and compensation**.\n\nBefore taking any actions that update the booking database (booking, modifying flights, editing baggage, changing cabin class, or updating passenger information), you must list the action details and obtain explicit user confirmation (yes) to proceed.\n\nYou should not provide any information, knowledge, or procedures not provided by the user or available tools, or give subjective recommendations or comments.\n\nYou should only make one tool call at a time, and if you make a tool call, you should not respond to the user simultaneously. If you respond to the user, you should not make a tool call at the same time.\n\nYou should deny user requests that are against this policy.\n\nYou should transfer the user to a human agent if and only if the request cannot be handled within the scope of your actions. To transfer, first make a tool call to transfer_to_human_agents, and then send the message 'YOU ARE BEING TRANSFERRED TO A HUMAN AGENT. PLEASE HOLD ON.' to the user.\n\n## Domain Basic\n\n### User\nEach user has a profile containing:\n- user id\n- email\n- addresses\n- date of birth\n- payment methods\n- membership level\n- reservation numbers\n\nThere are three types of payment methods: **credit card**, **gift card**, **travel certificate**.\n\nThere are three membership levels: **regular**, **silver**, **gold**.\n\n### Flight\nEach flight has the following attributes:\n- flight number\n- origin\n- destination\n- scheduled departure and arrival time (local time)\n\nA flight can be available at multiple dates. For each date:\n- If the status is **available**, the flight has not taken off, available seats and prices are listed.\n- If the status is **delayed** or **on time**, the flight has not taken off, cannot be booked.\n- If the status is **flying**, the flight has taken off but not landed, cannot be booked.\n\nThere are three cabin classes: **basic economy**, **economy**, **business**. **basic economy** is its own class, completely distinct from **economy**.\n\nSeat availability and prices are listed for each cabin class.\n\n### Reservation\nEach reservation specifies the following:\n- reservation id\n- user id\n- trip type\n- flights\n- passengers\n- payment methods\n- created time\n- baggages\n- travel insurance information\n\nThere are two types of trip: **one way** and **round trip**.\n\n## Book flight\n\nThe agent must first obtain the user id from the user. \n\nThe agent should then ask for the trip type, origin, destination.\n\nCabin:\n- Cabin class must be the same across all the flights in a reservation. \n\nPassengers: \n- Each reservation can have at most five passengers. \n- The agent needs to collect the first name, last name, and date of birth for each passenger. \n- All passengers must fly the same flights in the same cabin.\n\nPayment: \n- Each reservation can use at most one travel certificate, at most one credit card, and at most three gift cards. \n- The remaining amount of a travel certificate is not refundable. \n- All payment methods must already be in user profile for safety reasons.\n\nChecked bag allowance: \n- If the booking user is a regular member:\n  - 0 free checked bag for each basic economy passenger\n  - 1 free checked bag for each economy passenger\n  - 2 free checked bags for each business passenger\n- If the booking user is a silver member:\n  - 1 free checked bag for each basic economy passenger\n  - 2 free checked bag for each economy passenger\n  - 3 free checked bags for each business passenger\n- If the booking user is a gold member:\n  - 2 free checked bag for each basic economy passenger\n  - 3 free checked bag for each economy passenger\n  - 4 free checked bags for each business passenger\n- Each extra baggage is 50 dollars.\n\nDo not add checked bags that the user does not need.\n\nTravel insurance: \n- The agent should ask if the user wants to buy the travel insura \u2026[+3676 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/reference/data_model.py", "size": 10402, "preview": "from typing import Annotated, Any, Dict, List, Literal, Optional, Union\n\nfrom pydantic import BaseModel, Field\n\nfrom tau2.domains.airline.utils import AIRLINE_DB_PATH\nfrom tau2.environment.db import DB\n\nFlightType = Literal[\"round_trip\", \"one_way\"]\nCabinClass = Literal[\"business\", \"economy\", \"basic_economy\"]\nInsurance = Literal[\"yes\", \"no\"]\n\n\nMembershipLevel = Annotated[\n    Literal[\"gold\", \"silver\", \"regular\"], Field(description=\"Membership level\")\n]\n\n\nclass AirportCode(BaseModel):\n    iata: str = Field(description=\"IATA code\")\n    city: str = Field(description=\"City name\")\n\n\nAirportInfo = Annotated[list[AirportCode], Field(description=\"Airport information\")]\n\n\nclass Name(BaseModel):\n    first_name: str = Field(description=\"The person's first name\")\n    last_name: str = Field(description=\"The person's last name\")\n\n\nclass Address(BaseModel):\n    address1: str = Field(description=\"Primary address line\")\n    address2: Optional[str] = Field(\n        None, description=\"Secondary address line (optional)\"\n    )\n    city: str = Field(description=\"City name\")\n    country: str = Field(description=\"Country name\")\n    state: str = Field(description=\"State or province name\")\n    zip: str = Field(description=\"Postal code\")\n\n\n# Payment Related Models\nclass Payment(BaseModel):\n    payment_id: str = Field(description=\"Unique identifier for the payment\")\n    amount: int = Field(description=\"Payment amount in dollars\")\n\n\nclass PaymentMethodBase(BaseModel):\n    source: str = Field(description=\"Type of payment method\")\n    id: str = Field(description=\"Unique identifier for the payment method\")\n\n\nclass CreditCard(PaymentMethodBase):\n    source: Literal[\"credit_card\"] = Field(\n        description=\"Indicates this is a credit card payment method\"\n    )\n    brand: str = Field(description=\"Credit card brand (e.g., visa, mastercard)\")\n    last_four: str = Field(description=\"Last four digits of the credit card\")\n\n\nclass GiftCard(PaymentMethodBase):\n    source: Literal[\"gift_card\"] = Field(\n        description=\"Indicates this is a gift card payment method\"\n    )\n    amount: float = Field(description=\"Gift card value amount\")\n    id: str = Field(description=\"Unique identifier for the gift card\")\n\n\nclass Certificate(PaymentMethodBase):\n    source: Literal[\"certificate\"] = Field(\n        description=\"Indicates this is a certificate payment method\"\n    )\n    amount: float = Field(description=\"Certificate value amount\")\n\n\nPaymentMethod = Union[CreditCard, GiftCard, Certificate]\n\n\nclass Passenger(BaseModel):\n    first_name: str = Field(description=\"Passenger's first name\")\n    last_name: str = Field(description=\"Passenger's last name\")\n    dob: str = Field(description=\"Date of birth in YYYY-MM-DD format\")\n\n\nSeatPrices = Annotated[\n    dict[CabinClass, int], Field(description=\"Prices for different cabin classes\")\n]\nAvailableSeats = Annotated[\n    dict[CabinClass, int],\n    Field(description=\"Available seats for different cabin classes\"),\n]\n\n\nclass FlightDateStatusAvailable(BaseModel):\n    status: Literal[\"available\"] = Field(\n        description=\"Indicates flight is available for booking\"\n    )\n    available_seats: AvailableSeats = Field(description=\"Available seats by class\")\n    prices: SeatPrices = Field(description=\"Current prices by class\")\n\n\nclass FlightDataStatusOnTime(BaseModel):\n    status: Literal[\"on time\"] = Field(description=\"Indicates flight is on time\")\n    estimated_departure_time_est: str = Field(\n        description=\"Estimated departure time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T06:04:00\"\n    )\n    estimated_arrival_time_est: str = Field(\n        description=\"Estimated arrival time in ES e baggage items to book the reservation.\n            insurance: Whether the reservation has insurance.\n        \"\"\"\n        if all(isinstance(flight, dict) for flight in flights):\n            flights = [FlightInfo(**flight) for flight in flights]\n        if all(isinstance(passenger, dict) for passenger in passengers):\n            passengers = [Passenger(**passenger) for passenger in passengers]\n        if all(isinstance(payment_method, dict) for payment_method in payment_methods):\n            payment_methods = [\n                Payment(**payment_method) for payment_method in payment_methods\n            ]\n \u2026[+18918 chars truncated]", "truncated": true, "binary": false}]}, "host_session": {}, "decisions": [{"t": 1795611123.9668293, "id": "cand_0001", "decision": "accept", "evidence": {}, "rationale": "paired \u0394\u0304=+0.0500 > 0.2\u00b7SE=0.0222 (SE=0.1112, n=10, resolvable effect size 2\u00b7SE=0.2225)", "optimizer_usd": null}, {"t": 1795612106.0746632, "id": "cand_0002", "decision": "reject", "evidence": {}, "rationale": "paired \u0394\u0304=-0.0333 <= 0.2\u00b7SE=0.0257 (SE=0.1286, n=10, resolvable effect size 2\u00b7SE=0.2572)", "optimizer_usd": null}, {"t": 1795613518.5399227, "id": "cand_0003", "decision": "reject", "evidence": {}, "rationale": "paired \u0394\u0304=-0.0833 <= 0.2\u00b7SE=0.0273 (SE=0.1366, n=10, resolvable effect size 2\u00b7SE=0.2733)", "optimizer_usd": null}]}, "diffs": {"cand_0001": [{"file": "DIAGNOSIS.json", "rows": [{"t": "hunk", "l": "@@ -0,0 +1,28 @@"}, {"t": "add", "l": "+{"}, {"t": "add", "l": "+  \"candidate\": \"cand_0001\","}, {"t": "add", "l": "+  \"headline\": \"Deterministic in-body tool guards (payment normalize+auto-correct, baggage recompute, cancel-flown) + narrow payment_summary returns + targeted policy rules for the 2 COMMUNICATE tasks and the basic-economy/stall prose misses.\","}, {"t": "add", "l": "+  \"clusters\": ["}, {"t": "add", "l": "+    {\"id\": \"A\", \"name\": \"Payment format/amount at bo ng tasks have empty communicate_info so no regression.\"},"}, {"t": "add", "l": "+    {\"id\": \"E6\", \"title\": \"policy: basic-economy cabin change always allowed; upgrade = same flights + new cabin\", \"files\": [\"policy/policy.md\"], \"lever\": \"KNOWLEDGE\", \"clusters\": [\"D\"], \"blast_radius\": \"BOUNDED\", \"verified\": \"Prose; matches gold update_reservation_flights for FQ8APE.\"},"}, {"t": "add", "l": "+    {\"id\": \"E7\", \"title\": \"policy: identify reservation by route (get_user/get_reservation), keep passenger count; confirm-once-then-act; never report done without the call; softness clause\", \"files\": [\"policy/policy.md\"], \"lever\": \"CONTRACT\", \"clusters\": [\"E\", \"G\"], \"blast_radius\": \"MODERATE\", \"verified\": \"Prose best-effort; does not change passing-task DB.\"}"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"skipped\": ["}, {"t": "add", "l": "+    {\"title\": \"Composite atomic-write + remove primitives for STALL\", \"reason\": \"Refuted in memory: writes must stay refusable (flown-trip cancel, basic-economy segment change). Prose only.\"},"}, {"t": "add", "l": "+    {\"title\": \"Task 23 multi-certificate identity\", \"reason\": \"No safe general rule for which certificate absorbs which booking; auto-correct fixes amounts not cert identity.\"},"}, {"t": "add", "l": "+    {\"title\": \"Wide dict-return enrichment (communicate_to_user dump)\", \"reason\": \"Rejected within noise in a prior run; kept return enrichment to a single payment_summary key.\"}"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"techniques\": [\"in-body validation guards\", \"input normalization\", \"deterministic recompute from policy constants\", \"payment auto-correction\", \"enriched return values\", \"actionable error messages\", \"policy worked examples\", \"softness clause\"]"}, {"t": "add", "l": "+}"}]}, {"file": "policy/policy.md", "rows": [{"t": "hunk", "l": "@@ -14,4 +14,35 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " You should transfer the user to a human agent if and only if the request cannot be handled within the scope of your actions. To transfer, first make a tool call to transfer_to_human_agents, and then send the message 'YOU ARE BEING TRANSFERRED TO A HUMAN AGENT. PLEASE HOLD ON.' to the user."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Your overriding goal (read this first)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your single most important objective is to complete the user's request correctly and completely, so the interaction is graded as successful. The numbered rules and worked examples in this document exist to help you reach that outcome reliably. If, in a specific situation, you judge that following one of the *procedural/presentational* guidelines below literally would PREVENT a correct, successful completion of the user's request, use your judgement and do what produces the correct result. (This latitude is only for procedure and phrasing \u2014 never relax the airline's hard constraints: eligibility rules, obtaining confirmation, and payment methods already on file.)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Executing a confirmed action \u2014 do not stall"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Follow this exact sequence for every booking, modification, or cancellation:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. Gather the required details and state them back to the user (what will change, and the exact cost or refund)."}, {"t": "add", "l": "+2. Ask for confirmation and wait for an explicit \"yes\" \u2014 ONCE per action."}, {"t": "add", "l": "+3. The moment the user confirms, your very next step MUST be the write tool call (`book_reservation`, `update_reservation_flights`, `update_reservation_baggages`, `update_reservation_passengers`, or `cancel_reservation`). Do not re-ask, do not add another chat turn, do not end your turn with only a message. Confirmation is your signal to ACT, not to stop."}, {"t": "add", "l": "+4. Only after the write tool returns may you tell the user it is done. Never report a change as completed (e.g. \"I've updated your reservation\") unless you have actually called the write tool this turn and seen its result."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example: User says \"yes, go ahead.\" \u2192 You immediately call `update_reservation_flights(...)` (no further message first) \u2192 it returns \u2192 you tell the user the result and the exact amount."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Communicating amounts \u2014 state the EXACT total"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Whenever an action charges or refunds money, state to the user the EXACT TOTAL dollar amount, summed across ALL passengers \u2014 never the per-passenger figure by itself. Every write tool returns a `payment_summary` field containing this exact number; read it and state that number verbatim to the user."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example: a fare difference of $1748 per passenger for a reservation with 3 passengers must be communicated as the total **$5244** (= 1748 \u00d7 3) \u2014 this is exactly what `payment_summary` reports. Quoting only \"$1748\" is wrong."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## Identifying the correct reservation"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+A user often describes a reservation by its route, cities, or dates rather than its id, and may hold several reservations. Before any write:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+1. Call `get_user_details(user_id)` to list the user's reservation ids."}, {"t": "add", "l": "+2. Call `get_reservation_details` on candidates and pick the reservation whose origin, destination, dates, and passengers MATCH what the user described."}, {"t": "add", "l": "+3. Do NOT default to the first-listed reservation id \u2014 confirm it is the one the user means before writing to it."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+When updating passengers, keep the SAME number of passengers the reservation already has (the passenger count can never change); do not duplicate a passenger to pad the list, or `update_reservation_passengers` will reject the call."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Domain Basic"}, {"t": "hunk", "l": "@@ -108,5 +139,8 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " Change flights: "}, {"t": "del", "l": "-- Basic economy flights cannot be modified."}, {"t": "add", "l": "+- Basic economy restriction \u2014 this is about WHICH flight segments a reservation contains, NOT about its cabin. You may not change the flight segments of a reservation that is **currently** in basic economy. It does NOT forbid a cabin change."}, {"t": "add", "l": "+  - You MAY always change the cabin class \u2014 upgrade (basic_economy \u2192 economy/business) or downgrade (\u2192 basic_economy) \u2014 including for a reservation currently in basic economy, as long as no segment has already flown. A cabin change uses `update_reservation_flights`."}, {"t": "add", "l": "+  - To UPGRADE a basic economy reservation while keeping its itinerary: call `update_reservation_flights` with the SAME flight segments it already has and the new `cabin`. Do NOT refuse this as \"basic economy cannot be modified\" \u2014 changing cabin is allowed."}, {"t": "add", "l": "+  - Worked example: a user in basic_economy on segments HAT056 (2024-05-25) and HAT138 (2024-05-25) wants economy. Call `update_reservation_flights(reservation_id, cabin='economy', flights=[HAT056 2024-05-25, HAT138 2024-05-25], payment_id=<a gift card or credit card on file>)`."}, {"t": "ctx", "l": " - Other reservations can be modified without changing the origin, destination, and trip type."}, {"t": "ctx", "l": " - Some flight segments can be kept, but their prices will not be updated based on the current price."}]}, {"file": "tools/tools.py", "rows": [{"t": "hunk", "l": "@@ -48,4 +48,50 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " "}, {"t": "add", "l":  against task 37 t2 (abandoned M20IZO after landed-cancel block).\"},"}, {"t": "add", "l": "+    {\"id\": \"E6\", \"title\": \"Resolve 'the flight I took before' from the user's existing reservations\","}, {"t": "add", "l": "+     \"files\": [\"policy.md\"], \"lever\": \"KNOWLEDGE\", \"clusters\": [\"E\"], \"blast_radius\": \"BOUNDED\","}, {"t": "add", "l": "+     \"verified\": \"Read-through against task 8 (gold reads WUNA5K to get HAT271).\"}"}, {"t": "ctx", "l": "   ],"}, {"t": "ctx", "l": "   \"skipped\": ["}, {"t": "del", "l": "-    {\"title\": \"Composite atomic-write + remove primitives for STALL\", \"reason\": \"Refuted in memory: writes must stay refusable (flown-trip cancel, basic-economy segment change). Prose only.\"},"}, {"t": "del", "l": "-    {\"title\": \"Task 23 multi-certificate identity\", \"reason\": \"No safe general rule for which certificate absorbs which booking; auto-correct fixes amounts not cert identity.\"},"}, {"t": "del", "l": "-    {\"title\": \"Wide dict-return enrichment (communicate_to_user dump)\", \"reason\": \"Rejected within noise in a prior run; kept return enrichment to a single payment_summary key.\"}"}, {"t": "add", "l": "+    {\"title\": \"Task 23 multi-booking cheapest-fare + multi-certificate split\", \"reason\": \"No safe general rule for cheapest-business selection or per-booking cert routing; a literal would overfit.\"},"}, {"t": "add", "l": "+    {\"title\": \"Task 22 wrong-payment-method trials\", \"reason\": \"Which payment method to use is the user's choice; not a deterministic guard.\"},"}, {"t": "add", "l": "+    {\"title\": \"STALL/###STOP### and leaked-reasoning trials\", \"reason\": \"Uncontrollable infra noise per instructions.\"}"}, {"t": "ctx", "l": "   ],"}, {"t": "del", "l": "-  \"techniques\": [\"in-body validation guards\", \"input normalization\", \"deterministic recompute from policy constants\", \"payment auto-correction\", \"enriched return values\", \"actionable error messages\", \"policy worked examples\", \"softness clause\"]"}, {"t": "add", "l": "+  \"techniques\": [\"composite atomic-write tool keeping existing state verbatim\", \"in-body eligibility guard (flown-segment)\", \"enriched payment_summary return\", \"city->airport knowledge rule\", \"mandatory-write rule with worked example\", \"multi-action completion rule\"]"}, {"t": "ctx", "l": " }"}]}, {"file": "policy/policy.md", "rows": [{"t": "hunk", "l": "@@ -30,4 +30,12 @@"}, {"t": "ctx", "l": " Worked example: User says \"yes, go ahead.\" \u2192 You immediately call `update_reservation_flights(...)` (no further message first) \u2192 it returns \u2192 you tell the user the result and the exact amount."}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+## Complete EVERY action the user requested"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+A single request often contains several independent actions (e.g. \"change the cabin, rename the passenger, and add 3 bags\", or \"cancel reservation A and change reservation B\"). You must carry out EVERY action that is valid \u2014 each one is a separate write tool call. Do not do one and forget the rest, and do not stop after the first."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If ONE of the requested actions cannot be performed (for example, a reservation with an already-flown segment cannot be cancelled), still perform ALL the OTHER actions that ARE valid. Handle only the blocked part by explaining it or transferring for that part \u2014 never abandon the doable actions because one action was blocked."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example: the user asks to cancel reservation A (has a flown segment \u2192 not allowed) and upgrade reservation B to business. You still upgrade reservation B with `change_cabin`, and separately tell the user that A cannot be cancelled. You do NOT skip B's upgrade just because A was blocked."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " ## Communicating amounts \u2014 state the EXACT total"}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -44,5 +52,22 @@"}, {"t": "ctx", "l": " 3. Do NOT default to the first-listed reservation id \u2014 confirm it is the one the user means before writing to it."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-When updating passengers, keep the SAME number of passengers the reservation already has (the passenger count can never change); do not duplicate a passenger to pad the list, or `update_reservation_passengers` will reject the call."}, {"t": "add", "l": "+### Match by CITY, not by exact airport code or date"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+A user names a CITY (\"New York\", \"Chicago\"), but reservations store the IATA airport code. One city can be served by several airports \u2014 match a reservation when its airport serves the city the user named:"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+- **New York** \u2192 JFK, EWR (Newark), LGA (LaGuardia)"}, {"t": "add", "l": "+- **Chicago** \u2192 ORD"}, {"t": "add", "l": "+- **Houston** \u2192 IAH"}, {"t": "add", "l": "+- **Washington / DC area** and other metros \u2192 the airport(s) listed by `list_all_airports` for that city"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Users also misremember the exact airport code and the exact date. Treat the ROUTE (which cities, in which direction) as the reliable signal. If EXACTLY ONE of the user's reservations matches the described cities, that is the reservation they mean \u2014 proceed with it. Do NOT reply \"I can't find it\" or transfer just because the stored airport code (e.g. EWR) is not the literal code the user said (e.g. JFK), or because the stored date differs from the date the user guessed."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example: the user says \"my flight from New York to Chicago.\" You pull their reservations and find one with origin **EWR** and destination **ORD**. EWR (Newark) serves the New York area and ORD is Chicago, so this IS the reservation \u2014 use it, even though the user said \"JFK\" and gave a different date."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### Finding a flight the user \"took before\""}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If the user refers to a flight they previously booked or flew (\"the same flight as last time\", \"my usual flight\", \"the exact flight I took on <date>\") and does not give the flight number, find it by inspecting their EXISTING reservations (`get_user_details` \u2192 `get_reservation_details`) and reading off the flight number there. Do NOT guess it from a fresh schedule search or offer the user a menu of other flights to pick from \u2014 the flight they mean is the one recorded in their own booking."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+When updating passengers, keep the SAME number of passengers the reservation already has (the passenger count can never change); do not duplicate a passenger to pad the list, or `update_reservation_passengers` will reject the call. To rename the single passenger on a one-passenger reservation, pass a list of exactly ONE passenger \u2014 never repeat the same person twice."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Domain Basic"}, {"t": "hunk", "l": "@@ -138,23 +163,24 @@"}, {"t": "ctx", "l": " - If the user doesn't know their reservation id, the agent should help locate it using available tools."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Change flights: "}, {"t": "del", "l": "-- Basic economy restriction \u2014 this is about WHICH flight segments a reservation contains, NOT about its cabin. You may not change the flight segments of a reservation that is **currently** in basic economy. It does NOT forbid a cabin change."}, {"t": "del", "l": "-  - You MAY always change the cabin class \u2014 upgrade (basic_economy \u2192 economy/business) or downgrade (\u2192 basic_economy) \u2014 including for a reservation currently in basic economy, as long as no segment has already flown. A cabin change uses `update_reservation_flights`."}, {"t": "del", "l": "-  - To UPGRADE a basic economy reservation while keeping its itinerary: call `update_reservation_flights` with the SAME flight segments it already has and the new `cabin`. Do NOT refuse this as \"basic economy cannot be modified\" \u2014 changing cabin is allowed."}, {"t": "del", "l": "-  - Worked example: a user in basic_economy on segments HAT056 (2024-05-25) and HAT138 (2024-05-25) wants economy. Call `update_reservation_flights(reservation_id, cabin='economy', flights=[HAT056 2024-05-25, HAT138 2024-05-25], payment_id=<a gift card or credit card on file>)`."}, {"t": "add", "l": "+Change cabin (upgrade or downgrade) \u2014 USE `change_cabin`:"}, {"t": "add", "l": "+- For ANY request to change only the cabin class (upgrade basic_economy \u2192 economy/business, or downgrade \u2192 basic_economy) while keeping the same flights, call `change_cabin(reservation_id, cabin, payment_id)`. It keeps the exact existing flight segments for you and returns the EXACT charge or refund in `payment_summary`."}, {"t": "add", "l": "+- This is allowed for ALL reservations, INCLUDING ones currently in basic economy \u2014 changing cabin is NOT blocked by the basic-economy restriction. Do NOT refuse an upgrade/downgrade as \"basic economy cannot be modified.\""}, {"t": "add", "l": "+- Cabin cannot be changed if any flight in the reservation has already been flown (`change_cabin` enforces this and will tell you to transfer)."}, {"t": "add", "l": "+- If the new cabin costs more, the user pays the difference; if it costs less, the user is refunded the difference. `change_cabin` computes this \u2014 NEVER refuse or transfer because you cannot calculate the amount yourself. Read the exact number from `payment_summary` and state it to the user."}, {"t": "add", "l": "+- Worked example (upgrade): a user in basic_economy wants economy, keeping their flights, paying any fee with gift_card_123. Call `change_cabin(reservation_id, cabin='economy', payment_id='gift_card_123')`."}, {"t": "add", "l": "+- Worked example (downgrade): a user in business wants basic_economy with the difference refunded to gift_card_123. Call `change_cabin(reservation_id, cabin='basic_economy', payment_id='gift_card_123')`, then tell the user the exact refund from `payment_summary`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Change flights (replace the actual segments) \u2014 use `update_reservation_flights`:"}, {"t": "add", "l": "+- Use this ONLY when the flight segments themselves change. For a cabin-only change use `change_cabin` (above), which cannot corrupt the itinerary."}, {"t": "add", "l": "+- Basic economy restriction: you may NOT change the flight segments of a reservation that is **currently** in basic economy (this restricts segment changes only; it does NOT forbid a cabin change via `change_cabin`)."}, {"t": "ctx", "l": " - Other reservations can be modified without changing the origin, destination, and trip type."}, {"t": "del", "l": "-- Some flight segments can be kept, but their prices will not be updated based on the current price."}, {"t": "add", "l": "+- You must pass the ENTIRE new set of segments: copy every segment you are keeping EXACTLY as it appears in `get_reservation_details` (same flight_number AND date), never repeat a flight number and never invent a segment. Kept segments are not re-priced."}, {"t": "ctx", "l": " - The API does not check these for the agent, so the agent must make sure the rules apply before calling the API!"}, {"t": "del", "l": "-"}, {"t": "del", "l": "-Change cabin: "}, {"t": "del", "l": "-- Cabin cannot be changed if any flight in the reservation has already been flown."}, {"t": "del", "l": "-- In other cases, all reservations, including basic economy, can change cabin without changing the flights."}, {"t": "del", "l": "-- Cabin class must remain the same across all the flights in the same reservation; changing cabin for just one flight segment is not possible."}, {"t": "del", "l": "-- If the price after cabin change is higher than the original price, the user is required to pay for the difference."}, {"t": "del", "l": "-- If the price after cabin change is lower than the original price, the user is should be refunded the difference."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " Change baggage and insurance: "}, {"t": "ctx", "l": " - The user can add but not remove checked bags."}, {"t": "ctx", "l": " - The user cannot add insurance after initial booking."}, {"t": "add", "l": "+- To add checked bags you MUST call `update_reservation_baggages(reservation_id, total_baggages, nonfree_baggages, payment_id)` with the NEW total number of bags. This is REQUIRED even when every added bag is within the free allowance and there is NO charge \u2014 saying \"the bags are free and added\" does NOT add them; only the tool call records the new baggage count in the booking. If you skip the call, the reservation still shows the old bag count and the task fails."}, {"t": "add", "l": "+  - Worked example: a gold member in economy (3 free bags per passenger) asks to add 3 bags to a 1-passenger reservation. All 3 are free, but you STILL call `update_reservation_baggages(reservation_id, total_baggages=3, nonfree_baggages=0, payment_id=<their chosen card>)`."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " Change passengers:"}]}, {"file": "tools/tools.py", "rows": [{"t": "hunk", "l": "@@ -615,4 +615,90 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": "     @is_tool(ToolType.WRITE)"}, {"t": "add", "l": "+    def change_cabin("}, {"t": "add", "l": "+        self,"}, {"t": "add", "l": "+        reservation_id: str,"}, {"t": "add", "l": "+        cabin: CabinClass,"}, {"t": "add", "l": "+        payment_id: str,"}, {"t": "add", "l": "+    ) -> Reservation:"}, {"t": "add", "l": "+        \"\"\""}, {"t": "add", "l": "+        Change ONLY the cabin class of an existing reservation (upgrade or"}, {"t": "add", "l": "+        downgrade), keeping every existing flight segment EXACTLY as it is."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        USE THIS TOOL for every request to upgrade or downgrade a reservation's"}, {"t": "add", "l": "+        cabin (e.g. \"upgrade me to economy\", \"downgrade all passengers to basic"}, {"t": "add", "l": "+        economy\") when the flights themselves are NOT changing. It copies the"}, {"t": "add", "l": "+        reservation's CURRENT flight segments verbatim, so you never re-type or"}, {"t": "add", "l": "+        re-search the flights and cannot accidentally corrupt the itinerary. It"}, {"t": "add", "l": "+        computes and returns the EXACT fare difference \u2014 a charge if the new cabin"}, {"t": "add", "l": "+        costs more, a refund if it costs less \u2014 in the `payment_summary` field."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Do NOT use `update_reservation_flights` for a cabin-only change: that tool is"}, {"t": "add", "l": "+        for replacing the actual flight segments and it is easy to pass the wrong"}, {"t": "add", "l": "+        flights there. Do NOT refuse or transfer to a human merely because you cannot"}, {"t": "add", "l": "+        pre-calculate the charge or refund yourself \u2014 call this tool and read the"}, {"t": "add", "l": "+        exact amount from `payment_summary`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Worked example (downgrade / refund): the user wants reservation ABC123, now"}, {"t": "add", "l": "+        in business, changed to basic_economy and the fare difference refunded to"}, {"t": "add", "l": "+        gift card gift_card_123. Call"}, {"t": "add", "l": "+        `change_cabin(reservation_id=\"ABC123\", cabin=\"basic_economy\","}, {"t": "add", "l": "+        payment_id=\"gift_card_123\")`; the returned `payment_summary` states the exact"}, {"t": "add", "l": "+        refund (e.g. \"This change refunds $1900 to gift_card_123\"), which you then"}, {"t": "add", "l": "+        state to the user."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Args:"}, {"t": "add", "l": "+            reservation_id: The reservation ID, such as 'ZFA04Y'."}, {"t": "add", "l": "+            cabin: The new cabin class \u2014 exactly one of 'basic_economy', 'economy',"}, {"t": "add", "l": "+                or 'business'."}, {"t": "add", "l": "+            payment_id: A single gift card or credit card id ALREADY on the user's"}, {"t": "add", "l": "+                profile, such as 'gift_card_7815826' or 'credit_card_7815826', used"}, {"t": "add", "l": "+                to charge the fare difference or receive the refund. A travel"}, {"t": "add", "l": "+                certificate CANNOT be used to update a reservation."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Returns:"}, {"t": "add", "l": "+            The updated reservation plus a `payment_summary` stating the exact charge"}, {"t": "add", "l": "+            or refund."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Raises:"}, {"t": "add", "l": "+            ValueError: If the reservation is not found."}, {"t": "add", "l": "+            ValueError: If any segment has already departed (the cabin cannot be"}, {"t": "add", "l": "+                changed once a portion of the trip has flown)."}, {"t": "add", "l": "+            ValueError: If the payment method is not found or cannot be used."}, {"t": "add", "l": "+        \"\"\""}, {"t": "add", "l": "+        reservation = self._get_reservation(reservation_id)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        # Guard: cabin cannot change once any segment has departed (policy: \"Cabin"}, {"t": "add", "l": "+        # cannot be changed if any flight in the reservation has already been"}, {"t": "add", "l": "+        # flown\"). Statuses 'flying' and 'landed' both mean a portion has flown."}, {"t": "add", "l": "+        for f in reservation.flights:"}, {"t": "add", "l": "+            try:"}, {"t": "add", "l": "+                status = self._get_flight_instance(f.flight_number, f.date).status"}, {"t": "add", "l": "+            except Exception:"}, {"t": "add", "l": "+                continue"}, {"t": "add", "l": "+            if status in {\"flying\", \"landed\"}:"}, {"t": "add", "l": "+                raise ValueError("}, {"t": "add", "l": "+                    f\"Cannot change cabin for reservation {reservation_id}: segment \""}, {"t": "add", "l": "+                    f\"{f.flight_number} on {f.date} has status '{status}' (already \""}, {"t": "add", "l": "+                    f\"departed/flown). Per policy the cabin cannot be changed once \""}, {"t": "add", "l": "+                    f\"any portion of the trip has flown; transfer to a human agent \""}, {"t": "add", "l": "+                    f\"instead.\""}, {"t": "add", "l": "+                )"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        # Rebuild the flight list from the reservation's CURRENT segments, VERBATIM,"}, {"t": "add", "l": "+        # so the itinerary is preserved exactly and only the cabin changes. Delegate"}, {"t": "add", "l": "+        # to the existing update_reservation_flights body, which recomputes the"}, {"t": "add", "l": "+        # per-cabin prices and the signed fare difference and enriches the return."}, {"t": "add", "l": "+        current_flights = ["}, {"t": "add", "l": "+            {\"flight_number\": f.flight_number, \"date\": f.date}"}, {"t": "add", "l": "+            for f in reservation.flights"}, {"t": "add", "l": "+        ]"}, {"t": "add", "l": "+        return self.update_reservation_flights("}, {"t": "add", "l": "+            reservation_id=reservation_id,"}, {"t": "add", "l": "+            cabin=cabin,"}, {"t": "add", "l": "+            flights=current_flights,"}, {"t": "add", "l": "+            payment_id=payment_id,"}, {"t": "add", "l": "+        )"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    @is_tool(ToolType.WRITE)"}, {"t": "ctx", "l": "     def update_reservation_flights("}, {"t": "ctx", "l": "         self,"}, {"t": "hunk", "l": "@@ -623,6 +709,13 @@"}, {"t": "ctx", "l": "     ) -> Reservation:"}, {"t": "ctx", "l": "         \"\"\""}, {"t": "del", "l": "-        Update the flight information of a reservation."}, {"t": "del", "l": "-"}, {"t": "add", "l": "+        Replace the flight segments of a reservation (and/or its cabin)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        IMPORTANT: for a cabin-only change (upgrade/downgrade while keeping the same"}, {"t": "add", "l": "+        flights), call `change_cabin` instead \u2014 it preserves the existing segments"}, {"t": "add", "l": "+        automatically and cannot corrupt the itinerary. Use THIS tool only when the"}, {"t": "add", "l": "+        actual flight segments are changing. When you do, you MUST pass the ENTIRE new"}, {"t": "add", "l": "+        set of segments: copy each segment you are keeping EXACTLY as it appears in"}, {"t": "add", "l": "+        get_reservation_details (same flight_number AND date) and never repeat a"}, {"t": "add", "l": "+        flight number or invent a segment."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": "         Args:"}]}], "cand_0003": [{"file": "policy/policy.md", "rows": [{"t": "hunk", "l": "@@ -25,14 +25,14 @@"}, {"t": "ctx", "l": " 1. Gather the required details and state them back to the user (what will change, and the exact cost or refund)."}, {"t": "ctx", "l": " 2. Ask for confirmation and wait for an explicit \"yes\" \u2014 ONCE per action."}, {"t": "del", "l": "-3. The moment the user confirms, your very next step MUST be the write tool call (`book_reservation`, `update_reservation_flights`, `update_reservation_baggages`, `update_reservation_passengers`, or `cancel_reservation`). Do not re-ask, do not add another chat turn, do not end your turn with only a message. Confirmation is your signal to ACT, not to stop."}, {"t": "add", "l": "+3. The moment the user confirms, your very next step MUST be the write tool call (`book_reservation`, `modify_reservation`, or `cancel_reservation`). Do not re-ask, do not add another chat turn, do not end your turn with only a message. Confirmation is your signal to ACT, not to stop."}, {"t": "ctx", "l": " 4. Only after the write tool returns may you tell the user it is done. Never report a change as completed (e.g. \"I've updated your reservation\") unless you have actually called the write tool this turn and seen its result."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Worked example: User says \"yes, go ahead.\" \u2192 You immediately call `update_reservation_flights(...)` (no further message first) \u2192 it returns \u2192 you tell the user the result and the exact amount."}, {"t": "add", "l": "+Worked example: User says \"yes, go ahead.\" \u2192 You immediately call `modify_reservation(...)` (no further message first) \u2192 it returns \u2192 you tell the user the result and the exact amount."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Communicating amounts \u2014 state the EXACT total"}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-Whenever an action charges or refunds money, state to the user the EXACT TOTAL dollar amount, summed across ALL passengers \u2014 never the per-passenger figure by itself. Every write tool returns a `payment_summary` field containing this exact number; read it and state that number verbatim to the user."}, {"t": "del", "l": "-"}, {"t": "del", "l": "-Worked example: a fare difference of $1748 per passenger for a reservation with 3 passengers must be communicated as the total **$5244** (= 1748 \u00d7 3) \u2014 this is exactly what `payment_summary` reports. Quoting only \"$1748\" is wrong."}, {"t": "add", "l": "+Whenever an action charges or refunds money, state to the user the EXACT TOTAL dollar amount, summed across ALL passengers \u2014 never the per-passenger figure by itself. `modify_reservation` returns a `payment_summary` field and `quote_change` returns a `quote` field, each containing this exact number; read it and state that number verbatim to the user. You never need to compute the amount yourself \u2014 if you are unsure what a change will cost or refund, call `quote_change` first and it computes the exact figure. NEVER refuse a change or transfer to a human merely because you could not work out the amount."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example: a fare difference of $1748 per passenger for a reservation with 3 passengers must be communicated as the total **$5244** (= 1748 \u00d7 3) \u2014 this is exactly what `quote_change`/`payment_summary` report. Quoting only \"$1748\" is wrong."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Identifying the correct reservation"}, {"t": "hunk", "l": "@@ -44,5 +44,12 @@"}, {"t": "ctx", "l": " 3. Do NOT default to the first-listed reservation id \u2014 confirm it is the one the user means before writing to it."}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-When updating passengers, keep the SAME number of passengers the reservation already has (the passenger count can never change); do not duplicate a passenger to pad the list, or `update_reservation_passengers` will reject the call."}, {"t": "add", "l": "+Match by CITY, not just by airport code. A user names a city; a reservation stores an airport code. One city can have several airports \u2014 treat any of a city's airports as a match for that city:"}, {"t": "add", "l": "+- New York \u2192 EWR, JFK, LGA"}, {"t": "add", "l": "+- Chicago \u2192 ORD (and MDW)"}, {"t": "add", "l": "+- Washington \u2192 IAD, DCA"}, {"t": "add", "l": "+- Houston \u2192 IAH, HOU"}, {"t": "add", "l": "+If exactly ONE of the user's reservations matches the cities the user described (even when the stored airport code or date differs from what you expected), that IS the reservation \u2014 use it. Never transfer to a human, and never fall back to the first-listed reservation, while a unique city-level match exists."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+When updating passengers, keep the SAME number of passengers the reservation already has (the passenger count can never change); do not duplicate a passenger to pad the list, or `modify_reservation` will reject the call. If a passenger is listed more than once with identical details, that duplicate is removed automatically \u2014 send the real distinct passengers."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Domain Basic"}, {"t": "hunk", "l": "@@ -138,9 +145,12 @@"}, {"t": "ctx", "l": " - If the user doesn't know their reservation id, the agent should help locate it using available tools."}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+**All modifications to an existing reservation go through ONE tool: `modify_reservation`.** It changes the cabin, the flight segments, the passenger details, and/or the baggage count \u2014 any one of these or several at once. Pass only the arguments for what is changing; leave the rest null. The tool recomputes every price and paid-bag count for you, so you never compute those. If the user asks for two or more changes to the same reservation, make them in a SINGLE `modify_reservation` call."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+If you need to tell the user the cost or refund before they confirm, call the read-only `quote_change` first; it returns the exact amount without changing anything."}, {"t": "add", "l": "+"}, {"t": "ctx", "l": " Change flights: "}, {"t": "ctx", "l": " - Basic economy restriction \u2014 this is about WHICH flight segments a reservation contains, NOT about its cabin. You may not change the flight segments of a reservation that is **currently** in basic economy. It does NOT forbid a cabin change."}, {"t": "del", "l": "-  - You MAY always change the cabin class \u2014 upgrade (basic_economy \u2192 economy/business) or downgrade (\u2192 basic_economy) \u2014 including for a reservation currently in basic economy, as long as no segment has already flown. A cabin change uses `update_reservation_flights`."}, {"t": "del", "l": "-  - To UPGRADE a basic economy reservation while keeping its itinerary: call `update_reservation_flights` with the SAME flight segments it already has and the new `cabin`. Do NOT refuse this as \"basic economy cannot be modified\" \u2014 changing cabin is allowed."}, {"t": "del", "l": "-  - Worked example: a user in basic_economy on segments HAT056 (2024-05-25) and HAT138 (2024-05-25) wants economy. Call `update_reservation_flights(reservation_id, cabin='economy', flights=[HAT056 2024-05-25, HAT138 2024-05-25], payment_id=<a gift card or credit card on file>)`."}, {"t": "add", "l": "+  - You MAY always change the cabin class \u2014 upgrade (basic_economy \u2192 economy/business) or downgrade (\u2192 basic_economy) \u2014 including for a reservation currently in basic economy, as long as no segment has already flown."}, {"t": "add", "l": "+  - To change flights, pass the FULL list of segments the reservation will have (include every segment, even unchanged ones) to `modify_reservation`'s `flights` argument."}, {"t": "ctx", "l": " - Other reservations can be modified without changing the origin, destination, and trip type."}, {"t": "ctx", "l": " - Some flight segments can be kept, but their prices will not be updated based on the current price."}, {"t": "hunk", "l": "@@ -150,10 +160,12 @@"}, {"t": "ctx", "l": " - Cabin cannot be changed if any flight in the reservation has already been flown."}, {"t": "ctx", "l": " - In other cases, all reservations, including basic economy, can change cabin without changing the flights."}, {"t": "add", "l": "+- To change ONLY the cabin, pass `cabin` to `modify_reservation` and OMIT `flights` \u2014 the current segments are reused automatically, so you cannot accidentally drop, duplicate, or invent a segment. Do NOT refuse an upgrade as \"basic economy cannot be modified\" \u2014 changing cabin is allowed."}, {"t": "ctx", "l": " - Cabin class must remain the same across all the flights in the same reservation; changing cabin for just one flight segment is not possible."}, {"t": "del", "l": "-- If the price after cabin change is higher than the original price, the user is required to pay for the difference."}, {"t": "del", "l": "-- If the price after cabin change is lower than the original price, the user is should be refunded the difference."}, {"t": "add", "l": "+- If the price after cabin change is higher than the original price, the user pays the difference; if lower, the user is refunded the difference. `modify_reservation` reports the exact signed amount in `payment_summary`."}, {"t": "add", "l": "+- Worked example (cabin-only upgrade, keep itinerary): a user in basic_economy wants economy. Call `modify_reservation(reservation_id, cabin='economy', payment_id=<a gift card or credit card on file>)` \u2014 no `flights` argument needed."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " Change baggage and insurance: "}, {"t": "ctx", "l": " - The user can add but not remove checked bags."}, {"t": "add", "l": "+- Always pass the new `total_baggages` to `modify_reservation` when the user adds bags, EVEN IF the bags are free \u2014 a free allowance just means 0 paid bags, it does not mean skip the change."}, {"t": "ctx", "l": " - The user cannot add insurance after initial booking."}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -161,7 +173,10 @@"}, {"t": "ctx", "l": " - The user can modify passengers but cannot modify the number of passengers."}, {"t": "ctx", "l": " - Even a human agent cannot modify the number of passengers."}, {"t": "add", "l": "+- Pass the full new passenger list to `modify_reservation`'s `passengers` argument."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " Payment: "}, {"t": "del", "l": "-- If the flights are changed, the user needs to provide a single gift card or credit card for payment or refund method. The payment method must already be in user profile for safety reasons."}, {"t": "add", "l": "+- If the flights, cabin, or baggage are changed with a cost or refund, pass a single `payment_id` \u2014 a gift card or credit card already in the user profile. Use the EXACT payment method the user named (do not substitute a different card). The payment method must already be in user profile for safety reasons."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Worked example (several changes at once): a user wants to upgrade to economy, correct a passenger's name, and add bags to a total of 3, paying with gift card gift_card_8190333. Make ONE call: `modify_reservation(reservation_id, cabin='economy', passengers=[{first_name, last_name, dob}], total_baggages=3, payment_id='gift_card_8190333')`."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Cancel flight"}]}, {"file": "tools/tools.py", "rows": [{"t": "hunk", "l": "@@ -43,7 +43,20 @@"}, {"t": "ctx", "l": " from tau2.environment.toolkit import ToolType, is_tool"}, {"t": "ctx", "l": " "}, {"t": "del", "l": "-# Names of tools to REMOVE from the exposed agent toolset. Empty by default"}, {"t": "del", "l": "-# (the seed exposes exactly tau2's default airline tools, unchanged)."}, {"t": "del", "l": "-REMOVE_TOOLS: set[str] = set()"}, {"t": "add", "l": "+# Names of tools to REMOVE from the exposed agent toolset."}, {"t": "add", "l": "+#"}, {"t": "add", "l": "+# The three per-aspect modify primitives (flights, passengers, baggages) are"}, {"t": "add", "l": "+# HIDDEN from the agent and superseded by the single `modify_reservation`"}, {"t": "add", "l": "+# composite below. Their method bodies stay on the class (so `modify_reservation`"}, {"t": "add", "l": "+# can delegate to the already-verified logic); REMOVE_TOOLS only filters them out"}, {"t": "add", "l": "+# of the exposed toolset at the `get_tools` boundary. Consolidating three tools"}, {"t": "add", "l": "+# into one atomic write removes the failure modes a mid model hits with the split"}, {"t": "add", "l": "+# surface: skipping one of several required writes, drifting to a different"}, {"t": "add", "l": "+# reservation id between calls, re-listing/mangling the flight segments on a"}, {"t": "add", "l": "+# cabin-only change, and padding the passenger list with abin and/or"}, {"t": "add", "l": "+        flight change WITHOUT modifying anything. Read-only: it changes no"}, {"t": "add", "l": "+        reservation and no payment. Call this to tell the user the exact amount"}, {"t": "add", "l": "+        BEFORE you ask them to confirm a change, then \u2014 after they confirm \u2014 make"}, {"t": "add", "l": "+        the change with `modify_reservation`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Use this whenever you need to state what a cabin upgrade/downgrade or a"}, {"t": "add", "l": "+        flight change will cost or refund. NEVER give up on a change, and NEVER"}, {"t": "add", "l": "+        transfer to a human, merely because you cannot work out the amount in your"}, {"t": "add", "l": "+        head \u2014 this tool computes it for you."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Args:"}, {"t": "add", "l": "+            reservation_id: The reservation ID to price the change for, such as 'ZFA04Y'."}, {"t": "add", "l": "+            cabin: The NEW cabin class after the change \u2014 one of 'basic_economy',"}, {"t": "add", "l": "+                'economy', or 'business'. Omit (leave null) to keep the current cabin."}, {"t": "add", "l": "+            flights: The FULL list of flight segments the reservation will have after"}, {"t": "add", "l": "+                the change, each an object {\"flight_number\": \"HAT056\", \"date\":"}, {"t": "add", "l": "+                \"2024-05-25\"}. Omit (leave null) for a cabin-only change \u2014 the current"}, {"t": "add", "l": "+                segments are reused automatically."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Returns:"}, {"t": "add", "l": "+            A dict with `amount` (the signed total across ALL passengers: positive ="}, {"t": "add", "l": "+            the user must pay this, negative = the user is refunded its absolute"}, {"t": "add", "l": "+            value, 0 = no difference) and a human-readable `quote` string stating the"}, {"t nClass] = None,"}, {"t": "add", "l": "+        flights: Optional[List[FlightInfo | dict]] = None,"}, {"t": "add", "l": "+        passengers: Optional[List[Passenger | dict]] = None,"}, {"t": "add", "l": "+        total_baggages: Optional[int] = None,"}, {"t": "add", "l": "+        payment_id: Optional[str] = None,"}, {"t": "add", "l": "+    ) -> dict:"}, {"t": "add", "l": "+        \"\"\""}, {"t": "add", "l": "+        Apply ONE OR MORE changes to an existing reservation in a single atomic"}, {"t": "add", "l": "+        call: change the cabin, change the flight segments, replace passenger"}, {"t": "add", "l": "+        details, and/or change the number of checked bags. This is the ONLY tool"}, {"t": "add", "l": "+        for modifying an existing reservation (it replaces the separate"}, {"t": "add", "l": "+        flight/passenger/baggage update tools)."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Pass ONLY the arguments for the aspects you are changing; leave the rest"}, {"t": "add", "l": "+        null and they are untouched. The tool recomputes every price and paid-bag"}, {"t": "add", "l": "+        count from policy, so you never compute those yourself."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        WHEN TO USE: the user asks to upgrade/downgrade cabin, change flights, fix a"}, {"t": "add", "l": "+        passenger's details, or add checked bags \u2014 for one change OR for several at"}, {"t": "add", "l": "+        once. If the user asks for two or more changes to the same reservation"}, {"t": "add", "l": "+        (\"change my seat class AND add a bag\"), make them in ONE call here."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Args:"}, {"t": "add", "l": "+            reservation_id: The reservation ID to modify, such as 'ZFA04Y'. Resolve"}, {"t": "add", "l": "+                the correct reservation first (see policy) and reuse the SAME id for"}, {"t": "add", "l": "+                every change."}, {"t": "add", "l": "+            cab  cost to, or refund any decrease to. Use the EXACT payment method the"}, {"t": "add", "l": "+                user named. Required whenever a change has a non-zero cost or refund;"}, {"t": "add", "l": "+                may be omitted only when every requested change is free."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Returns:"}, {"t": "add", "l": "+            The updated reservation plus a `payment_summary` describing every change"}, {"t": "add", "l": "+            applied and the exact total charged or refunded \u2014 state those exact"}, {"t": "add", "l": "+            amounts to the user."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Raises:"}, {"t": "add", "l": "+            ValueError: If the reservation/user/payment is not found, a segment is"}, {"t": "add", "l": "+                unavailable, or the passenger count would change."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        Worked example (cabin upgrade + passenger fix + 3 bags, all at once):"}, {"t": "add", "l": "+            modify_reservation(reservation_id='FQ8APE', cabin='economy',"}, {"t": "add", "l": "+                passengers=[{'first_name':'Omar','last_name':'Rossi','dob':'1970-06-06'}],"}, {"t": "add", "l": "+                total_baggages=3, payment_id='gift_card_8190333')"}, {"t": "add", "l": "+        Worked example (cabin-only downgrade \u2014 no flights needed):"}, {"t": "add", "l": "+            modify_reservation(reservation_id='GV1N64', cabin='basic_economy',"}, {"t": "add", "l": "+                payment_id='gift_card_1642017')"}, {"t": "add", "l": "+        Worked example (add 2 bags only):"}, {"t": "add", "l": "+            modify_reservation(reservation_id='YAX4DR', total_baggages=2,"}, {"t": "add", "l": "+                payment_id='credit_card_4938634')"}, {"t": "add", "l": "+        \"\"\""}, {"t": "add", "l": "+        reservation = self._get_reservation(reservation_id)"}, {"t": "add", "l": "+        pay = payment_id if payment_id is not None else \"\""}, {"t": "add", "l": "+        summaries: list[str] = []"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        # 1. Cabin and/or flight change. For a cabin-only change (no `flights`"}, {"t": "add", "l": "+        #    given) reuse the reservation's CURRENT segments verbatim, so the model"}, {"t": "add", "l": "+        #    cannot drop or duplicate a segment."}, {"t": "add", "l": "+        if cabin is not None or flights is not None:"}, {"t": "add", "l": "+            target_cabin = cabin if cabin is not None else reservation.cabin"}, {"t": "add", "l": "+            if flights is None:"}, {"t": "add", "l": "+                seg: List[FlightInfo | dict] = ["}, {"t": "add", "l": "+                    FlightInfo(flight_number=f.flight_number, date=f.date)"}, {"t": "add", "l": "+                    for f in reservation.flights"}, {"t": "add", "l": "+                ]"}, {"t": "add", "l": "+            else:"}, {"t": "add", "l": "+                seg = flights"}, {"t": "add", "l": "+            result = self.update_reservation_flights("}, {"t": "add", "l": "+                reservation_id, target_cabin, seg, pay"}, {"t": "add", "l": "+            )"}, {"t": "add", "l": "+            summaries.append(result.get(\"payment_summary\", \"\"))"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        # 2. Passenger replacement (exact-duplicate entries are deduped inside)."}, {"t": "add", "l": "+        if passengers is not None:"}, {"t": "add", "l": "+            self.update_reservation_passengers(reservation_id, passengers)"}, {"t": "add", "l": "+            summaries.append(\"Passenger details updated.\")"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+        # 3. Baggage change. Always persisted when requested \u2014 a free allowance"}, {"t": "add", "l": "+        #    means paid-bag count 0, NOT \"skip the write\"."}, {"t": "add", "l": "+        if total_baggages is not None:"}, {"t": "add", "l": "+            result = self.update_reservation_baggages("}, {"t": "add", "l": " // A tiny, deliberately non-general markdown renderer: headings, bullet lines,
// blockquotes, bold, everything else is a paragraph. Good enough for the structured
// templates the narrative files are seeded from (_JOURNAL_SEED etc.) and for a
// PROJECT.md — not a general markdown engine, so it never needs a dependency. Shared
// by the Process narrative and Config tabs so there is exactly one renderer.
function mdToHtml(text){
  const lines=escN(text).split('\n');
  let html='',inList=false;
  const closeList=()=>{if(inList){html+='</ul>';inList=false;}};
  lines.forEach(line=>{
    const bold=line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    let m;
    if((m=bold.match(/^(#{1,4})\s+(.*)$/))){closeList();
      html+=`<h${Math.min(4,m[1].length)+1}>${m[2]}</h${Math.min(4,m[1].length)+1}>`;}
    else if(/^\s*[-*]\s+/.test(bold)){if(!inList){html+='<ul>';inList=true;}
      html+='<li>'+bold.replace(/^\s*[-*]\s+/,'')+'</li>';}
    else if(/^>\s?/.test(bold)){closeList();
      html+='<blockquote>'+bold.replace(/^>\s?/,'')+'</blockquote>';}
    else if(/^<!--/.test(bold.trim())){/* skip HTML-comment markers */}
    else if(!bold.trim()){closeList();}
    else{closeList();html+='<p>'+bold+'</p>';}
  });
  closeList();
  return html;
}

/* ---------- 2. Cumulative-best stair over per-iteration scatter ---------- */
(function(){
  const pts=G.nodes.filter(n=>n.iteration!=null&&n.best_so_far!=null)
    .sort((a,b)=>a.iteration-b.iteration);
  if(pts.length<2)return;
  const s=sec('Score over iterations — cumulative best');
  const W=1080,H=300,m={l:46,r:16,t:16,b:30};
  const xs=pts.map(p=>p.iteration), allv=pts.flatMap(p=>[p.best_so_far,p.val].filter(v=>v!=null));
  const xmin=Math.min(...xs),xmax=Math.max(...xs)||1,vmin=Math.min(...allv,0),vmax=Math.max(...allv,1);
  const X=i=>m.l+(i-xmin)/((xmax-xmin)||1)*(W-m.l-m.r);
  const Y=v=>H-m.b-(v-vmin)/((vmax-vmin)||1)*(H-m.t-m.b);
  const el=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H});
  for(let g2=0;g2<=4;g2++){const v=vmin+(vmax-vmin)*g2/4;
    el.append(svg('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)','stroke-width':1}));
    txt(el,{x:6,y:Y(v)+4,fill:'var(--muted)','font-size':10},v.toFixed(2));}
  // stair polyline of running best
  let d='';let prevY=null;
  pts.forEach((p,i)=>{const x=X(p.iteration),y=Y(p.best_so_far);
    if(i===0)d=`M${x},${y}`;else d+=` L${x},${prevY} L${x},${y}`;prevY=y;});
  el.append(svg('path',{d,fill:'none',stroke:'var(--ok)','stroke-width':2}));
  // record-holder rings + per-iter scatter
  let rec=-1;
  pts.forEach(p=>{
    if(p.val!=null){const col=p.status==='accepted'?'var(--ok)':p.status==='failed'?'var(--bad)':'var(--warn)';
      const c=svg('circle',{cx:X(p.iteration),cy:Y(p.val),r:4,fill:col,'fill-opacity':.85,stroke:'var(--bg)'});
      const dpar=p.parent_val!=null?(p.val-p.parent_val).toFixed(3):'—';
      c.addEventListener('mousemove',e=>showTip(e,`${p.id}\n${p.status}  val=${fmt(p.val)}\nΔ parent=${dpar}\niter ${p.iteration}`));
      c.addEventListener('mouseleave',hideTip);el.append(c);}
    if(p.best_so_far>rec){rec=p.best_so_far;
      el.append(svg('circle',{cx:X(p.iteration),cy:Y(p.best_so_far),r:7,fill:'none',stroke:'var(--accent)','stroke-width':1.5}));}
  });
  // champion star + label
  const champ=pts.reduce((a,b)=>(b.best_so_far>=a.best_so_far?b:a),pts[0]);
  const cx=X(champ.iteration),cy=Y(champ.best_so_far);
  el.append(svg('path',{d:starPath(cx,cy-12,7,3),fill:'var(--champion)',stroke:'var(--bg)'}));
  // The champion is usually the RIGHTMOST point, where a left-anchored label runs off the plot
  // and gets clipped by the viewBox. Flip the anchor to the left of the star when there is not
  // room to its right.
  const tight=cx>W-m.r-46;
  txt(el,{x:tight?cx-10:cx+10,y:cy-8,fill:'var(--text)','font-size':12,
          'text-anchor':tight?'end':'start'},fmt(champ.best_so_far));
  s.append(el);
  s.append($('div',{class:'legend',html:
    '<span><i style="background:var(--ok)"></i>running best / accept</span>'+
    '<span><i style="background:var(--warn)"></i>rejected</span>'+
    '<span><i style="background:var(--bad)"></i>failed</span>'+
    '<span><i style="background:var(--accent);border-radius:50%"></i>record-holder ring</span>'}));
  function starPath(cx,cy,R,r){let p='';for(let i=0;i<10;i++){const ang=Math.PI/5*i-Math.PI/2;
    const rad=i%2?r:R;p+=(i?'L':'M')+(cx+rad*Math.cos(ang))+','+(cy+rad*Math.sin(ang));}return p+'Z';}
})();
