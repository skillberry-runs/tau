<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>cap-evolve · run dashboard</title>
<style>
:root{--bg:#08090e;--card:#0e1017;--card2:#161923;--card3:#1e222e;--line:#232936;--text:#e9edf5;
--muted:#949cad;--muted2:#b6bdcb;--accent:#7c5cff;--champion:#f0b429;--ok:#35c88a;--bad:#f2565a;
--warn:#f0b429;--idk:#4aa8ff;--fail:#c05fd8;--radius:12px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:rgba(14,16,23,.9);backdrop-filter:blur(8px);
border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:baseline;gap:16px}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:-.02em}
header .meta{color:var(--muted);font-size:12px}
main{max-width:1180px;margin:0 auto;padding:26px;display:flex;flex-direction:column;gap:26px}
section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
section h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 14px}
/* The page header is position:sticky, so jumping to an anchor scrolled the target heading
   underneath it. scroll-margin-top parks the landing point below the header instead. */
section,section h2,section h3{scroll-margin-top:74px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:23px;font-weight:700;margin-top:4px}
.kpi .v.ok{color:var(--ok)} .kpi .v.bad{color:var(--bad)} .kpi .v.acc{color:var(--accent)} .kpi .v.champ{color:var(--champion)}
header .logo{flex:none}
header .tag{color:var(--muted);font-size:12px;margin-left:auto}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.phase .nm{font-weight:600} .phase .st{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.phase.done{border-color:#1f3a23} .phase.done .st{color:var(--ok)}
.phase.active{border-color:var(--accent)} .phase.active .st{color:var(--accent)}
.phase.pending .st{color:var(--muted)}
.phase .d{color:var(--muted);font-size:11px;margin-top:4px}
.dead{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0}
.dead .x{color:var(--bad);font-size:11px;float:right}
.kpi .s{color:var(--muted);font-size:11px;margin-top:2px}
svg{display:block;max-width:100%}
.legend{color:var(--muted);font-size:12px;margin-top:8px;display:flex;gap:16px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#000d;border:1px solid var(--line);
border-radius:8px;padding:7px 10px;font-size:12px;z-index:50;display:none;max-width:320px;white-space:pre-line}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
td.r,th.r{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.b-accepted{background:#1f3a23;color:var(--ok)} .b-rejected{background:#3a2f12;color:var(--warn)}
.b-failed{background:#31173a;color:var(--fail)} .b-seed{background:#22262f;color:var(--muted2)}
.b-indecisive{background:#152a3f;color:var(--idk)}
.b-bypass{background:#2a1f3a;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);
border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.banner{display:flex;gap:10px;border:1px solid var(--line);border-left:3px solid var(--warn);
background:var(--card2);border-radius:0 10px 10px 0;padding:10px 14px;font-size:12.5px;line-height:1.6;color:var(--muted2)}
.banner.info{border-left-color:var(--accent)} .banner.bad{border-left-color:var(--bad)}
input[type=search],input[type=text]{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:6px 10px;font:inherit}
.logrow{display:grid;grid-template-columns:64px 74px 130px 1fr;gap:8px;align-items:baseline;
padding:3px 6px;border-radius:6px;font-size:12px;cursor:pointer}
.logrow:hover{background:var(--card2)} .logrow .k{font-family:ui-monospace,Menlo,monospace;font-weight:600}
.logdet{background:var(--card2);border:1px solid var(--line);border-radius:8px;margin:2px 0 8px 70px;
padding:8px 10px;font:12px/1.55 ui-monospace,Menlo,monospace;color:var(--muted2);white-space:pre-wrap;overflow:auto;max-height:320px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bar{height:5px;border-radius:5px;background:var(--card3);overflow:hidden;max-width:360px}
.bar>i{display:block;height:100%;border-radius:5px}
.hide{display:none!important}
.row{display:flex;gap:18px;flex-wrap:wrap}
.col{flex:1;min-width:280px}
select,button{background:var(--card2);color:var(--text);border:1px solid var(--line);
border-radius:8px;padding:5px 9px;font:inherit;cursor:pointer}
.diff{font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0e13;border:1px solid var(--line);
border-radius:8px;padding:10px;overflow:auto;max-height:420px;white-space:pre}
.diff .add{color:var(--ok)} .diff .del{color:var(--bad)} .diff .hunk{color:var(--accent)} .diff .ctx{color:var(--muted)}
.diff .file{color:var(--text);font-weight:700;margin:8px 0 2px}
.ann{border-left:3px solid var(--warn);padding:6px 12px;margin:8px 0;background:var(--card2);border-radius:0 8px 8px 0}
.ann.diag{border-left-color:var(--accent)}
.narrative-box{background:var(--card2);border:1px solid var(--line);border-radius:8px;
padding:12px 14px;overflow:auto;max-height:480px}
.md h2,.md h3,.md h4{margin:14px 0 6px;color:var(--text)}
.md h2:first-child,.md h3:first-child,.md h4:first-child{margin-top:0}
.md p{margin:6px 0}
.md ul{margin:6px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:4px 10px;border-left:3px solid var(--accent);
background:var(--card);color:var(--muted)}
.ann .who{color:var(--muted);font-size:11px}
.heat rect{cursor:pointer} .heat text{fill:var(--muted);font-size:10px}
code{background:var(--card2);padding:1px 5px;border-radius:5px;font-size:12px}
.muted{color:var(--muted)}

re the SAME scenario (omar_rossi_1241 / FQ8APE / passenger\u2192Omar + cabin\u2192economy + 3 bags). The ONLY difference: 17's failing trials wrote the passenger dob as 1960-12-01 (the replaced passenger Ivan's dob) while 22 wrote 1970-06-06 (Omar's profile dob). This pinned the root cause to the \"reuse the dob\" heuristic being wrong when the passenger is replaced by a DIFFERENT person, and gave a built-in regression check (any fix must stay a no-op on 22). Look for such paired tasks before theorizing.", "template_only": false}, {"name": "META_INSIGHTS.md", "title": "Meta-insights \u2014 the optimization process", "text": "# META-INSIGHTS \u2014 about the optimization PROCESS itself (this run)\n\nNot about the capability \u2014 about HOW this run is searching for it: which strategies/edit classes/algorithms are helping vs stalling, and what to try next iteration. Update at the end of the run at minimum; sooner if a plateau or a clear strategy shift is worth recording now. Structure each addition as:\n\n    ## Iteration <id> (or 'run so far')\n    - Strategy tried, and whether it moved val (cite LEDGER rows):\n    - Plateau/stall signal, if any, and the lever switched to:\n    - What to try next iteration:\n\n## Iteration cand_0001 (empty-seed init, fresh run)\n- Strategy tried: ship a BROAD batch of independently-verified code guards (payment normalize+reconcile+history-resync, baggage recompute) each reproducing the gold DB on its failing task, PLUS DB-safe enriched returns + policy prose for COMMUNICATE/targeting/upgrades. Rationale: on a fresh seed with 6 always-fail + 4 flaky, the highest-EV play is several high-confidence code wins (tasks 8/25/12 verified gold-exact, 11 COMMUNICATE fed) that each generalize across a class, rather than one big structural change. LEDGER row pending (no RESULT yet).\n- Lever discipline from cross-run memory: avoided the two known rejects \u2014 heavy dict-return enrichment (rejected within noise) and additive modify tools that leave the corruptible primitive exposed. Kept returns to a single field and left the modify-removal lever as the reserve for iteration 2.\n- Plateau/stall signal: n/a yet.\n- What to try next iteration: if 17/22/37 remain, switch lever to REMOVE_TOOLS + single mandatory `modify_reservation` + read-only `quote_change` (memory-verified gold for 11/12/17/22/37). Also pull task 37's gold end-state from the live run-dir rollouts to understand its reward-0-despite-correct-write.\n\n## Iteration cand_0002 (parent = seed; cand_0001 rejected within noise)\n- Strategy tried: treat cand_0001's reject (broke={} fixed={}, \u0394=+0.017 < 2\u00b7SE) as the framework literally framed it \u2014 \"POWER or SIZE, not a redesign.\" So KEEP every proven no-regression code lever from cand_0001 verbatim and ADD power on two axes: (a) move the two behavioral clusters prose wasn't binding (over-cancellation, duplicate passengers) into DETERMINISTIC code guards; (b) replace terse policy prose with 6 numbered rules each carrying a worked example, plus the required softness clause. Net: more levers + more explicit prose, same safe core. LEDGER row pending.\n- Plateau/stall signal: a single reject, within noise \u2014 not yet a true plateau, but the \"safe-but-sub-threshold\" signature is the cue to increase effect size, which this iteration does. Did NOT redesign the winners.\n- What to try next iteration: if the new cancel guard + dedup + explicit R1\u2013R6 still leave 17/22/37/40 failing, STOP incrementing prose and switch to the reserve STRUCTURAL lever \u2014 REMOVE_TOOLS={update_reservation_flights,passengers,baggages} + one mandatory `modify_reservation` (cabin-only omits flights \u21d2 segments reused verbatim) + read-only `quote_change` (memory-verified gold-exact for 11/12/17/22/37). Also pull task 37's gold end-state from the live run-dir rollouts before guessing again. This is the last of 3 iterations' budget, so if that lever is needed it must ship fully formed, not half.\n\n## Iteration cand_0003 (parent = cand_0002, the accepted champion; LAST of 3)\n- Strategy tried: KEEP every cand_0002 lever (it fixed 22/25, broke nothing) and DIVERSIFY \u2014 one code guard + five prompt decision/knowledge rules + the structural \"no-stall\" execution rule \u2014 to attack SIX distinct clusters at once instead of deepening one. Rationale: cand_0002's accept shows the \"keep winners + add power\" play works, and the remaining failures have DIFFERENT root causes (stall, partial-transfer, cabin-vs-rebook, dob, fallback-trigger, missing-cancel), so the highest-EV move is broad coverage with each edit scoped to a general condition and checked against a pass/fail trial pair.\n- Key process win: diagnosed from the ACTUAL trials, and used same-scenario pass/fail pairs (17 vs 22; 11 t0/t1 vs t2; 37 t0 vs t1/t2; 40 all-fail) as built-in regression checks \u2014 every edit is a no-op on the passing side of its pair. This is more reliable than reasoning about leverage from the summary alone.\n- Biggest unlock vs prior iterations: both cand_0001 and cand_0002 left the STALL cluster to prose only (\"confirm then execute\") and it stayed at hard-zero. Reading task 40's trials showed the real mechanism is the ###STOP### turn-race, which prose reminders cannot fix \u2014 the lever had to be a behavioral rule to EXECUTE on an explicit request (R7), not another reminder. Lesson: when a cluster is a hard zero across all trials, suspect a mechanics trap, not a knowledge gap.\n- Plateau/stall signal: none (champion just moved +0.317). If cand_0003 is accepted, the frontier is the two genuinely-hard tasks (12 ambiguous retraction, 23 multi-booking workflow); if rejected, re-check whether R7 over-broadened (agent executing before gathering a required field) and tighten R7's \"every required detail\" precondition rather than dropping it.\n- What to try next (no budget left this run): pull the gold end-states for 12 and 23 from the live run-dir rollouts; those two need ground-truth, not more guessing.", "template_only": false}, {"name": "FRAMEWORK_IMPROVEMENTS.md", "title": "Framework improvements \u2014 for cap-evolve itself", "text": "# FRAMEWORK-IMPROVEMENTS \u2014 suggestions for cap-evolve itself (cross-run)\n\nNOT about this capability or this run's result \u2014 about what cap-evolve the FRAMEWORK should change so FUTURE runs (any capability, any project) go better: a confusing prompt section, a missing tool, a file you wished existed, a gate that felt wrong. Optional most iterations; add an entry whenever something about the framework itself (not the task) got in your way or surprised you.\n\n## Surface the GOLD final DB state (or gold action args) in the trajectory bundle\n- Several clusters (task 12's \"leave everything unchanged\" vs gold-still-writes-bags; task 23's exact 3-booking + cancel shape) could not be resolved confidently because the trajectories only show the AGENT's actions + a diff-style \"DB does not match\" message, never the gold end-state. The action-trace \"gold performs this Nx\" hints help but are diagnostic-only and incomplete. A per-task `gold_db_delta` (or the gold action list with args) in `./trajectories/` would let the optimizer write a correct general rule instead of inferring from near-miss pass/fail pairs. This is the single biggest missing signal.\n\n## The tau2 runtime is not importable in the working dir (missing deps, e.g. loguru)\n- Code edits to `tools.py` cannot be executed against the real FlightDB here (import fails on `loguru`), so guards can only be unit-logic-tested in isolation. A minimal importable stub of the tau2 data models + a tiny fixture DB in the working dir would let optimizers actually RUN a new guard on the failing trace's args, as the CHECK step asks for, instead of reading it through.", "template_only": false}, {"name": "PROCESS.md", "title": "Process \u2014 best candidate (cand_0003)", "text": "# PROCESS \u2014 cand_0003 (iteration 3/3)\n\nParent champion: cand_0002 (val 0.533). I KEEP every cand_0002 lever verbatim (they\nbroke nothing and fixed 22/25) and ADD new, zero-/low-regression fixes for the clusters\ncand_0002 left unresolved (12, 17, 23, 37, 40 + flaky 8, 11). Diagnosed THIS iteration's\n`./trajectories/` directly (30 trials). No subagents \u2014 single-pass diagnosis was enough.\n\n## Ranked clusters (leverage = failing tasks \u00d7 trials \u00d7 recoverable score)\n\n| rank | cluster | tasks | type | lever |\n|---|---|---|---|---|\n| 1 | STALL: described-but-never-executed write (agent asks \"reply yes\", user says \"yes###STOP###\", episode ends before the write) | 40 (3/3), contributes 12, 37-t0 | BEHAVIORAL/DECISION | prompt R7 + base-confirm reconcile |\n| 2 | Partial-transfer: bundles feasible+infeasible requests, transfers wholesale, skips the writes it COULD do | 37-t0 (1/3) | DECISION | prompt R8 |\n| 3 | Cabin change done as cancel+NEW booking instead of in-place update; \"basic economy flights can't be modified\" over-applied to cabin | 11-t2 (1/3) | KNOWLEDGE/DECISION | prompt R4 strengthen |\n| 4 | Wrong dob when the passenger becomes a DIFFERENT person (account holder): reused the replaced passenger's dob | 17 (2/3) | KNOWLEDGE + CODE | tools guard + prompt R2 split (a)/(b) |\n| 5 | Conditional fallback fired on the wrong trigger (dropped 2nd passenger on no-seats, though fallback was gated on price>$500) | 8-t0 (1/3) | DECISION | prompt R9 |\n| 6 | Replace-with-new-bookings but original NOT cancelled (both old + new left in DB) | 23 (3/3, complex) | BEHAVIORAL | prompt R10 |\n\n## Edits kept (each REAL \u2014 cited trace \u2014 and GENERAL \u2014 class rule, no task literal)\n\n- **E1 (code, tools.py `update_reservation_passengers`)** \u2014 in-body guard: if a passenger's\n  (first,last) name == the account holder's and the dob differs, snap dob to the profile\n  dob. CHECK: ran the snippet on task-17 args \u2192 `Omar Rossi 1960-12-01` \u2192 `1970-06-06`;\n  no-op on task-22 args (already `1970-06-06`); other passengers untouched. Class:\n  account-holder-becomes-passenger with a stale dob. Touches 17 (and robustifies 22).\n- **E2 (prompt R2 split a/b)** \u2014 distinguish name-typo-of-same-person (reuse dob) from\n  replacing with a DIFFERENT person incl. the account holder (use the new person's OWN\n  dob). Worked examples for both. Class: any passenger-replacement. Touches 17; 22 already\n  complies. CHECK: read against 17 fail trials (used 1960-12-01) vs 22 pass (1970-06-06).\n- **E3 (prompt R7 + base-confirm reconcile)** \u2014 once the change is fully specified and the\n  user has stated it, go straight to the write; don't spend a turn on a bare \"reply yes\"\n  that the user's ###STOP### will cut off before execution; softness clause ties it to the\n  graded outcome. Class: every single, clearly-stated DB change. Touches 40 (all trials\n  stall identically), helps 12/37. CHECK: 40 t0/t1/t2 all end at \"yes###STOP###\" with no\n  write; passing 11-t0/19/22 already execute right after an explicit go-ahead (so no\n  regression \u2014 the write is unchanged, only the dead confirm turn is removed).\n- **E4 (prompt R8)** \u2014 do every feasible request before transferring; transfer only the\n  infeasible part. Class: multi-request tasks mixing feasible + transfer-only items.\n  Touches 37 (t0 transferred wholesale, skipped the M20IZO upgrade that t1/t2 did \u2192 pass).\n- **E5 (prompt R4 strengthen)** \u2014 a cabin change is ALWAYS in-place `update_reservation_flights`\n  on the same id; NEVER cancel+rebook/new-booking; \"basic economy flights can't be modified\"\n  governs FLIGHTS not CABIN. Class: all cabin changes incl. basic economy. Touches 11 (t2\n  booked a new reservation \u2192 fail; t0/t1 updated in place \u2192 pass).\n- **E6 (prompt R9)** \u2014 fire a user's conditional fallback only when its stated condition\n  holds; otherwise solve the real obstacle toward the primary goal. Class: request+gated-fallback.\n  Touches 8 (t0 dropped passenger on no-seats though fallback was price-gated; t1/t2 kept both \u2192 pass).\n- **E7 (prompt R10)** \u2014 when replacing a reservation with new booking(s), cancel the original.\n  Class: rebook-to-replace (e.g. multi-certificate split). Touches 23 (gold = cancel + book\u00d73;\n  all trials booked but never cancelled). Lower confidence \u2014 23 is complex; this removes one\n  clear root cause (the missing cancel) but other steps may still miss.\n\n## Verify-the-fix\n- E1 unit-logic tested (tau2 runtime not importable here \u2014 missing `loguru`; per guidance\n  did not install). Guard is try/except-wrapped, cannot raise, no-op on correct input.\n- Prompt edits read against the exact fail-vs-pass trial pairs cited above; each states a\n  general condition, carries a worked example for the mid (gpt-oss-120b) reader, and keeps a\n  softness clause so the reward-maximizing agent may deviate when literal compliance would\n  cost the graded outcome.\n\n## Preserve (must NOT regress): 19, 22, 25\n- 19 (insurance cancel), 22 (same scenario as 17 but already-correct dob), 25 (split-payment\n  booking). All execute their writes right after an explicit user go-ahead; R7 only removes a\n  dead confirm turn, never changes a write. R2(b)/E1 are no-ops when the dob is already right\n  (verified on 22). None of R4/R8/R9/R10 changes these tasks' trajectories.\n\n## Deliberately skipped\n- Task 12 (bags not added after the user said \"please leave everything unchanged\"): genuinely\n  ambiguous \u2014 the user appears to retract, yet gold still writes the bag count. A general\n  \"do it anyway\" rule risks firing when a user truly wants nothing changed. Not worth the\n  regression risk; R7/R9 nudge toward completing un-retracted requests without hard-coding it.\n- New composite `change_cabin` / additive modify tool: JOURNAL records it REFUTED in a prior\n  run (model kept the corruptible primitive path); removing the primitives is unsafe because\n  flight-changing tasks (23 rebook, 37 upgrade) legitimately need `update_reservation_flights`.\n  So cluster 3 is fixed in prose (R4), not by a new tool.", "template_only": false}]}, "config": {"project_dir": "/home/skillberry/.cache/capevolve-gh-runner/_work/cap-evolve/cap-evolve/ci/benchmarks/.work/suite_smoke_tau2_proj/.capevolve/project", "spec_missing": false, "spec_groups": [{"group": "Capability", "items": [{"key": "capabilities", "value": ["system-prompt", "tools"]}, {"key": "capability_path", "value": "seed_capability"}]}, {"group": "Delivery", "items": [{"key": "intervention", "value": "direct"}]}, {"group": "Algorithm & optimizer", "items": [{"key": "optimizer_skill", "value": "claude-code"}, {"key": "optimizer_model", "value": "claude-opus-4-8"}, {"key": "target_model", "value": "aws/gpt-oss-120b"}, {"key": "optimizer_max_turns", "value": 80}, {"key": "optimizer_usd_per_iter", "value": 50}, {"key": "optimizer_instructions_file", "value": ""}, {"key": "algorithm_skill", "value": "hill-climb"}]}, {"group": "Data & splits", "items": [{"key": "dataset_source", "value": "adapter"}, {"key": "split_ids_file", "value": "inputs/split_ids.json"}, {"key": "split_seed", "value": 44}, {"key": "num_trials", "value": 3}]}, {"group": "Budget & gate", "items": [{"key": "gate_mode", "value": "paired"}, {"key": "gate_k_se", "value": 0.2}, {"key": "max_iterations", "value": 3}, {"key": "stall", "value": 3}]}, {"group": "Other", "items": [{"key": "algorithm_focus", "value": "all"}, {"key": "store", "value": "git"}]}], "project_md": null, "files": [{"path": "adapters/adapter.py", "size": 67733, "preview": "\"\"\"tau2-bench adapter template \u2014 optimize the airline agent's POLICY + TOOLS.\n\nReady-to-use cap-evolve adapter for tau2-bench (https://github.com/sierra-research/tau2-bench).\nSupports ANY litellm-compatible provider \u2014 configure via env vars (see model_config.py).\n\nSETUP:\n  1. Clone & install tau2-bench:\n       git clone https://github.com/sierra-research/tau2-bench ../tau2-bench\n       pip install -e ../tau2-bench\n\n  2. Copy this directory to .capevolve/project/adapters/\n\n  3. Set env vars (in .env or shell):\n       MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb       # OpenAI\n       MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb  # Anthropic\n       MODEL=vertex_ai/claude-sonnet-4-6              # Vertex AI (ADC, no key)\n       MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434  # local\n       MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000  LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n  4. Run: cap-evolve check && cap-evolve run\n\nWHAT THIS OPTIMIZES:\n  - The airline domain's system-prompt policy (policy/policy.md)\n  - Optionally the tool implementations (tools/tools.py)\n  - Optionally the agent harness (harness.json + memory/lessons.jsonl), when the candidate\n    has a harness.json \u2014 see \"agent-harness capability\" below. Without that file the run is\n    byte-for-byte the plain tau2 ``llm_agent``.\n\nHOW IT WORKS:\n  - tasks()      \u2192 all 50 airline tasks from tau2 (stable, no network).\n  - run_batch()  \u2192 tau2's own batch runner (run_tasks) with your model.\n  - score()      \u2192 tau2's own reward in [0,1] with gold-safe feedback.\n  - apply()      \u2192 overrides the registry's airline env constructor.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport functools\nimport importlib.util\nimport json\nimport os\nimport threading\nimport uuid\nimport re\nimport sys\nimport time\nfrom pathlib import Path\n\nsys.path.insert(0, str(Path(__file__).resolve().parent))\n\nfrom cap_evolve import CapabilityAdapter, Rollout, Score, Task\n\nimport model_config\n\nDOMAIN = \"airline\"\n\n# docs/TAU2_SUMMARY.md row 7: the tau2-bench user simulator sometimes emits ``###STOP###``\n# in the SAME message as reasoning that explicitly plans to continue (\"we must wait for\n# agent's third message. Continue.\"), in 15/27 observed task-7 failures \u2014 ~4.2% of all\n# rollouts lost to a simulator artifact that measures nothing about agent skill. tau2-bench\n# is an external package (cloned at setup time, not vendored here), so the fix lives on our\n# side of the boundary: detect the leak from the message trace and mark the rollout as\n# infra noise, matching the existing ``rollout.error`` path below rather than scoring the\n# agent down for a bug that is not the agent's.\n_STOP_LEAK_RE = re.compile(\n    r\"###\\s*stop\\s*###.{0,400}\\b(?:continue|continuing|wait\\s+for|must\\s+wait|\"\n    r\"keep\\s+(?:going|talking)|not\\s+(?:done|finished)\\s+yet)\\b\"\n    r\"|\\b(?:continue|continuing|wait\\s+for|must\\s+wait|\"\n    r\"keep\\s+(?:going|talking)|not\\s+(?:done|finished)\\s+yet)\\b.{0,400}###\\s*stop\\s*###\",\n    re.I | re.S,\n)\n\n\n#: Markers that tie an error to something the CANDIDATE owns (its edited ``tools.py`` / tool schema /\n#: ``policy.md`` template), as opposed to the serving path. Matched against the error text tau2 records.\n_CANDIDATE_FAULT_RE = re.compile(\n    r\"tools\\.py|tool[_ ]definition|tool[_ ]schema|invalid\\s+tool|unknown\\s+tool|\"\n    r\"ValidationError|policy\\.md|failed to render|template\", re.IGNORECASE)\n\n\ndef classify_error_kind(termination: str, evidence: str = \"\") -> str:\n    \"\"\"``\"candidate\"`` | ``\"infra\"`` for an errored tau2 simulation (the ``error_kind`` hook).\n\n    The harness scores a ``candidate`` error as a measured failure (0.0) under ``errored_trial_policy:\n    fail`` and keeps ``infra`` errors as missing data, so an edit that breaks its own tools cannot hide\n    behind dropped trials. Only ``UNEXPECTED_ERROR`` whose recorded text points at candidate-owned\n    files is attributed to the candidate; timeouts, ``INFRASTRUCTURE_ERROR`` and the user-simulator\n    leak stay infra.\" \u2026[+63638 chars truncated]", "truncated": true, "binary": false}, {"path": "adapters/model_config.py", "size": 9480, "preview": "\"\"\"Reusable model-wiring helper for any litellm-supported provider.\n\nDrop this file next to your adapter and import it::\n\n    import model_config\n    MODEL      = model_config.MODEL          # litellm model string\n    llm_kwargs = model_config.llm_kwargs()    # api_base, api_key, temperature, \u2026\n\nAll configuration is via environment variables (or a repo-root ``.env`` file).\nSet **MODEL** (required) and, depending on the provider, the matching credential\nvars. Switching providers is a one-line ``MODEL=`` change \u2014 no adapter edits.\n\n    # OpenAI\n    MODEL=gpt-4.1-mini  OPENAI_API_KEY=\u00abredacted\u00bb\n\n    # Anthropic\n    MODEL=anthropic/claude-sonnet-4-6  ANTHROPIC_API_KEY=\u00abredacted\u00bb\n\n    # Google Vertex AI (uses ADC \u2014 no key needed if `gcloud auth` is set up)\n    MODEL=vertex_ai/claude-sonnet-4-6\n\n    # Azure OpenAI\n    MODEL=azure/gpt-4o  AZURE_API_KEY=\u00abredacted\u00bb  AZURE_API_BASE=https://\u2026.openai.azure.com\n\n    # Ollama (local, free)\n    MODEL=ollama/qwen2.5:7b-instruct  API_BASE=http://localhost:11434\n\n    # LiteLLM Proxy \u2014 any model served behind a litellm proxy / gateway\n    MODEL=litellm_proxy/my-model  LITELLM_PROXY_API_BASE=http://proxy:4000\n    LITELLM_PROXY_API_KEY=\u00abredacted\u00bb\n\n    # Any other OpenAI-compatible endpoint\n    MODEL=openai/my-model  OPENAI_API_KEY=\u00abredacted\u00bb  OPENAI_API_BASE=http://my-endpoint/v1\n\nFor a provider not listed above, set the generic ``API_BASE`` / ``API_KEY`` vars\n(or the provider's own litellm vars) \u2014 litellm routes on the ``MODEL`` prefix.\n\nThe helper is LAZY \u2014 it does NO network at import time so ``cap-evolve check``\nstays offline. The first call to ``llm_kwargs()`` resolves credentials.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport os\nimport sys\nfrom pathlib import Path\nfrom typing import Any\n\n\ndef _load_env() -> None:\n    \"\"\"Load the repo-root .env into os.environ (walk parents), without overwrite.\"\"\"\n    here = Path(__file__).resolve()\n    for parent in [here.parent, *here.parents]:\n        env = parent / \".env\"\n        if env.exists():\n            try:\n                for raw in env.read_text(encoding=\"utf-8\").splitlines():\n                    line = raw.strip()\n                    if not line or line.startswith(\"#\") or \"=\" not in line:\n                        continue\n                    key, _, val = line.partition(\"=\")\n                    key = \u00abredacted\u00bb\n                    val = val.strip().strip('\"').strip(\"'\")\n                    if key:\n                        \u00abredacted\u00bb val)\n            except Exception as exc:  # non-fatal: env vars may already be set\n                print(f\"model_config: could not read {env}: {exc}\", file=sys.stderr)\n            break\n\n\ndef _env(name: str, default: str = \"\") -> str:\n    \"\"\"Get an env var after loading .env.\"\"\"\n    _load_env()\n    return os.environ.get(name, default)\n\n\n# ---- public API ---------------------------------------------------------\n\nMODEL: str = _env(\"MODEL\", \"gpt-4.1-mini\")\n\"\"\"The litellm model string \u2014 set via the ``MODEL`` env var.\"\"\"\n\n\n# Model families that PIN temperature to their own default and reject any override \u2014 even\n# the value they claim to support. The gateway answers HTTP 400:\n#\n#   Unsupported value: 'temperature' does not support 0.0 with this model.\n#   Only the default (1) value is supported.\n#\n# That fails EVERY rollout of a run, at $0.00 spend and in a few minutes, which reads exactly\n# like a capability of 0.000 rather than a misconfiguration (run 30682720920 lost a whole\n# pilot to it). Sending no override at all is safer than sending the value the error names,\n# because a deployment may reject the parameter outright; the effective temperature is then\n# the model's default, which for gpt-5.x IS 1.\n#\n# Matched against the last path segment of the resolved model id, so `azure/gpt-5.5`,\n# `litellm_proxy/azure/gpt-5.6-luna` and `azure/gpt-5.3-codex` are all covered.\n_TEMPERATURE_PINNED = (\"gpt-5\",)\n\n\ndef _temperature() -> float | None:\n    \"\"\"Resolve TEMPERATURE, or None meaning \"send no override, use the model's default\".\n\n    A bla \u2026[+5438 chars truncated]", "truncated": true, "binary": false}, {"path": "inputs/split_ids.json", "size": 208, "preview": "{\"train\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"], \"val\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"], \"test\": [\"17\", \"40\", \"12\", \"8\", \"37\", \"23\", \"25\", \"22\", \"19\", \"11\"]}\n", "truncated": false, "binary": false}, {"path": "seed_capability/policy/policy.md", "size": 7676, "preview": "# Airline Agent Policy\n\nThe current time is 2024-05-15 15:00:00 EST.\n\nAs an airline agent, you can help users **book**, **modify**, or **cancel** flight reservations. You also handle **refunds and compensation**.\n\nBefore taking any actions that update the booking database (booking, modifying flights, editing baggage, changing cabin class, or updating passenger information), you must list the action details and obtain explicit user confirmation (yes) to proceed.\n\nYou should not provide any information, knowledge, or procedures not provided by the user or available tools, or give subjective recommendations or comments.\n\nYou should only make one tool call at a time, and if you make a tool call, you should not respond to the user simultaneously. If you respond to the user, you should not make a tool call at the same time.\n\nYou should deny user requests that are against this policy.\n\nYou should transfer the user to a human agent if and only if the request cannot be handled within the scope of your actions. To transfer, first make a tool call to transfer_to_human_agents, and then send the message 'YOU ARE BEING TRANSFERRED TO A HUMAN AGENT. PLEASE HOLD ON.' to the user.\n\n## Domain Basic\n\n### User\nEach user has a profile containing:\n- user id\n- email\n- addresses\n- date of birth\n- payment methods\n- membership level\n- reservation numbers\n\nThere are three types of payment methods: **credit card**, **gift card**, **travel certificate**.\n\nThere are three membership levels: **regular**, **silver**, **gold**.\n\n### Flight\nEach flight has the following attributes:\n- flight number\n- origin\n- destination\n- scheduled departure and arrival time (local time)\n\nA flight can be available at multiple dates. For each date:\n- If the status is **available**, the flight has not taken off, available seats and prices are listed.\n- If the status is **delayed** or **on time**, the flight has not taken off, cannot be booked.\n- If the status is **flying**, the flight has taken off but not landed, cannot be booked.\n\nThere are three cabin classes: **basic economy**, **economy**, **business**. **basic economy** is its own class, completely distinct from **economy**.\n\nSeat availability and prices are listed for each cabin class.\n\n### Reservation\nEach reservation specifies the following:\n- reservation id\n- user id\n- trip type\n- flights\n- passengers\n- payment methods\n- created time\n- baggages\n- travel insurance information\n\nThere are two types of trip: **one way** and **round trip**.\n\n## Book flight\n\nThe agent must first obtain the user id from the user. \n\nThe agent should then ask for the trip type, origin, destination.\n\nCabin:\n- Cabin class must be the same across all the flights in a reservation. \n\nPassengers: \n- Each reservation can have at most five passengers. \n- The agent needs to collect the first name, last name, and date of birth for each passenger. \n- All passengers must fly the same flights in the same cabin.\n\nPayment: \n- Each reservation can use at most one travel certificate, at most one credit card, and at most three gift cards. \n- The remaining amount of a travel certificate is not refundable. \n- All payment methods must already be in user profile for safety reasons.\n\nChecked bag allowance: \n- If the booking user is a regular member:\n  - 0 free checked bag for each basic economy passenger\n  - 1 free checked bag for each economy passenger\n  - 2 free checked bags for each business passenger\n- If the booking user is a silver member:\n  - 1 free checked bag for each basic economy passenger\n  - 2 free checked bag for each economy passenger\n  - 3 free checked bags for each business passenger\n- If the booking user is a gold member:\n  - 2 free checked bag for each basic economy passenger\n  - 3 free checked bag for each economy passenger\n  - 4 free checked bags for each business passenger\n- Each extra baggage is 50 dollars.\n\nDo not add checked bags that the user does not need.\n\nTravel insurance: \n- The agent should ask if the user wants to buy the travel insura \u2026[+3676 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/reference/data_model.py", "size": 10402, "preview": "from typing import Annotated, Any, Dict, List, Literal, Optional, Union\n\nfrom pydantic import BaseModel, Field\n\nfrom tau2.domains.airline.utils import AIRLINE_DB_PATH\nfrom tau2.environment.db import DB\n\nFlightType = Literal[\"round_trip\", \"one_way\"]\nCabinClass = Literal[\"business\", \"economy\", \"basic_economy\"]\nInsurance = Literal[\"yes\", \"no\"]\n\n\nMembershipLevel = Annotated[\n    Literal[\"gold\", \"silver\", \"regular\"], Field(description=\"Membership level\")\n]\n\n\nclass AirportCode(BaseModel):\n    iata: str = Field(description=\"IATA code\")\n    city: str = Field(description=\"City name\")\n\n\nAirportInfo = Annotated[list[AirportCode], Field(description=\"Airport information\")]\n\n\nclass Name(BaseModel):\n    first_name: str = Field(description=\"The person's first name\")\n    last_name: str = Field(description=\"The person's last name\")\n\n\nclass Address(BaseModel):\n    address1: str = Field(description=\"Primary address line\")\n    address2: Optional[str] = Field(\n        None, description=\"Secondary address line (optional)\"\n    )\n    city: str = Field(description=\"City name\")\n    country: str = Field(description=\"Country name\")\n    state: str = Field(description=\"State or province name\")\n    zip: str = Field(description=\"Postal code\")\n\n\n# Payment Related Models\nclass Payment(BaseModel):\n    payment_id: str = Field(description=\"Unique identifier for the payment\")\n    amount: int = Field(description=\"Payment amount in dollars\")\n\n\nclass PaymentMethodBase(BaseModel):\n    source: str = Field(description=\"Type of payment method\")\n    id: str = Field(description=\"Unique identifier for the payment method\")\n\n\nclass CreditCard(PaymentMethodBase):\n    source: Literal[\"credit_card\"] = Field(\n        description=\"Indicates this is a credit card payment method\"\n    )\n    brand: str = Field(description=\"Credit card brand (e.g., visa, mastercard)\")\n    last_four: str = Field(description=\"Last four digits of the credit card\")\n\n\nclass GiftCard(PaymentMethodBase):\n    source: Literal[\"gift_card\"] = Field(\n        description=\"Indicates this is a gift card payment method\"\n    )\n    amount: float = Field(description=\"Gift card value amount\")\n    id: str = Field(description=\"Unique identifier for the gift card\")\n\n\nclass Certificate(PaymentMethodBase):\n    source: Literal[\"certificate\"] = Field(\n        description=\"Indicates this is a certificate payment method\"\n    )\n    amount: float = Field(description=\"Certificate value amount\")\n\n\nPaymentMethod = Union[CreditCard, GiftCard, Certificate]\n\n\nclass Passenger(BaseModel):\n    first_name: str = Field(description=\"Passenger's first name\")\n    last_name: str = Field(description=\"Passenger's last name\")\n    dob: str = Field(description=\"Date of birth in YYYY-MM-DD format\")\n\n\nSeatPrices = Annotated[\n    dict[CabinClass, int], Field(description=\"Prices for different cabin classes\")\n]\nAvailableSeats = Annotated[\n    dict[CabinClass, int],\n    Field(description=\"Available seats for different cabin classes\"),\n]\n\n\nclass FlightDateStatusAvailable(BaseModel):\n    status: Literal[\"available\"] = Field(\n        description=\"Indicates flight is available for booking\"\n    )\n    available_seats: AvailableSeats = Field(description=\"Available seats by class\")\n    prices: SeatPrices = Field(description=\"Current prices by class\")\n\n\nclass FlightDataStatusOnTime(BaseModel):\n    status: Literal[\"on time\"] = Field(description=\"Indicates flight is on time\")\n    estimated_departure_time_est: str = Field(\n        description=\"Estimated departure time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T06:04:00\"\n    )\n    estimated_arrival_time_est: str = Field(\n        description=\"Estimated arrival time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T07:30:00\"\n    )\n\n\nclass FlightDataStatusFlying(BaseModel):\n    status: Literal[\"flying\"] = Field(description=\"Indicates flight is in flight\")\n    actual_departure_time_est: str = Field(\n        description=\"Actual departure time in EST in the format YYYY-MM-DDTHH:MM:SS, e.g 2024-05-15T06:04:0 \u2026[+6402 chars truncated]", "truncated": true, "binary": false}, {"path": "seed_capability/tools/tools.py", "size": 22922, "preview": "\"\"\"Airline tool set for the tau2-bench airline domain.\n\nThe ``AirlineTools`` class subclasses tau2's ``AirlineTools`` (to inherit the\nprivate helpers \u2014 ``_get_user``, ``_get_reservation``, ``_search_direct_flight``,\n... \u2014 and the ``ToolKitBase`` machinery) and re-declares every agent-callable tool\nwith its real tau2 body (copied verbatim from ``tau2.domains.airline.tools``).\n\nThe module-level ``REMOVE_TOOLS`` set names any tools to drop from the exposed\nagent toolset (empty by default; the seed exposes tau2's default airline tools).\n\nNote: this file does NOT use ``from __future__ import annotations``. Tool\ns         Book a reservation.\n\n        Args:\n            user_id: The ID of the user to book the reservation such as 'sara_doe_496'`.\n            origin: The IATA code for the origin city such as 'SFO'.\n            destination: The IATA code for the destination city such as 'JFK'.\n            flight_type: The type of flight such as 'one_way' or 'round_trip'.\n            cabin: The cabin class such as 'basic_economy', 'economy', or 'business'.\n            flights: An array of objects containing details about each piece of flight.\n            passengers: An array of objects containing details about each passenger.\n            payment_methods: An array of objects containing details about each payment method.\n            total_baggages: The total number of baggage items to book the reservation.\n            nonfree_baggages: The number of non-free baggage items to book the reservation.\n            insurance: Whether the reservation has insurance.\n        \"\"\"\n        if all(isinstance(flight, dict) for flight in flights):\n            flights = [FlightInfo(**flight) for flight in flights]\n        if all(isinstance(passenger, dict) for passenger in passengers):\n            passengers = [Passenger(**passenger) for passenger in passengers]\n        if all(isinstance(payment_method, dict) for payment_method in payment_methods):\n            payment_methods = [\n                Payment(**payment_method) for payment_method in payment_methods\n            ]\n \u2026[+18918 chars truncated]", "truncated": true, "binary": false}]}, "host_session": {}, "decisions": [{"t": 1795614908.2036023, "id": "cand_0001", "decision": "reject", "evidence": {}, "rationale": "paired \u0394\u0304=+0.0167 <= 0.2\u00b7SE=0.0265 (SE=0.1325, n=10, resolvable effect size 2\u00b7SE=0.2650)", "optimizer_usd": null}, {"t": 1795616241.9464376, "id": "cand_0002", "decision": "accept", "evidence": {}, "rationale": "paired \u0394\u0304=+0.3167 > 0.2\u00b7SE=0.0324 (SE=0.1619, n=10, resolvabl e, then execute immediately.** List the action details, ask the user to confirm, and the moment the user confirms (e.g. says \"yes\"), CALL the write tool right away. Do not ask for confirmation a second time and do not end your turn after a \"yes\" without making the write call \u2014 the change only counts once the tool is actually called."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**R2 \u2014 Identify the RIGHT reservation before any write; never guess.** When a user has more than one reservation, do NOT act on the first-listed or a guessed reservation id. First call `get_user_details(user_id)` to get their reservation ids, then call `get_reservation_details` on the candidates, and write ONLY to the reservation whose origin, destination, dates and cabin match the trip the user is describing."}, {"t": "add", "l": "+  - *Worked example:* user says \"change my New York \u2192 Chicago flight\" and has reservations `AAA111` (Seattle\u2194Dallas) and `BBB222` (EWR\u2192ORD). EWR is in the New York area and ORD is Chicago, so the correct target is `BBB222`. Acting on `AAA111` because it was listed first is wrong and scores zero."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+**R3 \u2014 State the EXACT dollar total you charged or refunded.** Whenever a booking, modification, or cancellation moves money, your message to the user MUST contain the exact total dollar amount, summed across ALL passengers (not the per-passenger amount). The write tools return a `payment_summary` field with this exact number \u2014 read it and repeat that number verbatim in your reply."}, {"t": "add", "l": "+  - *Worked example:* a tool returns `\"payment_summary\": \"Total refunded to the user for this change: $5244.0 ...\"`. You must say the number 5244 (e.g. \"You'll be refunded $5,244.00\") \u2014 stating only the per-passenger figure ($1,748) is wrong and the task is marked incomplete."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Domain Basic"}, {"t": "hunk", "l": "@@ -116,4 +128 ": "+"}, {"t": "add", "l": "+def _coerce_payment(pm: \"Payment | dict\") -> \"Payment\":"}, {"t": "add", "l": "+    \"\"\"Normalize ONE payment entry into a ``Payment``."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    The mid-capability model often emits malformed payment dicts such as"}, {"t": "add", "l": "+    ``{'id': 'certificate_8045380', 'type': 'certificate'}`` (missing the"}, {"t": "add", "l": "+    required ``payment_id`` and ``amount`` keys that ``Payment`` needs). This"}, {"t": "add", "l": "+    accepts ``id`` as an alias for ``payment_id`` and defaults a missing"}, {"t": "add", "l": "+    ``amount`` to ``0`` (the amount is reconciled later against the computed"}, {"t": "add", "l": "+    total). Already-valid ``Payment`` objects and well-formed dicts pass through"}, {"t": "add", "l": "+    unchanged. Fires only on a malformed dict; a correct payment is unaffected."}, {"t": "add", "l": "+    \"\"\""}, {"t": "add", "l": "+    if isinstance(pm, Payment):"}, {"t": "add", "l": "+        return pm"}, {"t": "add", "l": "+    if isinstance(pm, dict):"}, {"t": "add", "l": "+        d = dict(pm)"}, {"t": "add", "l": "+        payment_id = d.get(\"payment_id\") or d.get(\"id\")"}, {"t": "add", "l": "+        if payment_id is None:"}, {"t": "add", "l": "+            # Nothing we can do: let Payment raise its normal validation error."}, {"t": "add", "l": "+            return Payment(**d)"}, {"t": "add", "l": "+        amount = d.get(\"amount\")"}, {"t": "add", "l": "+        if amount is None:"}, {"t": "add", "l": "+            amount = 0"}, {"t": "add", "l": "+        return Payment(payment_id=payment_id, amount=amount)"}, {"t": "add", "l": "+    return pm"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def _payment_summary(amount: float) -> str:"}, {"t": "add", "l": "+    \"\"\"Human-readable, exact charge/refund line for the tool RETURN only."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    Returns are NOT part of the graded DB state, so cause cancel/update must stay refusable. Prose-mitigated only.\"},"}, {"t": "add", "l": "+    {\"title\": \"task 23 multi-certificate split (327/1000/1286)\", \"reason\": \"no safe 'which certificate absorbs' rule; low recovery, deprioritized.\"},"}, {"t": "add", "l": "+    {\"title\": \"REMOVE_TOOLS + single mandatory modify_reservation + read-only quote_change\", \"reason\": \"reserve structural lever; bigger blast radius. Next lever if 17/22/37 persist after this round's guards+prose (memory-verified gold for 11/12/17/22/37).\"}"}, {"t": "add", "l": "+  ],"}, {"t": "add", "l": "+  \"techniques\": ["}, {"t": "add", "l": "+    \"keep-proven-levers-add-power (per reject hint: POWER/SIZE not redesign)\","}, {"t": "add", "l": "+    \"deterministic code enforcement over prose for rules the mid model skips\","}, {"t": "add", "l": "+    \"block-only guard with a superset allowed-set (zero legit-cancel regression)\","}, {"t": "add", "l": "+    \"DB-safe enriched returns (returns not hashed) for COMMUNICATE\","}, {"t": "add", "l": "+    \"worked-example policy rules for the mid (gpt-oss-120b) reader\","}, {"t": "add", "l": "+    \"softness clause (Strategy 4) so reward outranks the letter of any single rule\","}, {"t": "add", "l": "+    \"live-DB verification of every code lever against this run's FlightDB before shipping\""}, {"t": "add", "l": "+  ]"}, {"t": "add", "l": "+}"}]}, {"file": "policy/policy.md", "rows": [{"t": "hunk", "l": "@@ -14,4 +14,32 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " You should transfer the user to a human agent if and only if the request cannot be handled within the scope of your actions. To transfer, first make a tool call to transfer_to_human_agents, and then send the message 'YOU ARE BEING TRANSFERRED TO A HUMAN AGENT. PLEASE HOLD ON.' to the user."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+## How to execute changes correctly (follow these steps exactly)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+Your single goal is to complete the user's request so that both the final booking-database state AND everything you tell the user match what a correct agent would produce \u2014 that is what earns full credit. Follow the numbered rules below exactly: each one fixes a specific mistake that otherwise makes the whole task score zero. If \u2014 and ONLY if \u2014 you judge that following one of these rules literally would prevent you from completing a particular user's request correctly, use your judgment and do what actually completes the task at full credit; getting the task right always outranks the letter of any single rule here."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### R1. Pick the RIGHT reservation when the user has more than one"}, {"t": "add", "l": "+A user can have several reservations, and the one you need is often NOT the first one listed. Before any change, call `get_user_details`, then `get_reservation_details` on the candidate ids, and act ONLY on the reservation whose origin and destination cities match the trip the user described. Never act on a guessed id, and never default to the first-listed reservation just because it is first."}, {"t": "add", "l": "+- Worked example: the user says \"my trip from New York to Chicago\". You see `UM3OG5` (SEA\u2192DFW) and `FQ8APE` (EWR\u2192ORD). New York = EWR/JFK/LGA and Chicago = ORD, so the correct reservation is `FQ8APE`. Make every requested change on `FQ8APE`, not `UM3OG5`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### R2. Changing a passenger's NAME: reuse the existing date of birth, and send the full list"}, {"t": "add", "l": "+`update_reservation_passengers` needs the COMPLETE passenger list (first name, last name, dob for EVERY passenger on the reservation \u2014 not just the one who changed). When only a name changes, the date of birth is unchanged: read it from `get_reservation_details` and reuse it. Do NOT ask the user for a dob they did not change, and do NOT transfer just because they will not repeat it."}, {"t": "add", "l": "+- Worked example: reservation has `[Anya Garcia 1992-11-12, Mei Lee 1989-12-13]` and the user renames \"Mei Lee\" to \"Mei Garcia\". Call `update_reservation_passengers` with BOTH passengers: `[{Anya Garcia, 1992-11-12}, {Mei Garcia, 1989-12-13}]` \u2014 Mei keeps dob 1989-12-13."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### R3. Adding checked bags: ALWAYS record the change, even when the bags are free"}, {"t": "add", "l": "+Whenever the user adds checked bags you MUST call `update_reservation_baggages` with the new `total_baggages`, even if every added bag is within the free allowance and there is no charge \u2014 the new bag count still has to be written. Free allowance = (per-passenger allowance for the user's membership and cabin) \u00d7 (number of passengers); `nonfree_baggages` is only the bags BEYOND that (the tool also recomputes this for you). Never skip the call just because nothing is charged."}, {"t": "add", "l": "+- Worked example: gold member, economy, 2 passengers \u2192 3 free bags each = 6 free. User adds bags for a new total of 2. Since 2 \u2264 6, `nonfree_baggages = 0` and there is no charge \u2014 but you STILL call `update_reservation_baggages(total_baggages=2, nonfree_baggages=0)`."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### R4. Changing cabin (upgrade or downgrade): keep the SAME flights"}, {"t": "add", "l": "+To change ONLY the cabin class without changing which flights the user takes, call `update_reservation_flights` with the SAME flight segments already on the reservation (identical `flight_number` and `date` for every segment) and the new `cabin`. Do NOT search for or substitute different flights. Change flight numbers only when the user explicitly asks to fly different flights."}, {"t": "add", "l": "+- Worked example: `GV1N64` is business on HAT003 (2024-05-19) + HAT290 (2024-05-20); the user wants basic economy. Call `update_reservation_flights(cabin='basic_economy', flights=[HAT003 2024-05-19, HAT290 2024-05-20])` \u2014 the same two segments, new cabin."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### R5. State the EXACT total dollar amount, summed across ALL passengers"}, {"t": "add", "l": "+When a change produces a charge or a refund, tell the user the exact TOTAL dollar amount across ALL passengers \u2014 never the per-passenger figure. Every write tool returns a `payment_summary` field with this exact number already computed; state that number verbatim."}, {"t": "add", "l": "+- Worked example: a downgrade refunds $1748 per passenger on a 3-passenger reservation \u2192 total refund = 1748 \u00d7 3 = $5244. Tell the user \"$5244\" (the figure in `payment_summary`), never just \"$1748\"."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+### R6. Cancel ONLY when the policy allows it"}, {"t": "add", "l": "+Before cancelling, confirm the reservation is eligible. You may cancel ONLY if at least one of these holds: (a) it was booked within the last 24 hours; (b) a flight in it was cancelled by the airline; (c) it is a business-cabin reservation; (d) the user has travel insurance AND the cancellation reason is covered (health or weather). If none holds, do NOT cancel \u2014 tell the user it is not eligible for cancellation. If any portion of the trip has already been flown, you cannot cancel; transfer to a human agent. (`cancel_reservation` now enforces this and will refuse an ineligible cancellation with an explanation \u2014 do not retry it.)"}, {"t": "add", "l": "+- Worked example: a basic-economy reservation booked 3 days ago, no insurance, reason \"change of plans\" \u2014 none of (a)-(d) holds, so you do NOT cancel it and tell the user it cannot be cancelled."}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " ## Domain Basic"}]}, {"file": "tools/tools.py", "rows": [{"t": "hunk", "l": "@@ -17,4 +17,5 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " from copy import deepcopy"}, {"t": "add", "l": "+from datetime import datetime, timedelta"}, {"t": "ctx", "l": " from typing import List, Literal, Optional  # noqa: F401  (available for tool signatures)"}, {"t": "ctx", "l": " "}, {"t": "hunk", "l": "@@ -48,4 +49,94 @@"}, {"t": "ctx", "l": " "}, {"t": "ctx", "l": " "}, {"t": "add", "l": "+# --- Domain constants (straight from policy.md) -----------------------------"}, {"t": "add", "l": "+# The policy states the current time as 2024-05-15 15:00:00 EST."}, {"t": "add", "l": "+_CURRENT_TIME = datetime(2024, 5, 15, 15, 0, 0)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+# Free checked-bag allowance PER PASSENGER by membership level and cabin class"}, {"t": "add", "l": "+# (policy.md \"Checked bag allowance\"). Any bag beyond this is a paid (nonfree)"}, {"t": "add", "l": "+# bag at $50 each."}, {"t": "add", "l": "+_FREE_BAGGAGE = {"}, {"t": "add", "l": "+    \"regular\": {\"basic_economy\": 0, \"economy\": 1, \"business\": 2},"}, {"t": "add", "l": "+    \"silver\": {\"basic_economy\": 1, \"economy\": 2, \"business\": 3},"}, {"t": "add", "l": "+    \"gold\": {\"basic_economy\": 2, \"economy\": 3, \"business\": 4},"}, {"t": "add", "l": "+}"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def _free_baggage_allowance(membership: str, cabin: str, n_passengers: int) -> int:"}, {"t": "add", "l": "+    \"\"\"Total free checked bags for a reservation = per-passenger free allowance"}, {"t": "add", "l": "+    (by membership + cabin, from policy) times the number of passengers.\"\"\""}, {"t": "add", "l": "+    per_pax = _FREE_BAGGAGE.get(membership, {}).get(cabin, 0)"}, {"t": "add", "l": "+    return per_pax * n_passengers"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def _recompute_nonfree_baggages("}, {"t": "add", "l": "+    total_baggages: int, membership: str, cabin: str, n_passengers: int"}, {"t": "add", "l": "+) -> int:"}, {"t": "add", "l": "+    \"\"\"Return the POLICY-CORRECT number of paid (nonfree) bags:"}, {"t": "add", "l": "+    ``max(0, total_baggages - free_allowance)``. The model frequently miscounts"}, {"t": "add", "l": "+    this (charging for bags that are within the free allowance, or vice versa);"}, {"t": "add", "l": "+    the reservation price is driven off nonfree_baggages, so an off-by-N here"}, {"t": "add", "l": "+    corrupts the stored DB state. This is pure policy arithmetic, so it equals"}, {"t": "add", "l": "+    the gold value and is a no-op whenever the model already passed the right"}, {"t": "add", "l": "+    number.\"\"\""}, {"t": "add", "l": "+    free = _free_baggage_allowance(membership, cabin, n_passengers)"}, {"t": "add", "l": "+    return max(0, int(total_baggages) - free)"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def _normalize_payment_dicts(payment_methods: list) -> list:"}, {"t": "add", "l": "+    \"\"\"Coerce loosely-shaped payment dicts into the ``{payment_id, amount}``"}, {"t": "add", "l": "+    shape ``Payment`` expects. The model often emits ``{'type': ..., 'id': ...}``"}, {"t": "add", "l": "+    or omits ``amount``; those raise on ``Payment(**d)``. Non-dict items (already"}, {"t": "add", "l": "+    ``Payment`` objects) pass through untouched.\"\"\""}, {"t": "add", "l": "+    out = []"}, {"t": "add", "l": "+    for pm in payment_methods:"}, {"t": "add", "l": "+        if isinstance(pm, dict):"}, {"t": "add", "l": "+            d = dict(pm)"}, {"t": "add", "l": "+            if \"payment_id\" not in d and \"id\" in d:"}, {"t": "add", "l": "+                d[\"payment_id\"] = d[\"id\"]"}, {"t": "add", "l": "+            # keep only the fields Payment accepts"}, {"t": "add", "l": "+            clean = {}"}, {"t": "add", "l": "+            if \"payment_id\" in d:"}, {"t": "add", "l": "+                clean[\"payment_id\"] = d[\"payment_id\"]"}, {"t": "add", "l": "+            clean[\"amount\"] = d.get(\"amount\", 0)"}, {"t": "add", "l": "+            out.append(clean)"}, {"t": "add", "l": "+        else:"}, {"t": "add", "l": "+            out.append(pm)"}, {"t": "add", "l": "+    return out"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+"}, {"t": "add", "l": "+def _reconcile_payment_amounts(payment_methods: list, total_price: int) -> None:"}, {"t": "add", "l": "+    \"\"\"When the provided payment amounts do not sum to the computed total price,"}, {"t": "add", "l": "+    repair the amounts IN PLACE so the booking still goes through with the"}, {"t": "add", "l": "+    correct split (the base tool otherwise hard-raises \"Payment amount does not"}, {"t": "add", "l": "+    add up\"). Fires ONLY on a mismatch, so a correct booking is untouched."}, {"t": "add", "l": "+"}, {"t": "add", "l": "+    Rules (deterministic, policy-safe):"}, {"t": "add", "l": "+      * exactly one payment method  -> it pays the whole total;"}, {"t": "add", "l": "+      * exactly one credit card     -> the credit card absorbs the remainder"}, {"t": "add", "l": "+                                        after the other (fixed-value gift"}, {"t": "add", "l": "+                                        card / certificate) amounts;"}, {"t": "add", "l": "+      * otherwise                    -> leave untouched (cannot safely infer the"}, {"t": "add", "l": "+                                        split; the base tool will raise)."}, {"t": "add", "l": "+    ``payment_methods`` is a list of ``Payment`` objects (``.amount`` is set).\"\"\""}, {"t": "add", "l": "+    current = sum(p.amount for p in payment_methods)"}, {"t": "add", "l": "+    if current == total_price:"}, {"t": "add", "l": "+        return"}, {"t": "add", "l": "+    if len(payment_methods) == 1:"}, {"t": "add", "l": "+        payment_methods[0].amount = total_price"}, {"t": "add", "l": "+        return"}, {"t": "add", "l": "+    # Identify a single credit card by id prefix (ids look like 'credit_card_123')."}, {"t": "add", "l": "+    cc = [p for p in payment_methods if str(p.payment_id).startswith(\"credit_card\")]"}, {"t": "add", "l": "+    if len(cc) == 1:"}, {"t": "add", "l": "+        others = sum(p.amount for p in payment_methods if p
